name: clice

# Promotes already-built, already-tested packages to a release. There is no
# release build: every CI run on main packages the binaries its test suites
# just validated (see test-leg.yml), and this workflow
# only downloads those artifacts from the green run of the tagged commit,
# renames them to their asset names, attaches them to the release, and then
# publishes the release. It also re-uploads the packages into the current run
# so publish-vscode.yml can bundle them.
#
# The release is a draft until every platform archive is attached: drafts are
# hidden from anyone without push access, so no user's editor extension
# picking the newest release meets one that lacks its platform's archive.
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

jobs:
  locate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Locate the green build run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          # Resolve the tag itself rather than trusting GITHUB_SHA: a
          # nightly dispatch tags the commit it verified, which can lag the
          # branch tip captured when this run was triggered.
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" \
            --workflow main --branch main --event push --status success \
            --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::no green main run found for $TAG ($SHA) — releases only promote tested builds"
            exit 1
          fi
          # A green run may still have nothing to promote: path-filtered
          # runs (e.g. docs-only commits) skip the build jobs, and package
          # artifacts expire after 30 days. Check every package here so a
          # partial run fails with one clear message before any asset is
          # uploaded, instead of promoting an incomplete release.
          MISSING=""
          for NAME in package-clice.x86_64-unknown-linux-gnu.tar.gz \
                      package-clice.aarch64-unknown-linux-gnu.tar.gz \
                      package-clice.aarch64-apple-darwin.tar.gz \
                      package-clice.x86_64-apple-darwin.tar.gz \
                      package-clice.x86_64-w64-mingw32.zip \
                      package-clice.aarch64-w64-mingw32.zip; do
            LIVE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=$NAME" \
              --jq '[.artifacts[] | select(.expired | not)] | length')
            if [ "$LIVE" -eq 0 ]; then
              MISSING="$MISSING $NAME"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::run $RUN_ID for $TAG is missing live package artifacts:$MISSING (path-filtered build, or expired after 30 days) — rerun that commit's main workflow first"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # Stable tag pushes arrive without a release object (nightly creates
      # its own draft before dispatching); create it so `gh release upload`
      # in the promote matrix has a target. gh finds drafts by tag too. A
      # release already published, e.g. one created on the releases page,
      # would show its archives one platform at a time, so it is refused.
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if ! DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft 2> /dev/null); then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TAG" --generate-notes
          elif [ "$DRAFT" != true ]; then
            echo "::error::release $TAG is already published; turn it back into a draft (gh release edit $TAG --draft=true) and rerun"
            exit 1
          fi

  promote:
    needs: locate
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            ext: tar.gz
            symbol_ext: tar.xz
          - triple: aarch64-unknown-linux-gnu
            ext: tar.gz
            symbol_ext: tar.xz
          - triple: aarch64-apple-darwin
            ext: tar.gz
            symbol_ext: tar.xz
          - triple: x86_64-apple-darwin
            ext: tar.gz
            symbol_ext: tar.xz
          - triple: x86_64-w64-mingw32
            ext: zip
            symbol_ext: zip
          - triple: aarch64-w64-mingw32
            ext: zip
            symbol_ext: zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download package from the build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ needs.locate.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" -n "package-clice.${{ matrix.triple }}.${{ matrix.ext }}" -D pkg

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ASSET="clice-${VERSION}.${{ matrix.triple }}.${{ matrix.ext }}"
          SYMBOL_ASSET="clice-${VERSION}.${{ matrix.triple }}.symbols.${{ matrix.symbol_ext }}"
          cd pkg
          mv clice.tar.gz "$ASSET" 2>/dev/null || mv clice.zip "$ASSET"
          mv clice-symbol.tar.xz "$SYMBOL_ASSET" 2>/dev/null \
            || mv clice-symbol.zip "$SYMBOL_ASSET"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --clobber "$ASSET" "$SYMBOL_ASSET"

      # Bridge for publish-vscode.yml: restore the inner file names the
      # staging step expects.
      - name: Restore inner file names
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          cd pkg
          case "${{ matrix.ext }}" in
            zip) mv "clice-${VERSION}.${{ matrix.triple }}.zip" clice.zip ;;
            *)   mv "clice-${VERSION}.${{ matrix.triple }}.tar.gz" clice.tar.gz ;;
          esac

      - name: Re-upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-clice.${{ matrix.triple }}.${{ matrix.ext }}
          path: |
            pkg/clice.tar.gz
            pkg/clice.zip
          if-no-files-found: error
          retention-days: 7

  # Only after every leg of the matrix succeeded; a failed leg leaves the
  # draft for `gh run rerun --failed`.
  publish:
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
