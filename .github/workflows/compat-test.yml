name: compat-test

# Real build systems and compilers (tests/compat): called from main for
# changes to command handling, with that run's build; weekly and on demand
# with the newest release and the commit it was built from, so a compiler
# or build-tool release that breaks command handling shows up without a
# code change.
on:
  workflow_call:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: x86_64-unknown-linux-gnu.tar.gz
          - os: windows-2025
            asset: x86_64-w64-mingw32.zip
          - os: macos-15
            asset: aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Pick the newest release
        id: release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup-pixi
        with:
          environments: node

      # The Windows and macOS scenarios use what the runner images ship
      # (Visual Studio, LLVM, MinGW; Xcode, Homebrew GCC and LLVM), and
      # the Linux image already has gcc, clang, cmake, make and bazelisk.
      - name: Install build systems and cross compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bear ccache meson ninja-build xmake emscripten \
            g++-mingw-w64-x86-64 g++-riscv64-linux-gnu \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Install zig
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"

      - name: Download binaries
        if: steps.release.outputs.tag == ''
        uses: actions/download-artifact@v8
        with:
          name: native-build-${{ matrix.os }}-RelWithDebInfo
          path: build/RelWithDebInfo/

      - name: Download the release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "clice-*.${{ matrix.asset }}" --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && cmake -E tar xf clice-*)
          mkdir -p build/RelWithDebInfo
          cp -r "$RUNNER_TEMP/release/clice/bin" "$RUNNER_TEMP/release/clice/lib" build/RelWithDebInfo/

      - name: Make binaries executable
        run: chmod +x build/RelWithDebInfo/bin/*

      - name: Compat tests
        timeout-minutes: 15
        run: pixi run -e node compat-test RelWithDebInfo
