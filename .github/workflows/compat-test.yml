name: compat-test

# Real build systems and compilers (tests/compat) on one platform: with every
# build, the platform's programs; on compat-release's schedule, the newest release
# and the commit it was built from, so a compiler or build-tool release that
# breaks command handling shows up without a code change.
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CYGWIN_PACKAGES: gcc-core gcc-g++ cmake ninja

jobs:
  # The Linux scenarios run in the image compat-image.yml pushes under the
  # Dockerfile's hash. A Dockerfile a branch changed has no image until that
  # workflow's run on the push finished. The container gets an init process:
  # the job's own first process reaps no orphan, and `bazel shutdown` waits
  # for its server to be gone.
  image:
    if: startsWith(inputs.os, 'ubuntu')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      container: ${{ steps.image.outputs.container }}
    steps:
      - name: Checkout the Dockerfile
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tests/compat/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Find the image
        id: image
        run: |
          image=ghcr.io/clice-io/compat-linux:$(sha256sum tests/compat/Dockerfile | cut -d' ' -f1)
          if ! docker manifest inspect "$image" > /dev/null; then
            echo "::error::$image is not pushed: compat-image.yml pushes it for a tests/compat/Dockerfile on a branch of clice-io/clice, on the push or by hand; rerun once it has"
            exit 1
          fi
          echo "container={\"image\": \"$image\", \"options\": \"--init\"}" >> "$GITHUB_OUTPUT"

  compat:
    needs: image
    if: ${{ !cancelled() && needs.image.result != 'failure' }}
    runs-on: ${{ inputs.os }}
    container: ${{ needs.image.outputs.container && fromJSON(needs.image.outputs.container) || '' }}
    timeout-minutes: 90
    steps:
      - name: Pick the newest release
        id: release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      # The `cuda` and `toolchains` environments hold nvcc and conda's
      # compilers for the Linux scenarios, `toolchains` Intel's and nvcc for
      # the Windows ones too, and have no packages elsewhere; a release
      # older than one of them neither declares nor uses it.
      - name: Pick the pixi environments
        id: environments
        run: |
          environments=node
          case "$RUNNER_OS" in
            Linux) names="cuda toolchains" ;;
            Windows) names="toolchains" ;;
            *) names="" ;;
          esac
          for name in $names; do
            if grep -q "^$name = " pixi.toml; then
              environments="$environments $name"
            fi
          done
          echo "names=$environments" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-pixi
        with:
          environments: ${{ steps.environments.outputs.names }}
          activate-environment: node

      # The Linux scenarios' programs beside the pixi environments' are all
      # in the job's image; the Windows and macOS scenarios use what the
      # runner images ship (Visual Studio, LLVM replaced below, MinGW; Xcode,
      # Homebrew GCC and LLVM).
      # The scenarios find CMake 4.5 in the home directory, which the job
      # gives the container its own of.
      - name: Link CMake 4.5 into the home directory
        if: runner.os == 'Linux'
        run: ln -s /opt/cmake-4.5 ~/cmake-4.5

      # MSYS2 ships on the image without compilers: its UCRT and clang
      # environments' native ones, and its own GCC and CMake, which write
      # POSIX paths. The image is upgraded whole before they install: a new
      # package beside the image's older libraries fails to load (libarchive
      # built for OpenSSL 4 beside OpenSSL 3). pacman upgrades the core alone
      # first and stops, as a transaction replacing the runtime cannot fork
      # afterwards; the second call upgrades the rest and installs. MSYS2 has
      # no versions to key its packages by: the week's first run saves the
      # packages it installed, and the week's later runs download only what
      # was released since.
      - name: Name the week
        if: runner.os == 'Windows'
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache MSYS2's packages
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-${{ steps.week.outputs.week }}
          restore-keys: msys2-

      - name: Install MSYS2's compilers
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: |
          pacman() {
            for _ in 1 2 3; do
              C:/msys64/usr/bin/pacman.exe --noconfirm "$@" && return
              sleep 30
            done
            return 1
          }
          pacman -Syu --needed
          pacman -Su --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-clang-x86_64-clang gcc cmake ninja
          # The cache keeps only the versions now installed.
          pacman -Sc

      # The image's Visual Studio ships an STL that accepts Clang 22 or newer
      # alone (STL1000) beside an older LLVM, so its clang and clang-cl
      # build nothing: LLVM's release replaces it, its programs and their
      # resource directory, not the libraries and headers to build against
      # LLVM. Its archive needs zstd's long window.
      - name: Cache LLVM
        if: runner.os == 'Windows' && runner.arch == 'X64'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\llvm
          key: llvm-23.1.3-x86_64-pc-windows-msvc

      - name: Install LLVM
        if: runner.os == 'Windows' && runner.arch == 'X64'
        timeout-minutes: 15
        run: |
          name=clang+llvm-23.1.3-x86_64-pc-windows-msvc
          archive=$RUNNER_TEMP/llvm/$name.tar.zst
          if [ ! -f "$archive" ]; then
            mkdir -p "$RUNNER_TEMP/llvm"
            curl -fsSL --retry 5 --retry-all-errors -o "$archive" \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/$name.tar.zst"
          fi
          rm -rf "C:/Program Files/LLVM"
          mkdir "C:/Program Files/LLVM"
          zstd -dc --long=31 "$archive" |
            tar -x -C "C:/Program Files/LLVM" --strip-components=1 "$name/bin" "$name/lib/clang"

      # The `import std` scenarios' CMake: 4.5 is the first without an
      # experimental gate on it.
      - name: Cache CMake 4.5
        if: runner.os == 'Windows'
        id: cmake
        uses: actions/cache@v6
        with:
          path: ~/cmake-4.5
          key: cmake-4.5.0-windows-x86_64

      - name: Install CMake 4.5
        if: runner.os == 'Windows' && steps.cmake.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/cmake.zip" \
            https://github.com/Kitware/CMake/releases/download/v4.5.0/cmake-4.5.0-windows-x86_64.zip
          unzip -q "$RUNNER_TEMP/cmake.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cmake-4.5.0-windows-x86_64" ~/cmake-4.5

      # Cygwin installs from the packages the first run under this key
      # downloaded, kept in the Actions cache, without reaching a mirror: a
      # change of the packages takes a new snapshot.
      - name: Cache Cygwin's packages
        if: runner.os == 'Windows'
        id: cygwin
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\cygwin
          key: cygwin-${{ env.CYGWIN_PACKAGES }}

      - name: Install Cygwin's compilers
        if: runner.os == 'Windows'
        timeout-minutes: 35
        env:
          HIT: ${{ steps.cygwin.outputs.cache-hit }}
        run: |
          dir=$RUNNER_TEMP/cygwin
          setup=("$dir/setup-x86_64.exe" --quiet-mode --no-desktop --no-shortcuts --no-startmenu
            --root 'C:\cygwin64' --local-package-dir "$(cygpath -w "$dir")"
            --packages "${CYGWIN_PACKAGES// /,}")
          if [ "$HIT" = true ]; then
            exec "${setup[@]}" --local-install
          fi
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-all-errors -o "$dir/setup-x86_64.exe" \
            https://cygwin.com/setup-x86_64.exe
          # In quiet mode, setup retries a mirror it cannot reach forever.
          for _ in 1 2 3; do
            timeout 600 "${setup[@]}" --site https://mirrors.kernel.org/sourceware/cygwin/ && exit 0
            sleep 30
          done
          exit 1

      - name: Download binaries
        if: steps.release.outputs.tag == ''
        uses: actions/download-artifact@v8
        with:
          name: build-${{ inputs.target }}-RelWithDebInfo
          path: build/RelWithDebInfo/bin/

      - name: Download the release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "clice-*.${{ inputs.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}" --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && cmake -E tar xf clice-*)
          mkdir -p build/RelWithDebInfo/bin
          cp -r "$RUNNER_TEMP/release/clice/bin" "$RUNNER_TEMP/release/clice/lib" build/RelWithDebInfo/bin/

      - name: Make binaries executable
        run: chmod +x build/RelWithDebInfo/bin/bin/*

      - name: Compat tests
        timeout-minutes: 15
        run: pixi run -e node compat-test RelWithDebInfo
