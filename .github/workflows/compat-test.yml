name: compat-test

# Real build systems and compilers (tests/compat) on one platform: with every
# build, the platform's programs; on compat-release's schedule, the newest release
# and the commit it was built from, so a compiler or build-tool release that
# breaks command handling shows up without a code change.
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compat:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - name: Pick the newest release
        id: release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      # The `cuda` and `toolchains` environments hold nvcc and conda's
      # compilers for the Linux scenarios, `toolchains` Intel's and nvcc for
      # the Windows ones too, and have no packages elsewhere; a release
      # older than one of them neither declares nor uses it.
      - name: Pick the pixi environments
        id: environments
        run: |
          environments=node
          case "$RUNNER_OS" in
            Linux) names="cuda toolchains" ;;
            Windows) names="toolchains" ;;
            *) names="" ;;
          esac
          for name in $names; do
            if grep -q "^$name = " pixi.toml; then
              environments="$environments $name"
            fi
          done
          echo "names=$environments" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-pixi
        with:
          environments: ${{ steps.environments.outputs.names }}
          activate-environment: node

      # The Windows and macOS scenarios use what the runner images ship
      # (Visual Studio, LLVM, MinGW; Xcode, Homebrew GCC and LLVM), and
      # the Linux image already has gcc, clang, cmake, make and bazelisk.
      # An unreachable mirror stalls apt for the job's whole bound.
      - name: Install build systems and cross compilers
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bear ccache meson ninja-build xmake emscripten musl-tools \
            libc++-18-dev libc++abi-18-dev \
            g++-mingw-w64-x86-64 g++-riscv64-linux-gnu \
            g++-aarch64-linux-gnu g++-arm-linux-gnueabihf \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      # MSYS2 ships on the image without compilers: its UCRT and clang
      # environments' native ones, and its own GCC and CMake, which write
      # POSIX paths. The image is upgraded whole before they install: a new
      # package beside the image's older libraries fails to load (libarchive
      # built for OpenSSL 4 beside OpenSSL 3). pacman upgrades the core alone
      # first and stops, as a transaction replacing the runtime cannot fork
      # afterwards; the second call upgrades the rest and installs.
      - name: Install MSYS2's compilers
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: |
          pacman() {
            for _ in 1 2 3; do
              C:/msys64/usr/bin/pacman.exe --noconfirm --needed "$@" && return
              sleep 30
            done
            return 1
          }
          pacman -Syu
          pacman -Su mingw-w64-ucrt-x86_64-gcc mingw-w64-clang-x86_64-clang gcc cmake ninja

      # The `import std` scenarios' CMake: 4.5 is the first without an
      # experimental gate on it.
      - name: Install CMake 4.5
        if: runner.os != 'macOS'
        timeout-minutes: 5
        run: |
          release=https://github.com/Kitware/CMake/releases/download/v4.5.0-rc3
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/cmake.zip" \
              "$release/cmake-4.5.0-rc3-windows-x86_64.zip"
            unzip -q "$RUNNER_TEMP/cmake.zip" -d "$RUNNER_TEMP"
            mv "$RUNNER_TEMP/cmake-4.5.0-rc3-windows-x86_64" ~/cmake-4.5
          else
            curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/cmake.tar.gz" \
              "$release/cmake-4.5.0-rc3-linux-x86_64.tar.gz"
            tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
            mv "$RUNNER_TEMP/cmake-4.5.0-rc3-linux-x86_64" ~/cmake-4.5
          fi

      - name: Install Cygwin's compilers
        if: runner.os == 'Windows'
        timeout-minutes: 35
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/setup-x86_64.exe" \
            https://cygwin.com/setup-x86_64.exe
          # In quiet mode, setup retries a mirror it cannot reach forever.
          for _ in 1 2 3; do
            timeout 600 "$RUNNER_TEMP/setup-x86_64.exe" --quiet-mode --no-desktop --no-shortcuts --no-startmenu \
              --root 'C:\cygwin64' --local-package-dir "$(cygpath -w "$RUNNER_TEMP/cygwin")" \
              --site https://mirrors.kernel.org/sourceware/cygwin/ \
              --packages gcc-core,gcc-g++,cmake,ninja && exit 0
            sleep 30
          done
          exit 1

      - name: Install zig
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"

      - name: Download binaries
        if: steps.release.outputs.tag == ''
        uses: actions/download-artifact@v8
        with:
          name: build-${{ inputs.target }}-RelWithDebInfo
          path: build/RelWithDebInfo/bin/

      - name: Download the release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "clice-*.${{ inputs.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}" --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && cmake -E tar xf clice-*)
          mkdir -p build/RelWithDebInfo/bin
          cp -r "$RUNNER_TEMP/release/clice/bin" "$RUNNER_TEMP/release/clice/lib" build/RelWithDebInfo/bin/

      - name: Make binaries executable
        run: chmod +x build/RelWithDebInfo/bin/bin/*

      - name: Compat tests
        timeout-minutes: 15
        run: pixi run -e node compat-test RelWithDebInfo
