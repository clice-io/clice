name: nightly-projects

# Every night, main's clice over real projects (tests/nightly/projects.json,
# tests/README.md "Outside the topics"): each project, or each part of one
# too large for a runner, prepared, indexed from a cold cache and asked the
# features on sampled files. What fails a job is in tests/README.md; the
# job summary lists each failure with the command that reproduces it,
# beside the previous night's numbers.
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  push:
    branches: [test/nightly-projects]

# A dispatch on a branch replaces the branch's run still going; main's
# nights all finish.
concurrency:
  group: nightly-projects-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  jobs:
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pixi
        with:
          environments: node
          activate-environment: node

      - name: List the jobs
        id: list
        run: |
          pixi run -e node install-tests
          echo "jobs=$(pixi run -e node node tools/nightly/run.ts --jobs)" >> "$GITHUB_OUTPUT"

  # clice for each platform, as test-leg.yml builds it: Windows's on Linux
  # with xclang's toolchain for the target.
  build:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos
            os: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            os: ubuntu-24.04
            target: x86_64-w64-mingw32
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pixi

      # Only restored: the caches are main's CI's (test-leg.yml saves them).
      - name: Restore Bazel caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
            /var/tmp/xclang-thinlto
          key: bazel-${{ matrix.target }}-RelWithDebInfo-${{ github.sha }}
          restore-keys: |
            bazel-${{ matrix.target }}-RelWithDebInfo-

      - name: Build
        run: |
          {
            echo "common --disk_cache=$RUNNER_TEMP/bazel-disk"
            echo "common --repository_cache=$RUNNER_TEMP/bazel-repo"
          } > user.bazelrc
          pixi run -e default build RelWithDebInfo -- \
            ${{ matrix.cross && format('--platforms=@xclang//platforms:{0}', matrix.target) || '' }}

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}-RelWithDebInfo
          include-hidden-files: true
          path: |
            build/RelWithDebInfo/bin/bin/
            build/RelWithDebInfo/bin/lib/
            !build/RelWithDebInfo/bin/bin/*.runfiles
            !build/RelWithDebInfo/bin/bin/bin/*.dSYM
          if-no-files-found: error
          retention-days: 3

  run:
    needs: [jobs, build]
    name: ${{ matrix.name }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.jobs.outputs.jobs) }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","macos":"macos-15","windows":"windows-2025"}')[matrix.platform] }}
    # A job's own bounds stop it well before; this is the runner's six
    # hours.
    timeout-minutes: 350
    env:
      TARGET: ${{ fromJSON('{"linux":"x86_64-unknown-linux-gnu","macos":"aarch64-apple-darwin","windows":"x86_64-w64-mingw32"}')[matrix.platform] }}
    steps:
      # Spotlight indexes the checkout, the build and clice's cache as the
      # job writes them, and its CPU and memory make one index's time swing
      # twofold between runners.
      - name: Turn Spotlight off
        if: matrix.platform == 'macos'
        run: sudo mdutil -a -i off

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/download-programs
        with:
          target: ${{ env.TARGET }}
          build_type: RelWithDebInfo
          environments: default
          activate-environment: default

      # clice's own project: its database comes from Bazel.
      - name: Restore Bazel caches
        if: matrix.name == 'clice'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
            /var/tmp/xclang-thinlto
          key: bazel-${{ env.TARGET }}-RelWithDebInfo-${{ github.sha }}
          restore-keys: |
            bazel-${{ env.TARGET }}-RelWithDebInfo-

      - name: Install the tools
        run: |
          {
            echo "common --disk_cache=$RUNNER_TEMP/bazel-disk"
            echo "common --repository_cache=$RUNNER_TEMP/bazel-repo"
          } > user.bazelrc
          pixi run install-tests

      - name: Install the project's packages
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      # The newest finished run of this workflow on main that holds this
      # job's results: what tonight's numbers stand beside. None on the
      # first night.
      - name: Fetch the previous night's results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly-projects.yml \
            --branch main --status completed --limit 7 --json databaseId --jq '.[].databaseId'); do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" -n "nightly-${{ matrix.artifact }}" \
              -D "$RUNNER_TEMP/previous" && break
          done

      # In a scope holding all but 2 GB of the machine: a clice that
      # exhausts it is killed there (first, run.ts sees to that) and the job
      # reports the crash, while the runner's agent keeps memory enough to
      # stay up; on the whole machine the agent dies and nothing is reported.
      # Linux alone has such scopes.
      - name: Run
        env:
          CLICE_EXECUTABLE: ${{ github.workspace }}/build/RelWithDebInfo/bin/bin/clice
        run: >-
          ${{ runner.os == 'Linux' && 'sudo -E env "PATH=$PATH" systemd-run --scope --quiet --uid="$(id -u)" --gid="$(id -g)" -p MemoryMax=14G -p MemorySwapMax=0 -p OOMPolicy=continue --' || '' }}
          pixi run node tools/nightly/run.ts "${{ matrix.name }}"
          --dir "$RUNNER_TEMP/projects"
          --out "$RUNNER_TEMP/out"
          --previous "$RUNNER_TEMP/previous/results.json"

      - name: Summary
        if: ${{ !cancelled() }}
        # GitHub takes a summary up to 1 MiB; the artifact holds the whole.
        run: head -c 1000000 "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.artifact }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload clice's logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.artifact }}-logs
          path: |
            ${{ runner.temp }}/projects/*/.clice/logs/
            ${{ github.workspace }}/.clice/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
