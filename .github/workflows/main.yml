name: main

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Every main commit runs in a group of its own: a group holds one pending
# run, which a newer one cancels even without cancel-in-progress, leaving
# its commit untested and unpackaged. Elsewhere a push replaces its ref's
# run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      format: ${{ steps.filter.outputs.format }}
      docs: ${{ steps.filter.outputs.docs }}
      vscode: ${{ steps.filter.outputs.vscode }}
      zed: ${{ steps.filter.outputs.zed }}
      build: ${{ steps.filter.outputs.build }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            format:
              - '**/*.{h,c,cc,cpp,cppm,hpp,py,ts,js,mjs,css,lua,md,yml,yaml,json,toml}'
              - '**/.clang-{format,tidy}'
            # What the site draws: the pages, and the cards the cases and
            # their tools make.
            docs:
              - 'docs/**'
              - 'tests/**'
              - 'tools/testing/**'
            vscode:
              - 'editors/vscode/**'
              - '.github/workflows/publish-vscode.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'tools/**'
            zed:
              - 'editors/zed/**'
              - '.github/workflows/main.yml'
            build:
              - 'BUILD.bazel'
              - 'MODULE.bazel'
              - 'REPO.bazel'
              - '.bazelrc'
              - '.bazelversion'
              - 'bazel/**'
              # Generated docs and the committed schema are verified against
              # the built binary, so edits to them must run the tests.
              - 'docs/public/clice-config.schema.json'
              - 'docs/en/guide/configuration.md'
              - 'docs/en/features/**'
              - 'src/**'
              - 'modules/**'
              - 'ecosystem/**'
              - 'include/**'
              - 'tests/**'
              - 'unittests/**'
              - 'tools/**'
              - 'config/**'
              - 'scripts/**'
              - 'editors/nvim/**'
              - 'editors/vscode/**'
              - 'editors/zed/**'
              - 'pixi.toml'
              - 'pixi.lock'
              - 'package.json'
              - 'package-lock.json'
              - '.github/actions/**'
              # Every workflow, not only those of the build: the nightly
              # tags the newest packaged commit, and GitHub refuses
              # GITHUB_TOKEN a tag on a commit whose workflows differ from
              # main's.
              - '.github/workflows/**'

  lint:
    needs: changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/lint.yml
    with:
      format: ${{ needs.changes.outputs.format == 'true' }}

  # Builds the site with this PR's pages and cards, as docs.yml will after
  # the merge: a page that reads fine on GitHub can still fail VitePress (`{{`
  # in inline code is a Vue interpolation), and so can a card. The cards come
  # from this run's tests, or from main's when it runs none. Its own job,
  # since the action switches node.
  docs-site:
    needs: [changes, test]
    if: ${{ always() && github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true' && contains(fromJSON('["success", "skipped"]'), needs.test.result) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download this run's cards
        if: ${{ needs.test.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: docs-cards
          path: docs/cards
      - name: Download main's cards
        if: ${{ needs.test.result == 'skipped' }}
        uses: ./.github/actions/download-cards
      - uses: clice-io/docs@main
        with:
          project: clice
          mode: check

  vscode:
    needs: changes
    if: ${{ needs.changes.outputs.vscode == 'true' }}
    uses: ./.github/workflows/publish-vscode.yml

  # The extension's unit tests; editor-test.yml runs it in a real Zed on
  # this run's clice.
  zed:
    needs: changes
    if: ${{ needs.changes.outputs.zed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: editors/zed
      - name: Unit tests
        working-directory: editors/zed
        run: cargo test

  test:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    uses: ./.github/workflows/test.yml

  # Instant builds: repackage the test-suite binaries as installable vsix
  # artifacts so a fix can be tried the moment CI is green.
  instant-vscode:
    needs: [changes, test]
    if: ${{ needs.changes.outputs.build == 'true' }}
    uses: ./.github/workflows/publish-vscode.yml
    with:
      source: build

  release-clice:
    permissions:
      contents: write
      actions: read
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    uses: ./.github/workflows/publish-clice.yml
    with:
      release_tag: ${{ github.ref_name }}

  release-vscode:
    permissions:
      contents: write
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    needs: release-clice
    uses: ./.github/workflows/publish-vscode.yml
    with:
      source: package
    secrets: inherit

  checks-passed:
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    needs:
      - changes
      - lint
      - docs-site
      - vscode
      - zed
      - test
      - instant-vscode

    runs-on: ubuntu-latest
    steps:
      - name: Check results
        uses: re-actors/alls-green@v1.2.2
        with:
          allowed-skips: >-
            lint,docs-site,vscode,zed,
            test,instant-vscode
          jobs: ${{ toJSON(needs) }}
