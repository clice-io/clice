name: main

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      format: ${{ steps.filter.outputs.format }}
      docs: ${{ steps.filter.outputs.docs }}
      vscode: ${{ steps.filter.outputs.vscode }}
      zed: ${{ steps.filter.outputs.zed }}
      build: ${{ steps.filter.outputs.build }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            format:
              - '**/*.{h,c,cpp,hpp,ts,js,lua,md,yml,yaml}'
            docs:
              - 'docs/**'
              # The site renders the feature pages' snap fences from the
              # fixture corpus, so a snapshot change alone must redeploy.
              - 'tests/snap/**'
            vscode:
              - 'editors/vscode/**'
              - '.github/workflows/publish-vscode.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'tools/**'
            zed:
              - 'editors/zed/**'
              - '.github/workflows/main.yml'
            build:
              - 'BUILD.bazel'
              - 'MODULE.bazel'
              - 'REPO.bazel'
              - '.bazelrc'
              - '.bazelversion'
              - 'bazel/**'
              # Generated docs and the committed schema are verified against
              # the built binary, so edits to them must run native-test.
              - 'docs/public/clice-config.schema.json'
              - 'docs/en/guide/configuration.md'
              - 'docs/en/features/**'
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'tools/**'
              - 'config/**'
              - 'scripts/**'
              - 'editors/nvim/**'
              - 'editors/vscode/**'
              - 'pixi.toml'
              - 'pixi.lock'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/native-test.yml'
              - '.github/workflows/editor-test.yml'
              - '.github/workflows/compat-test.yml'

  lint:
    needs: changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/lint.yml
    with:
      format: ${{ needs.changes.outputs.format == 'true' }}

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: clice-io/docs@main
        with:
          project: clice
          token: ${{ secrets.CLICE_DOCS }}

  vscode:
    needs: changes
    if: ${{ needs.changes.outputs.vscode == 'true' }}
    uses: ./.github/workflows/publish-vscode.yml

  zed:
    needs: changes
    if: ${{ needs.changes.outputs.zed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: editors/zed
      # wasm32-wasip2 is the target Zed and its extension registry build with.
      - name: Build Zed extension
        working-directory: editors/zed
        run: |
          rustup target add wasm32-wasip2
          cargo build --target wasm32-wasip2 --release
      - name: Unit tests
        working-directory: editors/zed
        run: cargo test

      # Always the latest stable Zed on purpose, like the other editor tests.
      - name: Install Zed (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
          curl -fsSL https://zed.dev/install.sh | sh
          echo "ZED=$HOME/.local/zed.app/libexec/zed-editor" >> "$GITHUB_ENV"
      - name: Install Zed (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zed-setup.exe" \
            https://zed.dev/api/releases/stable/latest/Zed-x86_64.exe
          "$RUNNER_TEMP/zed-setup.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //SP- //CURRENTUSER
          echo "ZED=$LOCALAPPDATA/Programs/Zed/Zed.exe" >> "$GITHUB_ENV"

      - name: E2E test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: xvfb-run -a python3 editors/zed/tests/e2e.py "$ZED" editors/zed/target/wasm32-wasip2/release/zed_clice.wasm
      - name: E2E test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: python editors/zed/tests/e2e.py "$ZED" editors/zed/target/wasm32-wasip2/release/zed_clice.wasm

  native-test:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    uses: ./.github/workflows/native-test.yml

  editor-test:
    needs: [changes, native-test]
    if: ${{ needs.changes.outputs.build == 'true' }}
    uses: ./.github/workflows/editor-test.yml

  compat-test:
    needs: [changes, native-test]
    if: ${{ needs.changes.outputs.build == 'true' }}
    uses: ./.github/workflows/compat-test.yml

  # Instant builds: repackage the test-suite binaries as installable vsix
  # artifacts so a fix can be tried the moment CI is green.
  instant-vscode:
    needs: [changes, native-test]
    if: ${{ needs.changes.outputs.build == 'true' }}
    uses: ./.github/workflows/publish-vscode.yml
    with:
      source: build

  release-clice:
    permissions:
      contents: write
      actions: read
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    uses: ./.github/workflows/publish-clice.yml
    with:
      release_tag: ${{ github.ref_name }}

  release-vscode:
    permissions:
      contents: write
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    needs: release-clice
    uses: ./.github/workflows/publish-vscode.yml
    with:
      source: package
    secrets: inherit

  checks-passed:
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    needs:
      - changes
      - lint
      - deploy
      - vscode
      - zed
      - native-test
      - editor-test
      - compat-test
      - instant-vscode

    runs-on: ubuntu-latest
    steps:
      - name: Check results
        uses: re-actors/alls-green@v1.2.2
        with:
          allowed-skips: >-
            lint,deploy,vscode,zed,
            native-test,editor-test,compat-test,instant-vscode
          jobs: ${{ toJSON(needs) }}
