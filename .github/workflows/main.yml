name: main

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      format: ${{ steps.filter.outputs.format }}
      docs: ${{ steps.filter.outputs.docs }}
      vscode: ${{ steps.filter.outputs.vscode }}
      zed: ${{ steps.filter.outputs.zed }}
      cmake: ${{ steps.filter.outputs.cmake }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            format:
              - '**/*.{h,c,cpp,hpp,ts,js,lua,md,yml,yaml}'
            docs:
              - 'docs/**'
            vscode:
              - 'editors/vscode/**'
              - '.github/workflows/publish-vscode.yml'
            zed:
              - 'editors/zed/**'
              - '.github/workflows/main.yml'
            cmake:
              - 'CMakeLists.txt'
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'config/**'
              - 'cmake/**'
              - 'scripts/**'
              - 'editors/nvim/**'
              - 'editors/vscode/**'
              - 'pixi.toml'
              - 'pixi.lock'
              - '.github/workflows/native-test.yml'
              - '.github/workflows/cross-test.yml'
              - '.github/workflows/cross-pair.yml'
              - '.github/workflows/editor-test.yml'

  lint:
    needs: changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/lint.yml
    with:
      format: ${{ needs.changes.outputs.format == 'true' }}

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: clice-io/docs@main
        with:
          project: clice
          token: ${{ secrets.PUBLISH_DOCS }}

  vscode:
    needs: changes
    if: ${{ needs.changes.outputs.vscode == 'true' }}
    uses: ./.github/workflows/publish-vscode.yml

  zed:
    needs: changes
    if: ${{ needs.changes.outputs.zed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: editors/zed
      - name: Build Zed extension
        run: |
          rustup target add wasm32-wasip1
          cargo build --manifest-path editors/zed/Cargo.toml --target wasm32-wasip1 --release

  native-test:
    needs: changes
    if: ${{ needs.changes.outputs.cmake == 'true' }}
    uses: ./.github/workflows/native-test.yml

  cross-test:
    needs: changes
    if: ${{ needs.changes.outputs.cmake == 'true' }}
    uses: ./.github/workflows/cross-test.yml

  editor-test:
    needs: [changes, native-test]
    if: ${{ needs.changes.outputs.cmake == 'true' }}
    uses: ./.github/workflows/editor-test.yml

  # Instant builds: repackage the test-suite binaries as installable vsix
  # artifacts so a fix can be tried the moment CI is green.
  instant-vscode:
    needs: [changes, native-test, cross-test]
    if: ${{ needs.changes.outputs.cmake == 'true' }}
    uses: ./.github/workflows/publish-vscode.yml
    with:
      source: build

  release-clice:
    permissions:
      contents: write
      actions: read
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    uses: ./.github/workflows/publish-clice.yml
    with:
      release_tag: ${{ github.ref_name }}

  release-vscode:
    permissions:
      contents: write
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    needs: release-clice
    uses: ./.github/workflows/publish-vscode.yml
    with:
      source: package
    secrets: inherit

  checks-passed:
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    needs:
      - changes
      - lint
      - deploy
      - vscode
      - zed
      - native-test
      - cross-test
      - editor-test
      - instant-vscode

    runs-on: ubuntu-latest
    steps:
      - name: Check results
        uses: re-actors/alls-green@v1.2.2
        with:
          allowed-skips: >-
            lint,deploy,vscode,zed,
            native-test,cross-test,editor-test,instant-vscode
          jobs: ${{ toJSON(needs) }}
