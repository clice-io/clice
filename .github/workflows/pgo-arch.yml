name: pgo arch

# Why is PGO worth ~30% on Linux x64 but 7-15% on macOS arm64? The same
# path-stripped clang profile (run 35973108478) on the four corners
# {Linux, macOS} x {x64, arm64}, each benchmarked against its own no-PGO
# build on its own runner; a profile match report per platform (functions
# without data, hash mismatches); and macOS arm64 again with mimalloc
# preloaded, in case the system allocator is what PGO cannot reach.

on:
  push:
    branches: [exp/pgo-arch]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  llvm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-linux-base
            triple: aarch64-unknown-linux-gnu
            env: cross-linux-arm64
          - name: arm64-linux-pgo
            triple: aarch64-unknown-linux-gnu
            env: cross-linux-arm64
            pgo: true
          - name: x64-mac-base
            os: macos-15
            triple: x86_64-apple-darwin
          - name: x64-mac-pgo
            os: macos-15
            triple: x86_64-apple-darwin
            pgo: true
          - name: x64-linux-pgo
            pgo: true
          - name: arm64-mac-pgo
            os: macos-15
            pgo: true
    uses: ./.github/workflows/pgo-llvm.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os || 'ubuntu-24.04' }}
      lto: "ON"
      target-triple: ${{ matrix.triple || '' }}
      pixi-env: ${{ matrix.env || 'package' }}
      profile: ${{ matrix.pgo && 'profile-clang-strip' || '' }}
      profile-run: ${{ matrix.pgo && '35973108478' || '' }}
      extra-args: ${{ matrix.pgo && '--pgo-strip-prefix' || '' }}
      match-report: ${{ matrix.pgo || false }}
      # The arm64 macOS package of run 35973108478 is benchmarked already;
      # this build only produces its match report.
      upload: ${{ matrix.name != 'arm64-mac-pgo' }}

  clice:
    needs: llvm
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-linux-base
            triple: aarch64-unknown-linux-gnu
            env: cross-linux-arm64
          - name: arm64-linux-pgo
            triple: aarch64-unknown-linux-gnu
            env: cross-linux-arm64
          - name: x64-mac-base
            os: macos-15
            triple: x86_64-apple-darwin
          - name: x64-mac-pgo
            os: macos-15
            triple: x86_64-apple-darwin
          - name: x64-linux-pgo
    uses: ./.github/workflows/pgo-clice.yml
    with:
      name: final-${{ matrix.name }}
      llvm: ${{ matrix.name }}
      lto: "ON"
      os: ${{ matrix.os || 'ubuntu-24.04' }}
      target-triple: ${{ matrix.triple || '' }}
      pixi-env: ${{ matrix.env || 'package' }}

  bench:
    needs: clice
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - corner: arm64-linux
            os: ubuntu-24.04-arm
            variants: "base=final-arm64-linux-base@this pgo=final-arm64-linux-pgo@this"
          - corner: x64-mac
            os: macos-15-intel
            flags: --no-default-config
            variants: "base=final-x64-mac-base@this pgo=final-x64-mac-pgo@this"
          - corner: x64-linux
            os: ubuntu-24.04
            variants: "base=final-V0@35912428380 pgo-old=final-V2@35912428380 pgo-strip=final-x64-linux-pgo@this"
          - corner: arm64-mac-mimalloc
            os: macos-15
            flags: --no-default-config
            variants: "base=final-M0@35973108478 pgo=final-M2-strip@35973108478 base+mi=final-M0@35973108478 pgo+mi=final-M2-strip@35973108478"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi
        with:
          environments: package
      - name: Unpack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v zstd || brew install zstd
          uname -m; (nproc || sysctl -n hw.ncpu) 2>/dev/null; (grep -m1 'model name' /proc/cpuinfo || sysctl -n machdep.cpu.brand_string) 2>/dev/null
          for spec in ${{ matrix.variants }}; do
            name="${spec%%=*}"; rest="${spec#*=}"; artifact="${rest%@*}"; run="${rest#*@}"
            [[ "$run" == this ]] && run="${{ github.run_id }}"
            [[ -d "bundles/$artifact-$run" ]] || gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "bundles/$artifact-$run"
            mkdir -p "variants/$name"
            zstd -dc "bundles/$artifact-$run/bundle.tar.zst" | tar -C "variants/$name" -xf -
          done
          ls variants
      - name: mimalloc
        if: matrix.corner == 'arm64-mac-mimalloc'
        run: brew install mimalloc && echo "MIMALLOC=$(brew --prefix mimalloc)/lib/libmimalloc.dylib" >> "$GITHUB_ENV"
      - name: Workloads
        run: |
          pixi run -e package python3 scripts/pgo_ci.py workloads --dir "$RUNNER_TEMP/workloads" \
            --cc clang --cxx clang++ ${{ matrix.flags && format('--flags={0}', matrix.flags) || '' }}
      - name: Benchmark
        run: |
          ARGS=()
          for spec in ${{ matrix.variants }}; do
            name="${spec%%=*}"; ARGS+=(--variant "$name=$PWD/variants/$name")
            [[ "$name" == *+mi ]] && ARGS+=(--env "$name=DYLD_INSERT_LIBRARIES=$MIMALLOC")
          done
          pixi run -e package python3 scripts/pgo_ci.py bench "${ARGS[@]}" --rounds 3 --out bench-out \
            --workload "abseil:$RUNNER_TEMP/workloads/abseil/build/compile_commands.json::60" \
            --workload "llvm-sema:$RUNNER_TEMP/workloads/llvm/build/compile_commands.json:clang/lib/Sema/:16"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.corner }}
          path: bench-out
