name: release llvm

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID from build-llvm containing LLVM artifacts"
        required: true
        type: string
      llvm_version:
        description: "Release tag in clice-llvm (e.g. 22.1.8+r1)"
        required: true
        type: string

concurrency:
  group: release-llvm
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  LLVM_VERSION: ${{ inputs.llvm_version }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ secrets.UPLOAD_LLVM }}
        run: |
          TAG="${{ env.LLVM_VERSION }}"
          REPO="clice-io/clice-llvm"
          NOTES="LLVM ${TAG} — build run https://github.com/${{ github.repository }}/actions/runs/${{ env.SOURCE_RUN_ID }}"
          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            gh release edit "$TAG" --repo "$REPO" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "$NOTES"
          fi

  upload:
    needs: create-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - aarch64-unknown-linux-gnu.releasedbg-lto.tar.xz
          - aarch64-unknown-linux-gnu.releasedbg.tar.xz
          - aarch64-pc-windows-msvc.releasedbg-lto.tar.xz
          - aarch64-pc-windows-msvc.releasedbg.tar.xz
          - aarch64-apple-darwin.debug-asan.tar.xz
          - aarch64-apple-darwin.releasedbg-lto.tar.xz
          - aarch64-apple-darwin.releasedbg.tar.xz
          - x86_64-unknown-linux-gnu.debug-asan.tar.xz
          - x86_64-unknown-linux-gnu.releasedbg-lto.tar.xz
          - x86_64-unknown-linux-gnu.releasedbg.tar.xz
          - x86_64-apple-darwin.releasedbg-lto.tar.xz
          - x86_64-apple-darwin.releasedbg.tar.xz
          - x86_64-pc-windows-msvc.releasedbg-lto.tar.xz
          - x86_64-pc-windows-msvc.releasedbg.tar.xz
    steps:
      - name: Download build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ env.SOURCE_RUN_ID }}" \
            --repo "${{ github.repository }}" \
            -n "${{ matrix.artifact }}" -D artifacts

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.UPLOAD_LLVM }}
        run: |
          gh release upload "${{ env.LLVM_VERSION }}" \
            "artifacts/${{ matrix.artifact }}" \
            --repo clice-io/clice-llvm \
            --clobber
