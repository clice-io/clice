name: bazel-test

# native-test's RelWithDebInfo legs, built by Bazel. Bazel is the runner
# image's bazelisk, pinned by .bazelversion.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            # The default output root under the user profile pushes action
            # paths past MAX_PATH; the runfiles tree is made of symlinks.
            startup: --output_user_root=C:/b --windows_enable_symlinks
          - os: ubuntu-24.04
          - os: macos-15
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      BAZEL: bazel ${{ matrix.startup }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pixi
        with:
          environments: default test-run
          activate-environment: default

      # Bazel refuses a repository cache inside the workspace.
      - name: Bazel settings
        run: |
          temp=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          echo "CACHES=--disk_cache=$temp/bazel-disk --repository_cache=$temp/bazel-repo" >> "$GITHUB_ENV"
          echo "CLICE_EXECUTABLE=${{ github.workspace }}/bazel-bin/dist/bin/clice${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      # xclang's headers and libraries are not action inputs, so nothing in
      # an action key changes with them: the cache is keyed on pixi.lock, as
      # ccache's is.
      - name: Restore Bazel caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: ${{ runner.os }}-${{ hashFiles('pixi.lock') }}-bazel-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('pixi.lock') }}-bazel-

      - name: Mark the run start
        run: touch "$RUNNER_TEMP/bazel-start"

      # On main every cached output is fetched, which marks it used for the
      # prune below; elsewhere only what the tests need.
      - name: Build and unit tests
        timeout-minutes: 90
        run: $BAZEL test $CACHES ${{ github.ref == 'refs/heads/main' && '--remote_download_all' || '' }} --test_output=errors //:dist //:unit_tests_test

      - name: Integration tests
        timeout-minutes: 30
        run: pixi run -e test-run -- bash -c 'npm ci && npm run check && npm test --workspace tests'

      - name: Smoke tests
        timeout-minutes: 5
        run: pixi run -e test-run -- bash -c 'node tools/replay.ts tests/smoke/*.jsonl --clice="$CLICE_EXECUTABLE"'

      - name: Snap tests
        timeout-minutes: 20
        run: pixi run -e test-run -- npm run snap --workspace tests

      # Bazel refreshes an entry's mtime when it reads it, so what this run
      # did not touch is what the current tree no longer needs.
      - name: Prune the disk cache
        if: github.ref == 'refs/heads/main'
        run: find "${{ runner.temp }}/bazel-disk" -type f ! -newer "$RUNNER_TEMP/bazel-start" -delete

      - name: Save Bazel caches
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: ${{ runner.os }}-${{ hashFiles('pixi.lock') }}-bazel-${{ github.sha }}
