name: nightly

# Nightly pre-release channel (odd-minor versions): if main gained tested
# builds since the last nightly, tag the newest packaged commit as
# vX.<odd>.YYYYMMDDHH on the odd minor above the newest release, promote its
# CI packages, and publish it as a GitHub pre-release plus a Marketplace and
# Open VSX pre-release.
# Old nightlies are pruned after 30 days or beyond the newest 25; stable
# (even-minor) releases are never touched.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      run: ${{ steps.pick.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Pick the commit to promote
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag must point at the exact commit the promoted binaries
          # were built from, so pick the newest main commit whose green run
          # still has a live package artifact for every platform (the same
          # set publish-clice.yml refuses to promote without): path-filtered
          # runs (e.g. docs-only commits) build nothing, and packages expire
          # after 30 days. Candidates come from the artifact listing and each
          # is confirmed with its own run: the filtered run listing (branch +
          # event + status) has answered with a truncated list that missed
          # every recent run. The artifacts API occasionally answers with an
          # empty or stale list for a while too — either no pick at all, or a
          # pick older than an already-tagged release because the newest
          # runs are missing from the listing. Both mean the listing is
          # wrong, never that main went backwards, so both are retried and
          # then fail the run rather than promote a downgrade.
          PACKAGES="package-clice.x86_64-unknown-linux-gnu.tar.gz
                    package-clice.aarch64-unknown-linux-gnu.tar.gz
                    package-clice.aarch64-apple-darwin.tar.gz
                    package-clice.x86_64-apple-darwin.tar.gz
                    package-clice.x86_64-w64-mingw32.zip
                    package-clice.aarch64-w64-mingw32.zip"
          COUNT=$(wc -w <<< "$PACKAGES")
          TAGS=$(git tag -l 'v*.*.*')
          COMMIT=""
          for ATTEMPT in 1 2 3; do
            if [ "$ATTEMPT" -gt 1 ]; then sleep 30; fi
            LIVE=""
            for PACKAGE in $PACKAGES; do
              ONE=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$PACKAGE&per_page=100" \
                --jq '.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main")
                      | "\(.workflow_run.id) \(.workflow_run.head_sha)"') || ONE=""
              LIVE="$LIVE$(sort -u <<< "$ONE")"$'\n'
            done
            # A run qualifies only when every package is live for it. Run
            # ids grow with creation time: newest first.
            LIVE=$(grep . <<< "$LIVE" | sort | uniq -c \
              | awk -v n="$COUNT" '$1 == n { print $2, $3 }' | sort -rn)
            echo "attempt $ATTEMPT: $(grep -c . <<< "$LIVE") fully packaged main runs"
            COMMIT=""
            while read -r RUN SHA; do
              if [ -z "$RUN" ]; then continue; fi
              # Nightly runs upload packages under main as well; only a
              # green push run of the main workflow tested what it packaged.
              # A failed lookup retries the attempt: skipping the run would
              # promote an older commit.
              KIND=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" \
                --jq '"\(.path) \(.event) \(.conclusion)"') || break
              if [ "$KIND" = ".github/workflows/main.yml push success" ]; then
                COMMIT=$SHA
                PICKED=$RUN
                break
              fi
            done <<< "$LIVE"
            if [ -n "$COMMIT" ]; then
              git rev-parse -q --verify "$COMMIT^{commit}" > /dev/null \
                || git fetch origin "$COMMIT"
              # Strictly older than any release ever tagged — nightly or
              # stable — means the listing missed the newer runs, since a
              # release is only tagged on a commit that was packaged.
              for TAG in $TAGS; do
                TAGGED=$(git rev-parse "$TAG^{commit}")
                if [ "$COMMIT" != "$TAGGED" ] \
                  && git merge-base --is-ancestor "$COMMIT" "$TAGGED"; then
                  echo "pick $COMMIT predates $TAG ($TAGGED); stale listing"
                  COMMIT=""
                  break
                fi
              done
            fi
            if [ -n "$COMMIT" ]; then break; fi
          done
          if [ -z "$COMMIT" ]; then
            echo "::error::no green main run at or past the newest release has live package artifacts"
            exit 1
          fi
          echo "Promoting $COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "run=$PICKED" >> "$GITHUB_OUTPUT"

      - name: Compute nightly version
        id: version
        env:
          COMMIT: ${{ steps.pick.outputs.commit }}
        run: |
          # Nightlies live on the odd minor above the newest release: after
          # stable v0.2.0 ships they become v0.3.*, keeping the Marketplace
          # pre-release channel ahead of stable.
          LATEST=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          MAJOR=0
          MINOR=1
          if [ -n "$LATEST" ]; then
            BASE=${LATEST#v}
            MAJOR=${BASE%%.*}
            REST=${BASE#*.}
            MINOR=${REST%%.*}
            if [ $((MINOR % 2)) -eq 0 ]; then MINOR=$((MINOR + 1)); fi
          fi
          TAG="v$MAJOR.$MINOR.$(date -u +%Y%m%d%H)"
          LAST=$(git tag -l "v$MAJOR.$MINOR.*" --sort=-v:refname | head -1)
          # Manual dispatch skips only the same-hour duplicate below, so a
          # failed nightly can be retried on the same commit.
          if [ -n "$LAST" ] && [ "$(git rev-parse "$LAST^{commit}")" = "$COMMIT" ] \
            && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "No new packaged commits since $LAST; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse "$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # Tags pushed with GITHUB_TOKEN do not trigger workflows, which is
      # exactly right here: the publish workflows are invoked directly below
      # instead of through the tag-push release path. The release stays a
      # draft until publish-clice.yml has attached every platform archive.
      - name: Create tag and draft pre-release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.pick.outputs.commit }}
        run: |
          # The picked commit may postdate the checkout if a run went green
          # in between; fetch it before tagging.
          git rev-parse -q --verify "$COMMIT^{commit}" > /dev/null \
            || git fetch origin "$COMMIT"
          git tag "$TAG" "$COMMIT"
          git push origin "$TAG"

          LAST=$(git tag -l "${TAG%.*}.*" --sort=-v:refname | sed -n 2p)
          {
            echo "Nightly build from \`$(git rev-parse --short "$COMMIT")\`."
            echo
            if [ -n "$LAST" ]; then
              echo "## Changes since $LAST"
              git log --format='- %s' "$LAST".."$COMMIT"
              echo
            fi
            URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
            V=${TAG#v}
            echo "## Downloads"
            echo
            echo "| Platform | Server | VS Code extension | Symbols |"
            echo "| --- | --- | --- | --- |"
            row() {
              PKG="clice-$V.$2.$3"
              SYM="clice-$V.$2.symbols.$4"
              VSIX="clice-$V.$2.vsix"
              echo "| $1 | [$PKG]($URL/$PKG) | [$VSIX]($URL/$VSIX) | [$SYM]($URL/$SYM) |"
            }
            row "Linux x64" x86_64-unknown-linux-gnu tar.gz tar.xz
            row "Linux arm64" aarch64-unknown-linux-gnu tar.gz tar.xz
            row "macOS arm64" aarch64-apple-darwin tar.gz tar.xz
            row "macOS x64" x86_64-apple-darwin tar.gz tar.xz
            row "Windows x64" x86_64-w64-mingw32 zip zip
            row "Windows arm64" aarch64-w64-mingw32 zip zip
            echo
            echo "Symbol packages hold GSYM data for crash log symbolization"
            echo "via \`scripts/symbolize.py\`. Extension users on the Marketplace"
            echo "or Open VSX pre-release channel update automatically."
          } > /tmp/notes.md
          gh release create "$TAG" --draft --prerelease --title "$TAG" \
            --notes-file /tmp/notes.md
          # Mirror the release notes into the run summary page.
          cat /tmp/notes.md >> "$GITHUB_STEP_SUMMARY"

  clice:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-clice.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  vscode:
    needs: [prepare, clice]
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-vscode.yml
    with:
      source: package
      release_tag: ${{ needs.prepare.outputs.tag }}
      prerelease: true
    secrets: inherit

  # The real projects over the nightly's commit, with the programs its main
  # run built (nightly-projects.yml): a stable release tags a nightly whose
  # round shows no new failure. Dispatched, not called, so the round keeps a
  # run history of its own, which each round compares its numbers with.
  projects:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the round
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ needs.prepare.outputs.run }}
        run: gh workflow run nightly-projects.yml --repo "$GITHUB_REPOSITORY" --ref main -f run="$RUN"

  # Nightlies expire after 30 days, and only the newest 25 are kept: the Zed
  # extension reads only the first page (30) of the release list, which must
  # still hold the newest stable release. Only odd-minor pre-releases are
  # pruned; stable releases and their tags are never deleted. The release
  # Neovim's Mason registry pins is kept too: its Renovate bot moves the pin
  # only to stable releases, so until the first one a pruned pin would break
  # `:MasonInstall clice`.
  cleanup:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete expired nightlies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -u -d '30 days ago' +%s)
          PINNED=$(gh api repos/mason-org/mason-registry/contents/packages/clice/package.yaml \
            -H "Accept: application/vnd.github.raw" \
            | sed -n 's|.*pkg:github/clice-io/clice@\([^[:space:]]*\).*|\1|p')
          if [ -z "$PINNED" ]; then
            echo "::error::no clice version found in Mason's packages/clice/package.yaml"
            exit 1
          fi
          RANK=0
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isPrerelease,createdAt \
            -q '.[] | select(.isPrerelease) | .tagName + " " + .createdAt' |
          sort -rV |
          while read -r TAG CREATED; do
            MINOR=$(echo "$TAG" | cut -d. -f2)
            case "$MINOR" in *[!0-9]* | "") continue ;; esac
            if [ $((MINOR % 2)) -eq 0 ]; then continue; fi
            if [ "$TAG" = "$PINNED" ]; then
              echo "Keeping $TAG, pinned by Mason"
              continue
            fi
            RANK=$((RANK + 1))
            if [ "$RANK" -gt 25 ] \
              || [ "$(date -u -d "$CREATED" +%s)" -lt "$CUTOFF" ]; then
              echo "Pruning $TAG (created $CREATED, newest $RANK)"
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag --yes
            fi
          done
