name: pgo llvm

# One LLVM build of the PGO experiment (see pgo-experiment.yml): the package,
# instrumented or optimized with a profile, or (clang-train) an instrumented
# clang compiler that then builds clice to record a compiler profile.

on:
  workflow_call:
    inputs:
      name:
        description: "Artifact to upload: the packed install, or the profile for clang-train"
        type: string
        required: true
      lto:
        type: string
        default: "OFF"
      instrument:
        type: boolean
        default: false
      profile:
        description: "Profile artifact (holding profile.profdata) to optimize with"
        type: string
        default: ""
      profile-run:
        type: string
        default: ""
      clang-train:
        type: boolean
        default: false
      clang-bundle:
        description: "Build the clang compiler and upload its binary"
        type: boolean
        default: false
      target-triple:
        description: "Cross-compile the package for this triple"
        type: string
        default: ""
      pixi-env:
        type: string
        default: package
      llvm-mingw:
        description: "Take the mingw sysroot and runtimes from llvm-mingw (aarch64-w64-mingw32)"
        type: boolean
        default: false
      os:
        type: string
        default: ubuntu-24.04
      mode:
        type: string
        default: RelWithDebInfo
      upload:
        description: "Upload the result (off when only timing the build)"
        type: boolean
        default: true
      extra-args:
        description: "More arguments for build-llvm.py"
        type: string
        default: ""
      match-report:
        description: "Count profile misses and hash mismatches on a few TUs after the build"
        type: boolean
        default: false

env:
  LLVM_VERSION: "23.1.1"

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free Disk Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main

      - name: Free Disk Space (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator ~/Library/Android /usr/local/share/dotnet /usr/local/share/powershell ~/.ghcup
          XCODE_PATH="$(xcode-select -p)"
          for platform in iPhoneOS iPhoneSimulator AppleTVOS AppleTVSimulator WatchOS WatchSimulator XROS XRSimulator; do
            sudo rm -rf "${XCODE_PATH}/Platforms/${platform}.platform"
          done
          sysctl -n hw.ncpu machdep.cpu.brand_string hw.memsize; df -h /

      - name: Increase Swap Space
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          nproc; grep -m1 -E 'model name|CPU part' /proc/cpuinfo || true; free -g | sed -n 2p; df -h /

      - uses: ./.github/actions/setup-pixi
        with:
          environments: ${{ inputs.pixi-env }}

      - name: llvm-mingw
        if: inputs.llvm-mingw
        run: |
          # The aarch64 mingw sysroot, libunwind and compiler-rt builtins; see
          # cmake/toolchain.cmake (CLICE_MINGW_ROOT).
          curl -sSL https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          root="$RUNNER_TEMP/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64"
          prefix="$(pixi run -e "${{ inputs.pixi-env }}" printenv CONDA_PREFIX)"
          mkdir -p "$prefix/lib/clang/23/lib/windows"
          # The profile runtime too, for instrumented builds of the mingw clang.
          cp "$root"/lib/clang/*/lib/windows/libclang_rt.{builtins,profile}-*.a "$prefix/lib/clang/23/lib/windows/"
          echo "CLICE_MINGW_ROOT=$root" >> "$GITHUB_ENV"

      - name: Clone llvm-project
        run: git clone --branch "llvmorg-${LLVM_VERSION}" --depth 1 https://github.com/llvm/llvm-project.git .llvm

      - name: Download profile
        if: inputs.profile != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.profile }}
          path: pgo-profile
          run-id: ${{ inputs.profile-run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Build LLVM
        run: |
          ARGS=(--llvm-src=.llvm --mode="${{ inputs.mode }}" --lto="${{ inputs.lto }}" --build-dir=build)
          if [[ "${{ inputs.instrument }}" == true ]]; then ARGS+=(--pgo-instrument); fi
          if [[ -n "${{ inputs.profile }}" ]]; then ARGS+=(--pgo-profile="$PWD/pgo-profile/profile.profdata"); fi
          if [[ -n "${{ inputs.target-triple }}" ]]; then ARGS+=(--target-triple="${{ inputs.target-triple }}"); fi
          # The trained clang stands in for the environment's clang-23, so it
          # keeps that clang's triple and with it the conda config files.
          if [[ "${{ inputs.clang-train }}" == true || "${{ inputs.clang-bundle }}" == true ]]; then
            # A cross-built clang targets what it is built for; a native one
            # stands in for the environment's clang and keeps its triple.
            triple="${{ inputs.target-triple }}"
            [[ -n "$triple" ]] || triple="$(pixi run -e "${{ inputs.pixi-env }}" clang -print-target-triple)"
            echo "default triple of the environment's clang: $triple"
            ARGS+=(--clang-only --default-triple="$triple")
          fi
          # shellcheck disable=SC2206
          ARGS+=(${{ inputs.extra-args }})
          start=$SECONDS
          pixi run -e "${{ inputs.pixi-env }}" python3 scripts/build-llvm.py "${ARGS[@]}"
          echo "LLVM build: $(( (SECONDS - start) / 60 )) min" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Profile match report
        if: inputs.match-report && inputs.profile != ''
        continue-on-error: true
        run: |
          pixi run -e "${{ inputs.pixi-env }}" python3 scripts/pgo_ci.py match-report --build .llvm/build/llvm \
            --target "${{ inputs.name }}" --profile "use=$PWD/pgo-profile/profile.profdata" --files \
            clang/lib/Sema/SemaExpr.cpp clang/lib/Sema/SemaDecl.cpp clang/lib/Sema/SemaTemplate.cpp \
            clang/lib/Parse/ParseDecl.cpp clang/lib/Lex/Lexer.cpp clang/lib/AST/ExprConstant.cpp \
            clang/lib/Serialization/ASTReader.cpp llvm/lib/Support/StringMap.cpp

      - name: Upload clang
        if: inputs.clang-bundle && inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}
          path: |
            .llvm/build/llvm/bin/clang-23
            .llvm/build/llvm/bin/clang.exe
          retention-days: 14
          if-no-files-found: error

      - name: Pack install
        if: ${{ !inputs.clang-train && !inputs.clang-bundle && inputs.upload }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            # No zstd on Windows runners.
            tar -C .llvm/build-install -czf llvm.tar.gz .
          else
            command -v zstd || brew install zstd
            tar -C .llvm/build-install -cf - . | zstd -T0 -6 -o llvm.tar.zst
          fi
          ls -la llvm.tar.*
          du -sh .llvm/build-install/lib | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload install
        if: ${{ !inputs.clang-train && !inputs.clang-bundle && inputs.upload }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}
          path: llvm.tar.*
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Train with the instrumented clang
        if: inputs.clang-train
        run: |
          prefix="$(pixi run -e package printenv CONDA_PREFIX)"
          # Replace the binary the environment's clang resolves to (clang-23
          # on Linux); it is hard-linked into the pixi cache, so unlink first.
          real="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$prefix/bin/clang")"
          echo "replacing $real"
          rm -f "$real"
          cp .llvm/build/llvm/bin/clang-23 "$real"
          pixi run -e package clang++ --version
          start=$SECONDS
          pixi run -e package python3 scripts/pgo_ci.py train-clang --raw-dir pgo-raw --out pgo-out/profile.profdata
          echo "clang training: $(( (SECONDS - start) / 60 )) min" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la pgo-out

      - name: Upload profile
        if: inputs.clang-train && inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}
          path: pgo-out
          retention-days: 14
          if-no-files-found: error
