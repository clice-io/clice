name: pgo clice

# One clice build of the PGO experiment (see pgo-experiment.yml) against an
# LLVM package artifact: instrumented to record a profile (train), or the
# final optimized build whose pipeline_benchmark the bench job runs.

on:
  workflow_call:
    inputs:
      name:
        description: "Artifact to upload: the profile (train) or the benchmark bundle"
        type: string
        required: true
      llvm:
        description: "LLVM package artifact (llvm.tar.zst or .gz)"
        type: string
        default: ""
      llvm-asset:
        description: "Or an asset of the clice-llvm 23.1.1+r1 release"
        type: string
        default: ""
      llvm-run:
        type: string
        default: ""
      lto:
        type: string
        default: "ON"
      pgo:
        description: "'generate', a profile artifact (holding profile.profdata), or empty"
        type: string
        default: ""
      pgo-run:
        type: string
        default: ""
      train:
        type: boolean
        default: false
      target-triple:
        description: "Cross-compile clice for this triple (the bundle then holds .exe files, no tests run)"
        type: string
        default: ""
      pixi-env:
        type: string
        default: package
      os:
        type: string
        default: ubuntu-24.04

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free Disk Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main

      - name: zstd (macOS)
        if: runner.os == 'macOS'
        run: command -v zstd || brew install zstd

      - uses: ./.github/actions/setup-pixi
        with:
          environments: ${{ inputs.pixi-env }}

      - name: Download LLVM
        if: inputs.llvm != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.llvm }}
          path: llvm-artifact
          run-id: ${{ inputs.llvm-run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download profile
        if: inputs.pgo != '' && inputs.pgo != 'generate'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.pgo }}
          path: pgo-profile
          run-id: ${{ inputs.pgo-run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download released LLVM
        if: inputs.llvm-asset != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download 23.1.1+r1 -R clice-io/clice-llvm -p "${{ inputs.llvm-asset }}" -D llvm-artifact

      - name: Configure
        run: |
          LLVM_DIR="$RUNNER_TEMP/llvm"
          [[ "$RUNNER_OS" == Windows ]] && LLVM_DIR="$(cygpath -m "$LLVM_DIR")"
          mkdir -p "$LLVM_DIR"
          if [[ -f llvm-artifact/llvm.tar.zst ]]; then zstd -dc llvm-artifact/llvm.tar.zst | tar -C "$LLVM_DIR" -xf -
          elif [[ -f llvm-artifact/llvm.tar.gz ]]; then tar -C "$LLVM_DIR" -xzf llvm-artifact/llvm.tar.gz
          else tar -C "$LLVM_DIR" -xJf llvm-artifact/*.tar.xz; fi
          cat "$LLVM_DIR/lib/cmake/clice-llvm/config.cmake"
          PGO="${{ inputs.pgo }}"
          if [[ -n "$PGO" && "$PGO" != generate ]]; then PGO="$PWD/pgo-profile/profile.profdata"; fi
          CROSS=()
          if [[ -n "${{ inputs.target-triple }}" ]]; then CROSS=(-DCLICE_TARGET_TRIPLE="${{ inputs.target-triple }}"); fi
          pixi run -e "${{ inputs.pixi-env }}" cmake -B build/RelWithDebInfo -G Ninja "${CROSS[@]}" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake \
            -DCLICE_ENABLE_TEST=ON \
            -DCLICE_ENABLE_BENCHMARK=ON \
            -DCLICE_ENABLE_LTO=${{ inputs.lto }} \
            -DLLVM_INSTALL_PATH="$LLVM_DIR" \
            -DCLICE_PGO="$PGO"

      - name: Build
        run: |
          start=$SECONDS
          pixi run -e "${{ inputs.pixi-env }}" ninja -C build/RelWithDebInfo clice unit_tests pipeline_benchmark
          echo "clice build: $(( (SECONDS - start) / 60 )) min" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la build/RelWithDebInfo/bin | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Train
        if: inputs.train
        run: |
          start=$SECONDS
          pixi run -e package python3 scripts/pgo_ci.py train-clice --build build/RelWithDebInfo \
            --out pgo-out/profile.profdata --unit-tests
          echo "clice training: $(( (SECONDS - start) / 60 )) min" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload profile
        if: inputs.train
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}
          path: pgo-out
          retention-days: 14
          if-no-files-found: error

      - name: Unit tests
        if: ${{ !inputs.train && inputs.target-triple == '' }}
        continue-on-error: true
        run: |
          DATA="$PWD/tests/data"; [[ "$RUNNER_OS" == Windows ]] && DATA="$(cygpath -m "$DATA")"
          CLICE_TEST_DATA_DIR="$DATA" pixi run -e "${{ inputs.pixi-env }}" ./build/RelWithDebInfo/bin/unit_tests 2>&1 | tail -n 30 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Bundle
        if: ${{ !inputs.train }}
        run: |
          cd build/RelWithDebInfo
          # Windows runners have no zstd; gzip unpacks everywhere. The unit
          # tests spawn clice.exe as their worker.
          if [[ "${{ inputs.target-triple }}" == *mingw* || "$RUNNER_OS" == Windows ]]; then
            tar -cf - bin/pipeline_benchmark.exe bin/unit_tests.exe bin/clice.exe lib/clang | gzip -1 > ../../bundle.tar.gz
          else
            tar -cf - bin/pipeline_benchmark bin/clice lib/clang | zstd -T0 -3 -o ../../bundle.tar.zst
          fi

      - name: Upload bundle
        if: ${{ !inputs.train }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}
          path: bundle.tar.*
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
