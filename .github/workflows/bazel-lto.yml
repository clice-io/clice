name: bazel-lto

# ThinLTO link-cache measurements on the Bazel spike (scripts/lto-bench.sh),
# on every push of this branch. MODE=full times every variant and saves the
# caches; MODE=ci restores them as a CI run would.

on:
  push:
    branches: [exp/bazel-lto]

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            lto_cache: C:/xclang-thinlto
            startup: --output_user_root=C:/b
            mode: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ matrix.mode }}
      STARTUP: ${{ matrix.startup }}
      LTO_CACHE: ${{ matrix.lto_cache }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # actions/cache takes no '..' in a path, and Bazel no repository cache
      # inside the workspace.
      - name: Cache paths
        run: |
          echo "DISK_CACHE=$RUNNER_TEMP/bazel-disk" >> "$GITHUB_ENV"
          echo "REPO_CACHE=$RUNNER_TEMP/bazel-repo" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-pixi
        with:
          environments: default
          activate-environment: default

      - name: Restore Bazel caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.DISK_CACHE }}
            ${{ env.REPO_CACHE }}
          key: lto-bench-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-bazel-${{ github.run_id }}
          restore-keys: |
            lto-bench-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-bazel-

      - name: Restore the ThinLTO cache
        if: env.MODE == 'ci'
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.lto_cache }}
          key: lto-bench-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-thinlto-${{ github.run_id }}
          restore-keys: |
            lto-bench-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-thinlto-

      - name: Build
        timeout-minutes: 120
        run: scripts/lto-bench.sh build

      - name: Save Bazel caches
        if: env.MODE != 'ci'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.DISK_CACHE }}
            ${{ env.REPO_CACHE }}
          key: lto-bench-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-bazel-${{ github.run_id }}

      - name: Probes
        run: scripts/lto-bench.sh probes

      - name: Measure
        run: scripts/lto-bench.sh "$MODE"

      - name: Save the ThinLTO cache
        if: env.MODE == 'full' || env.MODE == 'win'
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.lto_cache }}
          key: lto-bench-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-thinlto-${{ github.run_id }}

      # win: the cache it saved, back through actions/cache on this machine.
      - name: Drop the ThinLTO cache
        if: env.MODE == 'win'
        run: rm -rf "$LTO_CACHE"

      - name: Restore the ThinLTO cache it saved
        if: env.MODE == 'win'
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.lto_cache }}
          key: lto-bench-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-thinlto-${{ github.run_id }}

      - name: Measure after the restore
        if: env.MODE == 'win'
        run: scripts/lto-bench.sh ci

      - name: Results
        if: always()
        run: cat lto-out/results.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lto-${{ runner.os }}
          path: lto-out

  # The xclang module's thinlto_cache feature (scripts/lto-module.sh): its own
  # toolchain and libclang, no pixi.
  module:
    # Linux and macOS done in run 37041436235.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            lto_cache: C:/xclang-thinlto
            startup: --output_user_root=C:/b
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      STARTUP: ${{ matrix.startup }}
      LTO_CACHE: ${{ matrix.lto_cache }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Measure
        run: scripts/lto-module.sh

      - name: Results
        if: always()
        run: cat lto-out/module/results.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lto-module-${{ runner.os }}
          path: lto-out/module
