name: native-test

on:
  workflow_call:

env:
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  # One full build per leg is 130–560 MB; eight legs must share the
  # repository's 10 GB cache pool with everything else.
  CCACHE_MAXSIZE: 1G

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # asset_name marks the RelWithDebInfo builds that get packaged into
          # release artifacts once their test suites pass.
          - os: windows-2025
            build_type: RelWithDebInfo
            asset_name: clice.x86_64-pc-windows-msvc.zip
            target_name: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            build_type: Debug
          - os: ubuntu-24.04
            build_type: RelWithDebInfo
            asset_name: clice.x86_64-unknown-linux-gnu.tar.gz
            target_name: x86_64-unknown-linux-gnu
          - os: macos-15
            build_type: Debug
          - os: macos-15
            build_type: RelWithDebInfo
            asset_name: clice.aarch64-apple-darwin.tar.gz
            target_name: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pixi
        with:
          environments: default test-run
          activate-environment: default

      # Pull requests only restore: every push saving its own copy churns
      # the repository's 10 GB cache pool faster than the next run can reuse
      # it. Saved from main below, once per merge.
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-${{ matrix.build_type }}-native-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.build_type }}-native-ccache-

      - name: Zero cache stats
        run: pixi run -- ccache --zero-stats

      - name: Build
        run: pixi run build ${{ matrix.build_type }} ON

      - name: Save compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-${{ matrix.build_type }}-native-ccache-${{ github.sha }}

      # Process start-up is the fixed cost every test-suite process pays
      # (inspect runs, servers, workers); the two build types differ in
      # linkage and sanitizers, so both are timed.
      - name: Process startup cost
        shell: bash
        run: |
          for _ in 1 2; do time build/${{ matrix.build_type }}/bin/clice${{ runner.os == 'Windows' && '.exe' || '' }} --version; done

      # Upload artifacts for editor tests (the ubuntu and macOS RelWithDebInfo
      # builds are consumed by editor-test; uploading all keeps the option open
      # for other downstream consumers).
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: native-build-${{ matrix.os }}-${{ matrix.build_type }}
          include-hidden-files: true
          path: |
            build/${{ matrix.build_type }}/bin/
            build/${{ matrix.build_type }}/lib/
            build/${{ matrix.build_type }}/.llvm/lib/*.so*
            build/${{ matrix.build_type }}/.llvm/lib/*.dylib
            build/${{ matrix.build_type }}/.llvm/bin/*.dll
          if-no-files-found: error
          retention-days: 1

      - name: Unit tests
        timeout-minutes: 5
        run: pixi run -e test-run unit-test ${{ matrix.build_type }}

      - name: Integration tests
        timeout-minutes: 20
        run: pixi run -e test-run integration-test ${{ matrix.build_type }}

      - name: Smoke tests
        timeout-minutes: 5
        run: pixi run -e test-run smoke-test ${{ matrix.build_type }}

      - name: Snap tests
        timeout-minutes: 20
        run: pixi run -e test-run snap-test ${{ matrix.build_type }}

      # The committed config schema must match the binary that just built
      # (the dump needs clice itself). One leg suffices — the output is
      # machine-independent by construction. The pure-node doc checks
      # (feature/config/translation) run in the lint workflow instead.
      - name: Config schema check
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.build_type == 'RelWithDebInfo' }}
        run: |
          build/RelWithDebInfo/bin/clice inspect --config-schema > docs/public/clice-config.schema.json
          git diff --exit-code -- docs/public/clice-config.schema.json

      # Package the exact binary the suites above just validated. These
      # artifacts are what releases promote — there is no separate release
      # build.
      - name: Package release artifacts
        if: ${{ matrix.asset_name }}
        shell: bash
        run: pixi run -- cmake --build build/${{ matrix.build_type }} --target clice-pack clice-pack-symbol

      - name: Check artifact dependencies
        if: ${{ matrix.asset_name && !contains(matrix.os, 'windows') }}
        shell: bash
        run: pixi run -- python scripts/check_artifact_deps.py build/${{ matrix.build_type }}/pack/clice/bin/clice

      - name: Upload package artifacts
        if: ${{ matrix.asset_name }}
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.asset_name }}
          path: |
            build/${{ matrix.build_type }}/clice.tar.gz
            build/${{ matrix.build_type }}/clice.zip
            build/${{ matrix.build_type }}/clice-symbol.tar.xz
            build/${{ matrix.build_type }}/clice-symbol.zip
          if-no-files-found: error
          # 30 days bounds how old a commit a stable tag can still promote.
          retention-days: 30

      - name: Upload full debug info
        if: ${{ matrix.asset_name && !contains(matrix.os, 'windows') }}
        uses: actions/upload-artifact@v7
        with:
          name: debug-info-${{ matrix.target_name }}
          path: |
            build/${{ matrix.build_type }}/pack-symbol/clice.debug
            build/${{ matrix.build_type }}/pack-symbol/clice.dSYM
          if-no-files-found: error
          retention-days: 90

      - name: Print cache stats
        if: always()
        run: pixi run -- ccache --show-stats
