name: native-test

on:
  workflow_call:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # asset_name marks the builds that get packaged into release
          # artifacts once their test suites pass; they link what releases
          # ship (--config=release).
          - os: ubuntu-24.04
            build_type: RelWithDebInfo
            target: x86_64-unknown-linux-gnu
            asset_name: clice.x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04
            build_type: Debug
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            build_type: RelWithDebInfo
            target: aarch64-unknown-linux-gnu
            asset_name: clice.aarch64-unknown-linux-gnu.tar.gz
          - os: macos-15
            build_type: RelWithDebInfo
            target: aarch64-apple-darwin
            asset_name: clice.aarch64-apple-darwin.tar.gz
          - os: macos-15
            build_type: Debug
            target: aarch64-apple-darwin
          - os: macos-15-intel
            build_type: RelWithDebInfo
            target: x86_64-apple-darwin
            asset_name: clice.x86_64-apple-darwin.tar.gz
          - os: windows-2025
            build_type: RelWithDebInfo
            target: x86_64-w64-mingw32
            asset_name: clice.x86_64-w64-mingw32.zip
          - os: windows-11-arm
            build_type: RelWithDebInfo
            target: aarch64-w64-mingw32
            asset_name: clice.aarch64-w64-mingw32.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pixi
        with:
          environments: default test-run
          activate-environment: default

      # Pull requests only restore: every push saving its own copy churns
      # the repository's 50 GB cache pool faster than the next run can reuse
      # it. Saved from main below, once per merge. Every input of an action,
      # the toolchain's files among them, is in its key, so nothing else
      # needs to be in the cache's.
      - name: Restore Bazel caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: bazel-${{ matrix.target }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ matrix.target }}-${{ matrix.build_type }}-

      # Bazel refuses a repository cache inside the workspace. On Windows,
      # the default output root under the user profile pushes action paths
      # past MAX_PATH. On main every cached output is fetched, which marks
      # it used for the prune below; elsewhere only what is asked for, but
      # on macOS also the object files dsymutil reads the debug info from.
      - name: Bazel settings
        run: |
          temp=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          {
            echo "common --disk_cache=$temp/bazel-disk"
            echo "common --repository_cache=$temp/bazel-repo"
            if [ "$RUNNER_OS" = Windows ]; then
              echo "startup --output_user_root=C:/b"
            fi
            if [ "$GITHUB_REF" = refs/heads/main ] || [ "$RUNNER_OS" = macOS ]; then
              echo "common --remote_download_all"
            fi
          } > user.bazelrc
          touch "$RUNNER_TEMP/bazel-start"

      - name: Build
        run: pixi run build ${{ matrix.build_type }} -- ${{ matrix.asset_name && '--config=release' || '' }}

      # Bazel refreshes an entry's mtime when it reads it, so what this run
      # did not touch is what the current tree no longer needs.
      - name: Prune the disk cache
        if: github.ref == 'refs/heads/main'
        run: |
          find "$RUNNER_TEMP/bazel-disk" -type f ! -newer "$RUNNER_TEMP/bazel-start" -delete
          du -sh "$RUNNER_TEMP/bazel-disk" "$RUNNER_TEMP/bazel-repo"

      - name: Save Bazel caches
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
          key: bazel-${{ matrix.target }}-${{ matrix.build_type }}-${{ github.sha }}

      # Process start-up is the fixed cost every test-suite process pays
      # (inspect runs, servers, workers); the two build types differ in
      # linkage and sanitizers, so both are timed.
      - name: Process startup cost
        run: |
          for _ in 1 2; do time build/${{ matrix.build_type }}/bin/clice${{ runner.os == 'Windows' && '.exe' || '' }} --version; done

      # The suites below and the jobs that follow (editor-test, compat-test,
      # instant builds) take the programs from build/<type>, which this
      # artifact holds.
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}-${{ matrix.build_type }}
          include-hidden-files: true
          path: |
            build/${{ matrix.build_type }}/bin/
            build/${{ matrix.build_type }}/lib/
          if-no-files-found: error
          retention-days: 1

      - name: Unit tests
        timeout-minutes: 10
        run: pixi run -e test-run unit-test ${{ matrix.build_type }}

      - name: Integration tests
        timeout-minutes: 30
        run: pixi run -e test-run integration-test ${{ matrix.build_type }}

      - name: Smoke tests
        timeout-minutes: 5
        run: pixi run -e test-run smoke-test ${{ matrix.build_type }}

      - name: Snap tests
        timeout-minutes: 20
        run: pixi run -e test-run snap-test ${{ matrix.build_type }}

      # The committed config schema must match the binary that just built
      # (the dump needs clice itself). One leg suffices — the output is
      # machine-independent by construction. The pure-node doc checks
      # (feature/config/translation) run in the lint workflow instead.
      - name: Config schema check
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && matrix.build_type == 'RelWithDebInfo' }}
        run: |
          build/RelWithDebInfo/bin/clice inspect --config-schema > docs/public/clice-config.schema.json
          git diff --exit-code -- docs/public/clice-config.schema.json

      # Package the exact binary the suites above just validated. These
      # artifacts are what releases promote — there is no separate release
      # build.
      - name: Package release artifacts
        if: ${{ matrix.asset_name }}
        run: pixi run package ${{ matrix.build_type }}

      - name: Check artifact dependencies
        if: ${{ matrix.asset_name }}
        run: pixi run -- python scripts/check_artifact_deps.py build/${{ matrix.build_type }}/pack/clice/bin/clice${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Upload package artifacts
        if: ${{ matrix.asset_name }}
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.asset_name }}
          path: |
            build/${{ matrix.build_type }}/clice.tar.gz
            build/${{ matrix.build_type }}/clice.zip
            build/${{ matrix.build_type }}/clice-symbol.tar.xz
            build/${{ matrix.build_type }}/clice-symbol.zip
          if-no-files-found: error
          # 30 days bounds how old a commit a stable tag can still promote.
          retention-days: 30

      - name: Upload full debug info
        if: ${{ matrix.asset_name }}
        uses: actions/upload-artifact@v7
        with:
          name: debug-info-${{ matrix.target }}
          path: |
            build/${{ matrix.build_type }}/pack-symbol/clice.debug
            build/${{ matrix.build_type }}/pack-symbol/clice.dSYM
          if-no-files-found: error
          retention-days: 90
