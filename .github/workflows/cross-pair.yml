name: cross-pair

on:
  workflow_call:
    inputs:
      build_os:
        required: true
        type: string
      test_os:
        required: true
        type: string
      target_triple:
        required: true
        type: string
      # Standard triple (e.g. aarch64-unknown-linux-gnu) used for artifact
      # naming; matches the compiler triple.
      target_name:
        required: true
        type: string
      pixi_env:
        required: false
        type: string
        default: "default"
      asset_name:
        required: true
        type: string

env:
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  # The precompiled headers plus one full build come to about 1 GB
  # compressed per leg, and ccache's LRU cleanup starts evicting live
  # objects once the cache nears its cap, so allow twice that. Eight legs
  # at 2 GB per main commit fit the repository's 50 GB cache pool.
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ${{ inputs.build_os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pixi
        with:
          environments: ${{ inputs.pixi_env }}

      # Restore only; saved below, after the build, on pushes to main.
      # Scoped per xclang build of this machine's platform: on Windows the
      # compiler ccache hashes is xclang's launcher (clang++.exe starts
      # llvm.exe), the same bytes in every release, so its compiler check
      # cannot tell two builds apart, and clang rejects a precompiled
      # header from another one.
      - name: Compiler cache scope
        id: ccache-scope
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) subdir=linux-64 ;; Linux-ARM64) subdir=linux-aarch64 ;;
            macOS-X64) subdir=osx-64 ;; macOS-ARM64) subdir=osx-arm64 ;;
            Windows-X64) subdir=win-64 ;; Windows-ARM64) subdir=win-arm64 ;;
            *) echo "::error::no conda platform for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          scope=$(grep -om1 "/$subdir/xclang-[^/ ]*\.conda" pixi.lock | sed 's|.*/||')
          if [ -z "$scope" ]; then
            echo "::error::no xclang package for $subdir in pixi.lock"
            exit 1
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-${{ steps.ccache-scope.outputs.scope }}-RelWithDebInfo-${{ inputs.target_triple }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.ccache-scope.outputs.scope }}-RelWithDebInfo-${{ inputs.target_triple }}-ccache-

      - name: Zero cache stats
        run: pixi run -e "${{ inputs.pixi_env }}" -- ccache --zero-stats

      - name: Build
        shell: bash
        run: |
          pixi run -e "${{ inputs.pixi_env }}" cmake-config RelWithDebInfo OFF -- \
            "-DCLICE_TARGET_TRIPLE=${{ inputs.target_triple }}"
          pixi run -e "${{ inputs.pixi_env }}" cmake-build RelWithDebInfo

      - name: Save compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-${{ steps.ccache-scope.outputs.scope }}-RelWithDebInfo-${{ inputs.target_triple }}-ccache-${{ github.sha }}

      # Package here, where the object files live (dsymutil needs them);
      # promotion to a release is still gated on the whole run being green.
      - name: Package release artifacts
        shell: bash
        run: |
          pixi run -e "${{ inputs.pixi_env }}" -- cmake --build build/RelWithDebInfo \
            --target clice-pack clice-pack-symbol

      - name: Check artifact dependencies
        shell: bash
        run: |
          pixi run -e "${{ inputs.pixi_env }}" -- \
            python scripts/check_artifact_deps.py build/RelWithDebInfo/pack/clice/bin/clice${{ contains(inputs.target_triple, 'mingw') && '.exe' || '' }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ inputs.asset_name }}
          path: |
            build/RelWithDebInfo/clice.tar.gz
            build/RelWithDebInfo/clice.zip
            build/RelWithDebInfo/clice-symbol.tar.xz
            build/RelWithDebInfo/clice-symbol.zip
          if-no-files-found: error
          # 30 days bounds how old a commit a stable tag can still promote.
          retention-days: 30

      - name: Upload full debug info
        uses: actions/upload-artifact@v7
        with:
          name: debug-info-${{ inputs.target_name }}
          path: |
            build/RelWithDebInfo/pack-symbol/clice.debug
            build/RelWithDebInfo/pack-symbol/clice.dSYM
          if-no-files-found: error
          retention-days: 90

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: cross-build-${{ inputs.target_name }}
          path: |
            build/RelWithDebInfo/bin/
            build/RelWithDebInfo/lib/
          if-no-files-found: error
          retention-days: 1

      - name: Print cache stats
        if: always()
        run: pixi run -e "${{ inputs.pixi_env }}" -- ccache --show-stats
        shell: bash

  test:
    needs: build
    runs-on: ${{ inputs.test_os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pixi
        with:
          environments: test-run

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: cross-build-${{ inputs.target_name }}
          path: build/RelWithDebInfo/

      - name: Make binaries executable
        if: runner.os != 'Windows'
        run: chmod +x build/RelWithDebInfo/bin/*

      - name: Process startup cost
        shell: bash
        run: |
          for _ in 1 2; do time build/RelWithDebInfo/bin/clice${{ runner.os == 'Windows' && '.exe' || '' }} --version; done

      - name: Unit tests
        timeout-minutes: 5
        run: pixi run -e test-run unit-test RelWithDebInfo

      - name: Integration tests
        timeout-minutes: 15
        run: pixi run -e test-run integration-test RelWithDebInfo

      - name: Smoke tests
        timeout-minutes: 5
        run: pixi run -e test-run smoke-test RelWithDebInfo

      - name: Snap tests
        timeout-minutes: 10
        run: pixi run -e test-run snap-test RelWithDebInfo
