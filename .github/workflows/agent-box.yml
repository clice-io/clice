# Installed by `box install`, which later only moves the agent-box pin. Add whatever setup the
# box should start with before the last step: the checkout, toolchain and cache restore steps of
# this repo's CI, so a box builds where and how CI does.
name: agent-box
run-name: agent-box ${{ inputs.lease }}
on:
  push:
    branches: [agent-box]
  workflow_dispatch:
    inputs:
      lease:
        required: true
      pubkey:
        required: true
      minutes:
        default: "340"
      os:
        type: choice
        default: linux
        options: [linux, linux-arm, macos, macos-intel, windows, windows-arm]
permissions:
  contents: read
jobs:
  box:
    if: github.event_name == 'workflow_dispatch' && github.actor == '16bit-ykiko' && github.triggering_actor == '16bit-ykiko'
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","linux-arm":"ubuntu-24.04-arm","macos":"macos-15","macos-intel":"macos-15-intel","windows":"windows-2025","windows-arm":"windows-11-arm"}')[inputs.os] || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi
        with:
          environments: default test-run
          activate-environment: default
      # Restore only; main's CI saves. A box has no build type: RelWithDebInfo,
      # what CI ships. The paths are native-test.yml's, which the entry's
      # version is made of; lld's ThinLTO cache keeps links of libclang's
      # bitcode to seconds.
      - name: Restore Bazel caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/bazel-disk
            ${{ runner.temp }}/bazel-repo
            ${{ runner.os == 'Windows' && 'C:/xclang-thinlto' || '/var/tmp/xclang-thinlto' }}
          key: bazel-${{ fromJSON('{"linux":"x86_64-unknown-linux-gnu","linux-arm":"aarch64-unknown-linux-gnu","macos":"aarch64-apple-darwin","macos-intel":"x86_64-apple-darwin","windows":"x86_64-w64-mingw32","windows-arm":"aarch64-w64-mingw32"}')[inputs.os] }}-RelWithDebInfo-
          restore-keys: |
            bazel-${{ fromJSON('{"linux":"x86_64-unknown-linux-gnu","linux-arm":"aarch64-unknown-linux-gnu","macos":"aarch64-apple-darwin","macos-intel":"x86_64-apple-darwin","windows":"x86_64-w64-mingw32","windows-arm":"aarch64-w64-mingw32"}')[inputs.os] }}-RelWithDebInfo-
      # As native-test.yml's, so a box builds where and how CI does.
      - name: Bazel settings
        shell: bash
        run: |
          temp=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          {
            echo "common --disk_cache=$temp/bazel-disk"
            echo "common --repository_cache=$temp/bazel-repo"
            if [ "$RUNNER_OS" = Windows ]; then
              echo "startup --output_user_root=C:/b"
            fi
          } > user.bazelrc
          mkdir -p ~/.box
          cat > ~/.box/notes <<'NOTES'
          Build as CI does, so its Bazel cache hits: pixi run build RelWithDebInfo
          (user.bazelrc in ~/src points Bazel at the cache CI's main run saved);
          the programs land in build/RelWithDebInfo/bin/bin.
          NOTES
      - uses: 16bit-ykiko/agent-box@a0fc879b1b1aa0ba8922018c82479a5ca7953c12
        with:
          pubkey: ${{ inputs.pubkey }}
          minutes: ${{ inputs.minutes }}
