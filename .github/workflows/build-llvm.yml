name: build llvm

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM version to build (e.g., 22.1.8)"
        required: true
        type: string
      patch_ref:
        description: "clice-llvm ref for patches (default: main). Set to a release tag (e.g., 22.1.8) to reproduce a previous build."
        required: false
        default: "main"
        type: string

concurrency:
  group: build-llvm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds
          - os: windows-2022
            llvm_mode: RelWithDebInfo
            lto: OFF
          - os: windows-2022
            llvm_mode: RelWithDebInfo
            lto: ON
          - os: ubuntu-24.04
            llvm_mode: Debug
            lto: OFF
          - os: ubuntu-24.04
            llvm_mode: RelWithDebInfo
            lto: OFF
          - os: ubuntu-24.04
            llvm_mode: RelWithDebInfo
            lto: ON
          - os: macos-15
            llvm_mode: Debug
            lto: OFF
          - os: macos-15
            llvm_mode: RelWithDebInfo
            lto: OFF
          - os: macos-15
            llvm_mode: RelWithDebInfo
            lto: ON

          # Cross-compilation builds
          # macOS x64 (from arm64 macos-15)
          - os: macos-15
            llvm_mode: RelWithDebInfo
            lto: OFF
            target_triple: x86_64-apple-darwin
          - os: macos-15
            llvm_mode: RelWithDebInfo
            lto: ON
            target_triple: x86_64-apple-darwin

          # Linux aarch64 (from x64 ubuntu-24.04)
          - os: ubuntu-24.04
            llvm_mode: RelWithDebInfo
            lto: OFF
            target_triple: aarch64-unknown-linux-gnu
            pixi_env: cross-linux-arm64
          - os: ubuntu-24.04
            llvm_mode: RelWithDebInfo
            lto: ON
            target_triple: aarch64-unknown-linux-gnu
            pixi_env: cross-linux-arm64

          # Windows arm64 (from x64 windows-2022)
          - os: windows-2022
            llvm_mode: RelWithDebInfo
            lto: OFF
            target_triple: aarch64-pc-windows-msvc
            pixi_env: cross-windows-arm64
          - os: windows-2022
            llvm_mode: RelWithDebInfo
            lto: ON
            target_triple: aarch64-pc-windows-msvc
            pixi_env: cross-windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free Disk Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main

      - name: Increase Swap Space
        if: runner.os == 'Linux'
        run: |
          echo "===== Initial Status ====="
          sudo swapon --show
          free -h

          echo "===== Creating Swap File ====="
          sudo swapoff -a
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          echo "===== Final Status ====="
          sudo swapon --show
          free -h
          df -h

      - uses: ./.github/actions/setup-pixi
        with:
          environments: ${{ matrix.pixi_env || 'package' }}

      - name: Free Disk Space (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "=== Before cleanup ==="
          df -h /

          # Remove iOS/tvOS/watchOS/visionOS simulators
          if [ -d "/Library/Developer/CoreSimulator" ]; then
            sudo rm -rf /Library/Developer/CoreSimulator
            echo "Removed CoreSimulator"
          fi

          # Remove unnecessary Xcode platforms (keep macOS only)
          XCODE_PATH="$(xcode-select -p)"
          PLATFORMS_DIR="${XCODE_PATH}/Platforms"
          for platform in iPhoneOS.platform iPhoneSimulator.platform AppleTVOS.platform AppleTVSimulator.platform WatchOS.platform WatchSimulator.platform XROS.platform XRSimulator.platform; do
            if [ -d "${PLATFORMS_DIR}/${platform}" ]; then
              sudo rm -rf "${PLATFORMS_DIR}/${platform}"
              echo "Removed ${platform}"
            fi
          done

          # Remove Android SDK
          sudo rm -rf ~/Library/Android

          # Remove .NET/PowerShell
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /usr/local/share/powershell

          # Remove Haskell
          sudo rm -rf ~/.ghcup

          echo "=== After cleanup ==="
          df -h /

      # The libc++ that goes into the package is built from the sources of
      # the compiler's own release, which may be newer than the LLVM being
      # packaged; each checkout gets the patches of its own version.
      - name: Clone llvm-project
        shell: bash
        env:
          VERSION: ${{ inputs.llvm_version || '22.1.8' }}
          REF: ${{ inputs.patch_ref || 'main' }}
        run: |
          ENV="${{ matrix.pixi_env || 'package' }}"
          RUNTIMES_VERSION="$(pixi run -e "$ENV" clang --version | sed -nE '1s/.*clang version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          echo "LLVM ${VERSION}, libc++ ${RUNTIMES_VERSION}"

          if git clone --branch "$REF" --depth 1 https://github.com/clice-io/clice-llvm.git .clice-llvm 2>/dev/null; then
            echo "Using patches from clice-llvm@$REF"
          else
            echo "Ref '$REF' not found, falling back to main"
            git clone --depth 1 https://github.com/clice-io/clice-llvm.git .clice-llvm
          fi

          clone_and_patch() {
            local version="$1" dir="$2"
            git clone --branch "llvmorg-${version}" --depth 1 https://github.com/llvm/llvm-project.git "$dir"
            local patch_dir=".clice-llvm/patches/${version}"
            if ls "$patch_dir"/*.patch >/dev/null 2>&1; then
              for patch in "$patch_dir"/*.patch; do
                echo "Applying $(basename "$patch") to ${dir}..."
                git -C "$dir" apply "$(pwd)/$patch"
              done
            else
              echo "No patches for LLVM ${version}"
            fi
          }

          clone_and_patch "$VERSION" .llvm
          if [[ "$RUNTIMES_VERSION" == "$VERSION" ]]; then
            echo "RUNTIMES_SRC=.llvm" >> "$GITHUB_ENV"
          else
            clone_and_patch "$RUNTIMES_VERSION" .runtimes
            echo "RUNTIMES_SRC=.runtimes" >> "$GITHUB_ENV"
          fi

      - name: Build LLVM (install-distribution)
        shell: bash
        run: |
          ENV="${{ matrix.pixi_env || 'package' }}"
          EXTRA_ARGS=""
          if [[ -n "${{ matrix.target_triple }}" ]]; then
            EXTRA_ARGS="--target-triple=${{ matrix.target_triple }}"
          fi
          pixi run -e "$ENV" python3 scripts/build-llvm.py \
            --llvm-src=.llvm \
            --runtimes-src="${RUNTIMES_SRC}" \
            --mode="${{ matrix.llvm_mode }}" \
            --lto="${{ matrix.lto }}" \
            --build-dir=build \
            ${EXTRA_ARGS}

      - name: Package LLVM install directory
        shell: bash
        run: |
          if [[ -n "${{ matrix.target_triple }}" ]]; then
            TRIPLE="${{ matrix.target_triple }}"
          else
            case "${{ matrix.os }}" in
              ubuntu-*)  TRIPLE="x86_64-unknown-linux-gnu" ;;
              macos-*)   TRIPLE="aarch64-apple-darwin" ;;
              windows-*) TRIPLE="x86_64-pc-windows-msvc" ;;
            esac
          fi

          if [[ "${{ matrix.llvm_mode }}" == "Debug" ]]; then MODE_TAG="debug"; else MODE_TAG="releasedbg"; fi
          SUFFIX=""
          if [[ "${{ matrix.lto }}" == "ON" ]]; then SUFFIX+="-lto"; fi
          if [[ "${{ matrix.llvm_mode }}" == "Debug" && "${{ matrix.os }}" != windows-* ]]; then SUFFIX+="-asan"; fi
          ARCHIVE="${TRIPLE}.${MODE_TAG}${SUFFIX}.tar.xz"

          set -eo pipefail
          tar -C .llvm/build-install -cf - . | xz -T0 -9 -c > "${ARCHIVE}"
          echo "LLVM_INSTALL_ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Upload LLVM install artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LLVM_INSTALL_ARCHIVE }}
          path: ${{ env.LLVM_INSTALL_ARCHIVE }}
          if-no-files-found: error
