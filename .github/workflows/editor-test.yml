name: editor-test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string

jobs:
  editor:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/download-programs
        with:
          target: ${{ inputs.target }}
          build_type: RelWithDebInfo
          environments: editor

      # Always the latest stable release on purpose: this job exists to
      # catch breakage caused by new editor versions.
      - name: Install neovim (stable)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          sudo tar -xzf /tmp/nvim.tar.gz -C /opt
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Restore VSCode download cache
        id: vscode-cache
        uses: actions/cache/restore@v6
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('editors/vscode/package.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      - name: Neovim E2E tests
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: pixi run -e editor nvim-e2e RelWithDebInfo

      # Linux runners have no display: xvfb gives VS Code one.
      - name: VSCode E2E tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: xvfb-run -a pixi run -e editor vscode-e2e RelWithDebInfo

      - name: VSCode E2E tests
        if: runner.os != 'Linux'
        timeout-minutes: 20
        run: pixi run -e editor vscode-e2e RelWithDebInfo

      - name: Save VSCode download cache
        if: github.ref == 'refs/heads/main' && steps.vscode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('editors/vscode/package.json') }}

  # The Zed extension in a real Zed, this run's clice its installed version.
  # Zed has no macOS runner here.
  zed:
    if: ${{ !startsWith(inputs.os, 'macos') }}
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/download-programs
        with:
          target: ${{ inputs.target }}
          build_type: RelWithDebInfo
          environments: editor

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: editors/zed

      # wasm32-wasip2 is the target Zed and its extension registry build with.
      - name: Add the wasm target
        run: rustup target add wasm32-wasip2

      # Always the latest stable Zed on purpose, like the other editor tests.
      - name: Install Zed (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/zed.tar.gz" \
            "https://cloud.zed.dev/releases/stable/latest/download?asset=zed&arch=x86_64&os=linux"
          tar -xzf "$RUNNER_TEMP/zed.tar.gz" -C "$RUNNER_TEMP"
          echo "ZED_EXECUTABLE=$RUNNER_TEMP/zed.app/libexec/zed-editor" >> "$GITHUB_ENV"

      - name: Install Zed (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/zed-setup.exe" \
            https://zed.dev/api/releases/stable/latest/Zed-x86_64.exe
          "$RUNNER_TEMP/zed-setup.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //SP- //CURRENTUSER
          echo "ZED_EXECUTABLE=$LOCALAPPDATA/Programs/Zed/Zed.exe" >> "$GITHUB_ENV"

      - name: Zed E2E test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: xvfb-run -a pixi run -e editor zed-e2e RelWithDebInfo

      - name: Zed E2E test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: pixi run -e editor zed-e2e RelWithDebInfo
