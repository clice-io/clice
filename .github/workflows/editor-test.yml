name: editor-test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string

jobs:
  editor:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/download-programs
        with:
          target: ${{ inputs.target }}
          build_type: RelWithDebInfo
          environments: editor

      # Always the latest stable release on purpose: this job exists to
      # catch breakage caused by new editor versions.
      - name: Install neovim (stable)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          sudo tar -xzf /tmp/nvim.tar.gz -C /opt
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Restore VSCode download cache
        id: vscode-cache
        uses: actions/cache/restore@v6
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('editors/vscode/package.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      - name: Neovim E2E tests
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: pixi run -e editor nvim-e2e RelWithDebInfo

      # macOS runners have no headless X server, so run without xvfb there.
      - name: VSCode E2E tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: xvfb-run -a pixi run -e editor vscode-e2e RelWithDebInfo

      - name: VSCode E2E tests (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: pixi run -e editor vscode-e2e RelWithDebInfo

      - name: Save VSCode download cache
        if: github.ref == 'refs/heads/main' && steps.vscode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('editors/vscode/package.json') }}
