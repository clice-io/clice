name: docs

# Publishes docs.clice.io from main's pages and the cards its tests make;
# pull requests check theirs in main.yml's docs-site. It runs once a main
# run completes, its cards made by then, and publishes main as it stands:
# the newest commit's pages with the newest cards made at or before it. A
# deploy waits for the one under way and replaces one still waiting, so the
# site only moves forward.
on:
  workflow_run:
    workflows: [main]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # A fork's pull request from its own branch named main is not main; a
    # skipped job takes no place in the queue, which a run would.
    if: ${{ github.event.workflow_run.event == 'push' }}
    concurrency:
      group: docs
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      # Under workflow_run, the newest commit of main.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-cards
        with:
          commit: ${{ github.sha }}
      - uses: clice-io/docs@main
        with:
          project: clice
          token: ${{ secrets.CLICE_DOCS }}
