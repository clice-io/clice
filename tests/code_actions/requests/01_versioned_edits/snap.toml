[[test.f.code_actions]]
kind = "refactor.rewrite.define.inline"
title = "Define 'f' inline"

[test.f.code_actions.edits]
"main.cpp" = '''
 struct S {
-    int f(int x = 4) const;
+    int f(int x = 4) const {}
 };
'''

[[test.f.code_actions]]
kind = "refactor.rewrite.define.outOfLine"
title = "Define 'S::f' out of line"

[test.f.code_actions.edits]
"main.cpp" = '''
     int f(int x = 4) const;
 };
+
+int S::f(int x) const {
+}
'''
