[readonly."clice.toml"]
pushes = [
    [
        {
            at = 'readonly = ⟦"On"⟧',
            severity = "error",
            message = "unknown enum value 'On' at rules[0].readonly",
            source = "clice",
        },
    ],
]

[glob."clice.toml"]
pushes = [
    [
        {
            at = 'patterns = [⟦"src/[a"⟧]',
            severity = "error",
            message = "invalid glob pattern 'src/[a': unmatched `[` at rules[0].patterns[0]",
            source = "clice",
        },
    ],
]

["include glob"."clice.toml"]
pushes = [
    [
        {
            at = 'angled_includes = [⟦"acme/[a"⟧]',
            severity = "error",
            message = "invalid glob pattern 'acme/[a': unmatched `[` at code_completion.angled_includes[0]",
            source = "clice",
        },
        {
            at = 'quoted_includes = [⟦"acme\\**"⟧]',
            severity = "error",
            message = "'acme\\**' holds a backslash: separate directories with `/` on every platform, and match a literal `*`, `?`, `[` or `{` with a range such as `[*]` at code_completion.quoted_includes[0]",
            source = "clice",
        },
    ],
]

[backslash."clice.toml"]
pushes = [
    [
        {
            at = 'patterns = [⟦"src\\**"⟧]',
            severity = "error",
            message = "'src\\**' holds a backslash: separate directories with `/` on every platform, and match a literal `*`, `?`, `[` or `{` with a range such as `[*]` at rules[0].patterns[0]",
            source = "clice",
        },
    ],
]

["worker count"."clice.toml"]
pushes = [
    [
        {
            at = "max = ⟦0⟧",
            severity = "error",
            message = 'a worker count must be at least 1, or "auto" at workers.max',
            source = "clice",
        },
    ],
]

[limit."clice.toml"]
pushes = [
    [
        {
            at = "limit = ⟦0⟧",
            severity = "error",
            message = 'a limit must be at least 1; "unlimited" lifts it at references.limit',
            source = "clice",
        },
    ],
]
