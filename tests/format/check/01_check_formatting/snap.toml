    "stderr: int  main( ) { return 0 ; }",
    "stderr:           ^",
    "stderr: ${WS}/main.cpp:1:24: error: code should be clang-formatted [-Wclang-format-violations]",
    "stderr: int  main( ) { return 0 ; }",
    "stderr:                        ^",
]
