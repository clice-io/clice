[test."vec.tpp"]
diagnostics = [
    {
        at = "namespace detail ⟦{⟧",
        severity = "error",
        message = "expected '}'",
        source = "clang",
        code = "err_expected",
    },
]

[test.outline]
document_symbols = [
    {
        name = "detail",
        kind = "Namespace",
        at = "namespace ⟦detail⟧ {",
        range = "⟦namespace detail { … ⟧ (3 lines)",
        children = [
            {
                name = "helper",
                kind = "Function",
                at = "template <class T> T ⟦helper⟧() { return T{}; }",
                range = "⟦template <class T> T helper() { return T{}; }⟧",
            },
        ],
    },
]
