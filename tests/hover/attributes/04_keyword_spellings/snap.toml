[answers.asm_label.hover]
markdown = '''
**attribute** `asm`

```cpp
asm("real_counter")
```

---
This attribute can be used on a function or variable to specify its symbol name.
On some targets, all C symbols are prefixed by default with a single character, typically `_`. This was done historically to distinguish them from symbols used by other languages. (This prefix is also added to the standard Itanium C++ ABI prefix on "mangled" symbol names, so that e.g. on such targets the true symbol name for a C++ variable declared as `int cppvar;` would be `__Z6cppvar`; note the two underscores.) This prefix is not added to the symbol names specified by the `__asm` attribute; programmers wishing to match a C symbol name must compensate for this.
For example, consider the following C code:
```c
int var1 __asm("altvar") = 1;  // "altvar" in symbol table.
int var2 = 1; // "_var2" in symbol table.

void func1(void) __asm("altfunc");
void func1(void) {} // "altfunc" in symbol table.
void func2(void) {} // "_func2" in symbol table.
```
Clang's implementation of this attribute is compatible with GCC's, documented here.
While it is possible to use this attribute to name a special symbol used internally by the compiler, such as an LLVM intrinsic, this is neither recommended nor supported and may cause the compiler to crash or miscompile. Users who wish to gain access to intrinsic behavior are strongly encouraged to request new builtin functions.
'''
range = 'int counter __asm__(⟦"real_counter"⟧);'

