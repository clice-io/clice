[answers.include]
prepare_rename = {}

[answers.operator.prepare_rename]
error = "`operator+` is named by the language, not by an identifier"

[answers.dependent.prepare_rename]
error = "the name here resolves to `Point::x` and `Size::x`; rename them to one name in one list of renames, or one of them from its declaration"

[answers.system.prepare_rename]
error = "`printf` is declared in a system header"

[answers.command_line.prepare_rename]
error = "the compile command or the compiler defines `FROM_BUILD`, which a rename cannot change"

[answers.system_macro.prepare_rename]
error = "`EOF` is defined in a system header"
