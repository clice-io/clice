[answers.shared_header.rename]
notice = '''
Spellings of `LIMIT` left alone:
  ${WS}/c.cpp:1: #ifdef LIMIT (a directive names it where no #define of it reaches, or in a block the preprocessor skips)
'''

[answers.shared_header.rename.edits]
"a.cpp" = '''

 #define DEBUG_TYPE "a"
-int a = LIMIT + LOG() + CHECK;
-#ifdef LIMIT
-int b = LIMIT + 1;
+int a = BOUND + LOG() + CHECK;
+#ifdef BOUND
+int b = BOUND + 1;
 #endif
 #undef DEBUG_TYPE
'''
"b.cpp" = '''

 #define DEBUG_TYPE "b"
-#if defined(LIMIT) && LIMIT > 5
-int c = LIMIT + LOG() + CHECK;
+#if defined(BOUND) && BOUND > 5
+int c = BOUND + LOG() + CHECK;
 #endif
-#undef LIMIT
+#undef BOUND
'''
