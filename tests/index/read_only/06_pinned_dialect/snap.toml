[test.contexts]
contexts = [
    { label = "config #0", description = "${WS}", host = "dual.c" },
    { label = "-DDIALECT_C", description = "${WS}", host = "dual.c" },
]

[test.first]
semantic_tokens = [
    { at = "⟦class⟧ Widget { public: int value; };", type = "keyword" },
    { at = "class ⟦Widget⟧ { public: int value; };", type = "class", modifiers = ["definition", "global"] },
    { at = "class Widget { ⟦public⟧: int value; };", type = "keyword" },
    { at = "class Widget { public: ⟦int⟧ value; };", type = "primitive" },
    { at = "class Widget { public: int ⟦value⟧; };", type = "field", modifiers = ["definition", "member"] },
]

[test.switched]
semantic_tokens = [
    { at = "class ⟦Widget⟧ { public: int value; };", type = "class", modifiers = ["definition", "global"] },
    { at = "class Widget { public: ⟦int⟧ value; };", type = "primitive" },
    { at = "class Widget { public: int ⟦value⟧; };", type = "field", modifiers = ["definition", "member"] },
]
