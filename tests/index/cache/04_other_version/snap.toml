[test."$ clice index"]
stdout = '''
Indexed 1 translation unit in #s: 2 file shards (# KB), 2 symbols.
Session log: ${WS}/.clice/logs/${SESSION}
'''
exit = 0

[test."$ clice query symbol-search add"]
stdout = '''
{
  "error": "the index could not be opened (the log above says why); run `clice index` or pass --fresh",
  "stale": []
}
'''
stderr = '''
warning: Index database at ${WS}/.clice/cache/v15/index/default/index.mdb was written by another version of clice; run `clice index` to rebuild it
error: The index database at ${WS}/.clice/cache/v15/index/default cannot be opened; the log above says why
'''
exit = 1

