[test.before]
diagnostics = [
    {
        at = '⟦#include "b.h"⟧',
        severity = "warning",
        message = 'Nothing this file uses comes from "b.h" or the headers it includes',
        source = "clice",
        code = "unused-include",
        tags = ["Unnecessary"],
    },
    {
        at = '⟦#include "c.h"⟧',
        severity = "warning",
        message = 'Nothing this file uses comes from "c.h" or the headers it includes',
        source = "clice",
        code = "unused-include",
        tags = ["Unnecessary"],
    },
]

[[test.fixes.code_actions]]
kind = "quickfix"
title = "remove '#include \"b.h\"'"

[test.fixes.code_actions.edits]
"main.cpp" = '''
 #include "a.h"
-#include "b.h"
 #include "c.h"
'''

[[test.fixes.code_actions]]
kind = "quickfix"
title = "remove all unused includes"

[test.fixes.code_actions.edits]
"main.cpp" = '''
 #include "a.h"
-#include "b.h"
-#include "c.h"

 int use() {
'''

[test.after]
diagnostics = []
