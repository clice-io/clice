[test."main.cpp"]
diagnostics = [
    {
        at = 'is not needed. */ ⟦#include "unused.h"⟧',
        severity = "warning",
        message = 'Nothing this file uses comes from "unused.h" or the headers it includes',
        source = "clice",
        code = "unused-include",
        tags = ["Unnecessary"],
    },
]

[[test.fixes.code_actions]]
kind = "quickfix"
title = "remove '#include \"unused.h\"'"

[test.fixes.code_actions.edits]
"main.cpp" = '''
 /* The header below
-   is not needed. */ #include "unused.h"
+   is not needed. */
 #include "used.h"
'''
