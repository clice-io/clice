[test."a.cpp"]
diagnostics = [
    {
        at = "⟦⟧#define M 1",
        severity = "warning",
        message = "unknown warning option '-Wlogical-op'; did you mean '-Wlong-long'?",
        source = "clang",
        code = "-Wunknown-warning-option",
        related = [],
    },
    {
        at = "#define ⟦M⟧ 2",
        severity = "warning",
        message = "'M' macro redefined",
        source = "clang",
        code = "-Wmacro-redefined",
        related = [
            { at = "#define ⟦M⟧ 1", message = "previous definition is here" },
        ],
    },
    {
        at = '#pragma ⟦message⟧("built")',
        severity = "warning",
        message = "built",
        source = "clang",
        code = "-W#pragma-messages",
        related = [],
    },
    {
        at = '#⟦warning⟧ "pending"',
        severity = "warning",
        message = '"pending"',
        source = "clang",
        code = "-W#warnings",
        related = [],
    },
]

