[test.before]
diagnostics = [
    {
        at = "Person() : ⟦name()⟧ {}",
        severity = "warning",
        message = "initializer for member 'name' is redundant",
        source = "clang-tidy",
        code = "readability-redundant-member-init",
    },
]

[[test.fixes.code_actions]]
kind = "quickfix"
title = "remove 'name()'"

[test.fixes.code_actions.edits]
"main.cpp" = '''

 struct Person {
-    Person() : name() {}
+    Person()   {}
     Name name;
 };
'''

[test.after]
diagnostics = []

[[test.replacement.code_actions]]
kind = "quickfix"
title = "change '0' to 'nullptr'"

[test.replacement.code_actions.edits]
"macro.cpp" = '''
 #define PICK(a, b) b
-int* p = PICK(, 0);
+int* p = PICK(, nullptr);
'''
