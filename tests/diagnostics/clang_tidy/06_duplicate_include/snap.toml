[test."main.cpp"]
diagnostics = [
    { at = '⟦#include "a.h"⟧ @6', severity = "warning", message = "duplicate include", source = "clang-tidy", code = "readability-duplicate-include" },
]

[[test.fixes.code_actions]]
kind = "quickfix"
title = "remove '#include \"a.h\"'"

[test.fixes.code_actions.edits]
"main.cpp" = '''
 #include "a.h"
 int x;
-#include "a.h"
'''
