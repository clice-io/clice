[test."main.cpp"]
diagnostics = [
    {
        at = "std::unique_ptr<int> make() { return ⟦std::unique_ptr⟧<int>(new int(1)); }",
        severity = "warning",
        message = "use mem::make_unique instead",
        source = "clang-tidy",
        code = "modernize-make-unique",
    },
]

[[test.fixes.code_actions]]
kind = "quickfix"
title = "use mem::make_unique instead"

[test.fixes.code_actions.edits]
"main.cpp" = '''
 #include "mem.h"
-std::unique_ptr<int> make() { return std::unique_ptr<int>(new int(1)); }
+std::unique_ptr<int> make() { return mem::make_unique<int>(1); }
'''
