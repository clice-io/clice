[test."main.cpp"]
diagnostics = [
    {
        at = "double ratio(int a, int b) { return ⟦a⟧ / b; }",
        severity = "warning",
        message = "result of integer division used in a floating point context; possible loss of precision",
        source = "clang-tidy",
        code = "bugprone-integer-division",
        link = "https://clang.llvm.org/extra/clang-tidy/checks/bugprone/integer-division.html",
        tags = [],
    },
]

[test.guidance]
value = [
    "The clang-tidy configuration of ${WS}/main.cpp enables checks too slow for an editor, or not measured for one, which do not run on open files: misc-const-correctness. Set `clang_tidy_slow_checks = true` under `[diagnostics]` to run them, or `false` to leave them out without this message; `clice lint` runs them.",
]
