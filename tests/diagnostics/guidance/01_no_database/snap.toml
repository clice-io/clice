[test."without a database"]
diagnostics = [
    {
        at = '⟦⟧#include "config.h"',
        severity = "warning",
        message = "compile_commands.json has no entry for this file, so clice compiles it with a default command, which may miss its include paths. Add the file to the build and regenerate compile_commands.json, or give it a command with a `default_command` rule in clice.toml.",
        source = "clice",
        code = "inferred-compile-command",
        link = "https://docs.clice.io/clice/guide/quick-start#project-setup",
    },
    {
        at = '#include ⟦"config.h"⟧',
        severity = "error",
        message = "'config.h' file not found",
        source = "clang",
        code = "err_pp_file_not_found",
    },
]

[test.guidance]
value = [
    "No compile_commands.json found in ${WS} or its direct subdirectories. Compile commands will be guessed; see https://docs.clice.io/clice/guide/quick-start#project-setup for setup.",
]

[test."with a database"]
diagnostics = [
    {
        at = '#include ⟦"config.h"⟧',
        severity = "error",
        message = "'config.h' file not found",
        source = "clang",
        code = "err_pp_file_not_found",
    },
]
