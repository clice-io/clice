[test."$ clice refactor"]
stdout = '''
Rewrite the project's sources through the persisted index

usage: clice refactor <refactoring> [<args>]

Options:
  -h|--help                       display this help and exit

Subcommands:
  rename  Rename symbols across the project
'''
exit = 0

[test."$ clice refactor extract"]
stdout = '''
{
  "error": "unknown subcommand 'extract'",
  "stale": []
}
'''
exit = 2

[test."$ clice refactor rename compute"]
stdout = '''
{
  "error": "expected 2 input arguments, got 1",
  "stale": []
}
'''
exit = 2

[test."$ clice refactor rename"]
stdout = '''
{
  "error": "rename takes <LOCATOR> <NEW-NAME>, or --spec",
  "stale": []
}
'''
exit = 2

[test."$ clice refactor rename compute \"\""]
stdout = '''
{
  "error": "the index could not be opened (the log above says why); run `clice index` or pass --fresh",
  "stale": []
}
'''
stderr = "error: No index cache at ${WS}/.clice; run `clice index` first"
exit = 1
