[test."$ clice refactor"]
stdout = '''
Rewrite the workspace's sources through the persisted index

Subcommands:
  rename  Rename symbols across the workspace
'''
exit = 0

[test."$ clice refactor extract"]
stdout = '''
{
  "error": "at argv[0]:\n  extract\n  ^~~~~~~\n  unknown subcommand 'extract'",
  "stale": []
}
'''
exit = 2

