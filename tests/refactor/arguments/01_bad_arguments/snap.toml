{
  "error": "missing <NEW-NAME>",
  "stale": []
}
'''
exit = 2

[test."$ clice refactor rename"]
stdout = '''
{
  "error": "missing <LOCATOR>",
  "stale": []
}
'''
exit = 2

[test."$ clice refactor rename compute \"\""]
stdout = '''
{
  "error": "missing <NEW-NAME>",
  "stale": []
}
'''
exit = 2
