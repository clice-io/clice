"lib.h" = '''
 #pragma once

-int compute(int x);
+int evaluate(int x);

-struct Widget {
-    Widget();
+struct Gadget {
+    Gadget();
     int value;
 };
'''
"main.cpp" = '''
 #include "lib.h"

-int compute(int x) { return x; }
+int evaluate(int x) { return x; }

-Widget::Widget() : value(0) {}
+Gadget::Gadget() : value(0) {}

-int use() { return compute(2) + CALL; }
+int apply() { return evaluate(2) + CALL; }

 int main() {
-    Widget w;
-    return use() + w.value;
+    Gadget w;
+    return apply() + w.value;
 }
'''
"other.cpp" = '''
