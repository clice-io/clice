"main.cpp" = '''
 struct Point {
-    int x;
+    int column;
     int y;
 };

-int norm(Point p) { return p.x * p.x + p.y * p.y; }
+int norm(Point p) { return p.column * p.column + p.y * p.y; }

 int main() {
-    Point p = {.x = 1, .y = 2};
-    Point q{.x = 3};
-    return norm(p) + q.x;
+    Point p = {.column = 1, .y = 2};
+    Point q{.column = 3};
+    return norm(p) + q.column;
 }
