[capabilities.capabilities]
value = '''
{
    "textDocumentSync": {
        "openClose": true,
        "change": 2,
        "save": true
    },
    "completionProvider": {
        "triggerCharacters": [
            ".",
            "<",
            ">",
            ":",
            "\"",
            "/",
            " "
        ]
    },
    "hoverProvider": true,
    "signatureHelpProvider": {
        "triggerCharacters": [
            "(",
            ")",
            "{",
            "}",
            "<",
            ">",
            ","
        ]
    },
    "declarationProvider": {},
    "definitionProvider": {},
    "typeDefinitionProvider": {},
    "implementationProvider": {},
    "referencesProvider": {},
    "documentHighlightProvider": true,
    "documentSymbolProvider": true,
    "codeActionProvider": {
        "codeActionKinds": [
            "quickfix",
            "refactor.rewrite.define.inline",
            "refactor.rewrite.define.outOfLine",
            "refactor.rewrite.define.missing",
            "refactor.rewrite.implementPureVirtuals",
            "refactor.rewrite.generateMemberwiseConstructor",
            "refactor.rewrite.populateSwitch",
            "refactor.rewrite.expandDeducedType",
            "refactor.rewrite.reorderDefinitions",
            "refactor.inline.macro",
            "source.clice.context",
            "source.clice.configuration"
        ]
    },
    "documentLinkProvider": {},
    "workspaceSymbolProvider": true,
    "documentFormattingProvider": true,
    "documentRangeFormattingProvider": true,
    "renameProvider": {
        "prepareProvider": true
    },
    "foldingRangeProvider": true,
    "selectionRangeProvider": true,
    "executeCommandProvider": {
        "commands": [
            "clice.lsp.switchContext",
            "clice.lsp.resetContext",
            "clice.lsp.switchConfiguration"
        ]
    },
    "callHierarchyProvider": true,
    "semanticTokensProvider": {
        "legend": {
            "tokenTypes": [
                "comment",
                "string",
                "character",
                "number",
                "escape",
                "formatSpecifier",
                "keyword",
                "primitive",
                "operator",
                "bracket",
                "directive",
                "header",
                "namespace",
                "module",
                "class",
                "struct",
                "union",
                "enum",
                "typeAlias",
                "typeParameter",
                "templateParameter",
                "concept",
                "function",
                "method",
                "variable",
                "parameter",
                "field",
                "enumMember",
                "label",
                "macro",
                "macroParameter",
                "attribute",
                "unknown",
                "conflict",
                "plain"
            ],
            "tokenModifiers": [
                "declaration",
                "definition",
                "readonly",
                "static",
                "deprecated",
                "abstract",
                "defaultLibrary",
                "documentation",
                "modification",
                "local",
                "member",
                "internal",
                "global",
                "template",
                "dependent",
                "virtual",
                "constexpr",
                "constructor",
                "destructor",
                "callable",
                "controlFlow",
                "userDefined",
                "declarator",
                "literal",
                "affix",
                "empty",
                "inactive"
            ]
        },
        "range": true,
        "full": {
            "delta": true
        }
    },
    "typeHierarchyProvider": true,
    "inlayHintProvider": true,
    "workspace": {
        "workspaceFolders": {
            "supported": true,
            "changeNotifications": true
        }
    }
}
'''

[capabilities.server]
name = "clice"

[capabilities."$ clice --version"]
stdout = "clice version ${VERSION}"
exit = 0

["a second initialize".refused]
code = -32000
message = "Server already initialized"
