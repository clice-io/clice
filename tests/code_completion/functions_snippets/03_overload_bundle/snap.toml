[default.pos.completion]
items = [
    { label = "foooo(…) +2 overloads", kind = "Function" },
]

[configured.pos.completion]
items = [
    { label = "foooo(int x)", kind = "Function", detail = "int" },
    { label = "foooo(int x, int y)", kind = "Function", detail = "int" },
    { label = "foooo(double d)", kind = "Function", detail = "double" },
]
