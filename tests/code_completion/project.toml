# Freestanding, -undef and -nostdinc keep host stdlib symbols, platform
# macros and system search directories out of the candidate set, and the
# pinned target fixes the compiler-builtin macro set (-undef does not touch
# builtins — MS-compatible targets add __pragma), so completion replies stay
# identical across hosts.
flags = ["--target=x86_64-unknown-linux-gnu", "-std=c++20", "-ffreestanding", "-undef", "-nostdinc"]
