[characters."main.cpp"]
folding_ranges = [
    { kind = "comment", at = "// Recovering from the unknown `missing_list`, clang closes the class at the⟦ … // cross by lines, the outer one stays.⟧ (3 lines)" },
    { kind = "namespace", at = "⟦{ … }⟧ (10 lines) @5", collapsed = "{...}" },
    { at = "⟦{ … }⟧ (13 lines)", collapsed = "{...}" },
    { kind = "class", at = "⟦{ … { load(values.begin(), flags); }⟧ (4 lines)", collapsed = "{...}" },
    { at = "⟦{ … }⟧ (7 lines)", collapsed = "{...}" },
    { kind = "accessSpecifier", at = "public:⟦ … { load(values.begin(), flags); ⟧ (3 lines)" },
]

["whole lines"."main.cpp"]
folding_ranges = [
    { kind = "comment", at = "⟦// Recovering from the unknown `missing_list`, clang closes the class at the … // cross by lines, the outer one stays.⟧ (3 lines)" },
    { kind = "namespace", at = "⟦namespace outer … int size() const;⟧ (10 lines)" },
    { kind = "class", at = "⟦class Holder … Holder(missing_list<T> values, int flags = 0)⟧ (4 lines)" },
    { kind = "accessSpecifier", at = "⟦public: … Holder(missing_list<T> values, int flags = 0)⟧ (2 lines)" },
]
