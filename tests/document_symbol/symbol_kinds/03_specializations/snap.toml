[answers.outline]
wrong = "the explicit instantiation zero<long> is named zero, where class and variable ones keep their arguments"
document_symbols = [
    {
        name = "spec",
        kind = "Namespace",
        at = "namespace ⟦spec⟧ {",
        children = [
            {
                name = "Box",
                kind = "Struct",
                at = "struct ⟦Box⟧ {",
                detail = "template struct",
                children = [
                    { name = "value", kind = "Field", at = "T ⟦value⟧;", detail = "T" },
                ],
            },
            { name = "Box<void>", kind = "Struct", at = "struct ⟦Box⟧<void> {};", detail = "struct" },
            {
                name = "Box<T *>",
                kind = "Struct",
                at = "struct ⟦Box⟧<T*> {",
                detail = "template struct",
                children = [
                    { name = "pointee", kind = "Field", at = "T* ⟦pointee⟧;", detail = "T *" },
                ],
            },
            { name = "zero", kind = "Function", at = "T ⟦zero⟧() {", detail = "template T ()" },
            { name = "zero<int>", kind = "Function", at = "int ⟦zero⟧<int>();", detail = "int ()" },
            { name = "pi", kind = "Variable", at = "constexpr T ⟦pi⟧ = T(3);", detail = "template const T" },
            { name = "pi<int>", kind = "Variable", at = "constexpr int ⟦pi⟧<int> = 3;", detail = "const int" },
            { name = "pi<T *>", kind = "Variable", at = "constexpr T* ⟦pi⟧<T*> = nullptr;", detail = "template T *const" },
            {
                name = "Deduced",
                kind = "Struct",
                at = "struct ⟦Deduced⟧ {",
                detail = "template struct",
                children = [
                    { name = "Deduced", kind = "Method", at = "⟦Deduced⟧(T raw);", detail = "(T)" },
                ],
            },
            { name = "<deduction guide for Deduced>", kind = "Function", at = "⟦Deduced⟧(T*) -> Deduced<T>;", detail = "template auto (T *) -> Deduced<T>" },
            { name = "instantiated", kind = "Variable", at = "Box<int> ⟦instantiated⟧;", detail = "Box<int>" },
            { name = "Box<char>", kind = "Struct", at = "template struct ⟦Box⟧<char>;", detail = "struct" },
            { name = "zero", kind = "Function", at = "template long ⟦zero⟧<long>();", detail = "long ()" },
        ],
    },
]

[answers.extents]
wrong = "a primary template's extent starts after its template header, where a specialization's and an out-of-line member's include it"
document_symbols = [
    {
        name = "spec",
        kind = "Namespace",
        at = "namespace ⟦spec⟧ {",
        range = "⟦namespace spec { … }⟧ (46 lines)",
        children = [
            {
                name = "Box",
                kind = "Struct",
                at = "struct ⟦Box⟧ {",
                range = "⟦struct Box { … }⟧ (3 lines)",
                children = [
                    { name = "value", kind = "Field", at = "T ⟦value⟧;", range = "⟦T value⟧;" },
                ],
            },
            { name = "Box<void>", kind = "Struct", at = "struct ⟦Box⟧<void> {};", range = "⟦template <> … struct Box<void> {}⟧ (2 lines)" },
            {
                name = "Box<T *>",
                kind = "Struct",
                at = "struct ⟦Box⟧<T*> {",
                range = "⟦template <typename T> … }⟧ (4 lines) @-1",
                children = [
                    { name = "pointee", kind = "Field", at = "T* ⟦pointee⟧;", range = "⟦T* pointee⟧;" },
                ],
            },
            { name = "zero", kind = "Function", at = "T ⟦zero⟧() {", range = "⟦T zero() { … }⟧ (3 lines)" },
            { name = "zero<int>", kind = "Function", at = "int ⟦zero⟧<int>();", range = "⟦template <> … int zero<int>()⟧ (2 lines)" },
            { name = "pi", kind = "Variable", at = "constexpr T ⟦pi⟧ = T(3);", range = "⟦constexpr T pi = T(3)⟧;" },
            { name = "pi<int>", kind = "Variable", at = "constexpr int ⟦pi⟧<int> = 3;", range = "⟦template <> … constexpr int pi<int> = 3⟧ (2 lines)" },
            { name = "pi<T *>", kind = "Variable", at = "constexpr T* ⟦pi⟧<T*> = nullptr;", range = "⟦template <typename T> … constexpr T* pi<T*> = nullptr⟧ (2 lines)" },
            {
                name = "Deduced",
                kind = "Struct",
                at = "struct ⟦Deduced⟧ {",
                range = "⟦struct Deduced { … }⟧ (3 lines)",
                children = [
                    { name = "Deduced", kind = "Method", at = "⟦Deduced⟧(T raw);", range = "⟦Deduced(T raw)⟧;" },
                ],
            },
            { name = "<deduction guide for Deduced>", kind = "Function", at = "⟦Deduced⟧(T*) -> Deduced<T>;", range = "⟦Deduced(T*) -> Deduced<T>⟧;" },
            { name = "instantiated", kind = "Variable", at = "Box<int> ⟦instantiated⟧;", range = "⟦Box<int> instantiated⟧;" },
            { name = "Box<char>", kind = "Struct", at = "template struct ⟦Box⟧<char>;", range = "⟦template struct Box<char>⟧;" },
            { name = "zero", kind = "Function", at = "template long ⟦zero⟧<long>();", range = "⟦template long zero<long>()⟧;" },
        ],
    },
]
