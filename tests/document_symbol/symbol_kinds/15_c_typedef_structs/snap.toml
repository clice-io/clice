[answers.outline]
wrong = "the struct that Point names lists as an anonymous struct beside the alias, instead of one Point holding x and y"
document_symbols = [
    { name = "Point", kind = "Class", at = "} ⟦Point⟧;", detail = "type alias" },
    {
        name = "(anonymous struct)",
        kind = "Struct",
        at = "typedef ⟦struct⟧ {",
        detail = "struct",
        children = [
            { name = "x", kind = "Field", at = "int ⟦x⟧;", detail = "int" },
            { name = "y", kind = "Field", at = "int ⟦y⟧;", detail = "int" },
        ],
    },
    { name = "Node", kind = "Class", at = "} ⟦Node⟧;", detail = "type alias" },
    {
        name = "Node",
        kind = "Struct",
        at = "typedef struct ⟦Node⟧ {",
        detail = "struct",
        children = [
            { name = "next", kind = "Field", at = "struct Node* ⟦next⟧;", detail = "struct Node *" },
        ],
    },
]

[answers.extents]
wrong = "the struct that Point names lists as an anonymous struct beside the alias, instead of one Point holding x and y"
document_symbols = [
    { name = "Point", kind = "Class", at = "} ⟦Point⟧;", range = "⟦typedef struct { … } Point⟧ (4 lines)" },
    {
        name = "(anonymous struct)",
        kind = "Struct",
        at = "typedef ⟦struct⟧ {",
        range = "typedef ⟦struct { … }⟧ (4 lines)",
        children = [
            { name = "x", kind = "Field", at = "int ⟦x⟧;", range = "⟦int x⟧;" },
            { name = "y", kind = "Field", at = "int ⟦y⟧;", range = "⟦int y⟧;" },
        ],
    },
    { name = "Node", kind = "Class", at = "} ⟦Node⟧;", range = "⟦typedef struct Node { … } Node⟧ (3 lines)" },
    {
        name = "Node",
        kind = "Struct",
        at = "typedef struct ⟦Node⟧ {",
        range = "typedef ⟦struct Node { … }⟧ (3 lines)",
        children = [
            { name = "next", kind = "Field", at = "struct Node* ⟦next⟧;", range = "⟦struct Node* next⟧;" },
        ],
    },
]
