[open.preprocessed]
diagnostics = []

[open.plain]
diagnostics = []

[inspect."$ clice inspect semantic-tokens entry.S"]
stderr = "error: entry.S: not a C-family source file"
exit = 1

[index."$ clice index --jobs 1"]
stdout = '''
Indexed 1 translation unit in #s: 1 file shard (# B), 1 symbol.
Session log: ${WS}/.clice/logs/${SESSION}
'''
exit = 0

[lint."$ clice lint"]
stdout = "Linted 1 translation unit in #s: 0 findings."
exit = 0
