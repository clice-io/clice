[open.diagnostics]
wrong = "an assembler source is parsed as C after preprocessing: its comment and directive lines, which the build accepts, show errors"
diagnostics = [
    { at = "⟦#⟧ Copyright 2003 Pavel Machek <pavel@suse.cz", severity = "error", message = "expected identifier or '('", source = "clang", code = "err_expected_either" },
    { at = "⟦.⟧text", severity = "error", message = "expected identifier or '('", source = "clang", code = "err_expected_either" },
]

[open.size.hover]
markdown = '''
**macro** `SIZE`

```cpp
#define SIZE 8
```
Expands to:
```cpp
8
```
'''
range = ".quad ⟦SIZE⟧"

[index."$ clice index --workers 1"]
stdout = '''
Indexed 1 translation unit in #s: 1 file shard (# B), 1 symbol.
Session log: ${WS}/.clice/logs/${SESSION}
'''
exit = 0
