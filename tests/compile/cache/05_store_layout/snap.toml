["store layout".store]
value = [
    "store.lock",
    "v#/",
    "v#/index/",
    "v#/index/default/",
    "v#/index/default/index.mdb",
    "v#/index/default/index.mdb-lock",
    "v#/index/default/index.mdb-open",
    "v#/tmp/",
]

["store layout".precompiled]
value = [
    "<key>/",
    "<key>/store.lock",
    "<key>/v#/",
    "<key>/v#/manifest.json",
    "<key>/v#/pch/",
    "<key>/v#/pch/<key>-<nonce>.pch",
    "<key>/v#/pch/<key>-<nonce>.pch.idx",
    "<key>/v#/pcm/",
    "<key>/v#/tmp/",
]
