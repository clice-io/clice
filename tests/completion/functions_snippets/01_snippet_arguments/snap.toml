[default.free_function.completion]
items = [
    { label = "for", kind = "Keyword", insert = "for" },
    { label = "Foo", kind = "Class", insert = "Foo" },
    { label = "foooo(int x, float y)", kind = "Function", detail = "int", insert = "foooo(${1:int x}, ${2:float y})", snippet = true },
]

[default.no_arguments.completion]
items = [
    { label = "noexcept", kind = "Keyword", insert = "noexcept" },
    { label = "nothing_to_fill()", kind = "Function", detail = "void", insert = "nothing_to_fill()" },
]

[default.method.completion]
items = [
    { label = "bazzzz(int a, int b)", kind = "Method", detail = "int", insert = "bazzzz(${1:int a}, ${2:int b})", snippet = true },
]

