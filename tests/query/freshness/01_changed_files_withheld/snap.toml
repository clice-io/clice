[test."$ clice index"]
stdout = '''
Indexed 1 translation unit in #s: 2 file shards (# KB), 6 symbols.
Session log: ${WS}/.clice/logs/${SESSION}
'''
exit = 0

[test."$ clice query definition compute"]
stdout = '''
{
  "error": "symbol not found; 1 file left out, changed since the last index: rerun with --fresh",
  "stale": [
    "${WS}/main.cpp"
  ]
}
'''
exit = 1

[test."$ clice query definition new.cpp:1:5"]
stdout = '''
{
  "error": "symbol not found; 1 file not in the index: run `clice index`",
  "stale": [
    "${WS}/new.cpp"
  ]
}
'''
exit = 1

[test."$ clice query document-symbols main.cpp"]
stdout = '''
{
  "result": {
    "symbols": []
  },
  "stale": [
    "${WS}/main.cpp"
  ]
}
'''
exit = 0

