[test."$ clice index"]
stdout = '''
Indexed 4 translation units in #s: 6 file shards (# KB), 6 symbols.
Session log: ${WS}/.clice/logs/${SESSION}
'''
exit = 0

[test."$ clice query impact-analysis base.h"]
stdout = '''
{
  "result": {
    "directDependents": [
      "${WS}/shapes.cppm",
      "${WS}/mid.h"
    ],
    "transitiveDependents": [
      "${WS}/mid.cpp",
      "${WS}/main.cpp",
      "${WS}/use.cpp"
    ],
    "affectedModules": [
      "shapes"
    ]
  },
  "stale": []
}
'''
exit = 0

[test."$ clice query impact-analysis shapes.cppm"]
stdout = '''
{
  "result": {
    "directDependents": [],
    "transitiveDependents": [
      "${WS}/use.cpp"
    ],
    "affectedModules": [
      "shapes"
    ]
  },
