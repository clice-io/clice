    "symbol": "#2ac638334627aaf7",
    "documentation": null,
    "definition": {
      "file": "${WS}/lib.h",
      "startLine": 1,
      "endLine": 1,
      "text": "int checksum(const int* data, int size)"
    }
  },
  "stale": []
}
'''
exit = 0
