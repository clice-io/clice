[test."$ clice index"]
stdout = '''
Indexed 1 translation unit in #s: 2 file shards (# KB), 3 symbols.
Session log: ${WS}/.clice/logs/${SESSION}
'''
stderr = '''
error: Toolchain query failed: Driver ${WS}/missing-cc not found or not executable
warning: Toolchain resolve failed for ${WS}/main.cpp: Driver ${WS}/missing-cc not found or not executable
'''
exit = 0

[test."$ clice query --method compileCommand --path list.def"]
stdout = '''
{
  "error": "${WS}/list.def compiles only under a synthesized header context, which needs an editor session",
  "stale": []
}
'''
stderr = '''
error: Toolchain query failed: Driver ${WS}/missing-cc not found or not executable
warning: Toolchain resolve failed for ${WS}/list.def: Driver ${WS}/missing-cc not found or not executable
'''
exit = 1

[test."$ clice query --method compileCommand --path lone.def"]
stdout = '''
{
  "result": {
    "file": "${WS}/lone.def",
    "directory": "${WS}",
    "arguments": [
      "${WS}/missing-cc",
      "-resource-dir",
      "${RESOURCE}",
      "-x",
      "c++",
      "${WS}/lone.def"
    ],
    "source": "inferred",
    "toolchainError": "Driver ${WS}/missing-cc not found or not executable"
  },
  "stale": []
}
'''
stderr = '''
error: Toolchain query failed: Driver ${WS}/missing-cc not found or not executable
warning: Toolchain resolve failed for ${WS}/lone.def: Driver ${WS}/missing-cc not found or not executable
'''
exit = 0
