[test."$ clice query symbol-search add"]
stdout = '''
{
  "error": "the index could not be opened (the log above says why); run `clice index` or pass --fresh",
  "stale": []
}
'''
stderr = "error: No index cache at ${WS}/.clice; run `clice index` first"
exit = 1

[test."$ clice index"]
stdout = '''
Indexed 1 translation unit in #s: 2 file shards (# KB), 6 symbols.
Session log: ${WS}/.clice/logs/${SESSION}
'''
exit = 0

[test."$ clice query call-graph add --direction sideways"]
stdout = '''
{
  "error": "invalid direction 'sideways': expected callers, callees or both",
  "stale": []
}
'''
exit = 1

[test."$ clice query definition nope"]
stdout = '''
{
  "error": "symbol not found",
  "stale": []
}
'''
exit = 1

[test."$ clice query document-symbols gone.cpp"]
stdout = '''
{
  "error": "no such file: ${WS}/gone.cpp",
  "stale": []
}
'''
exit = 1

[test."$ clice query file-deps gone.cpp"]
stdout = '''
{
  "error": "no such file: ${WS}/gone.cpp",
  "stale": []
}
'''
exit = 1

[test."$ clice query definition main.cpp:0"]
stdout = '''
{
  "error": "lines and columns count from 1",
  "stale": []
}
'''
exit = 1

[test."$ clice query definition gone.cpp:2"]
stdout = '''
{
  "error": "no such file: ${WS}/gone.cpp",
  "stale": []
}
'''
exit = 1

[test."$ clice query definition add main.cpp"]
stdout = '''
{
  "error": "at argv[1]:\n  add main.cpp\n      ^~~~~~~~\n  unexpected input argument main.cpp: expected 1 input argument",
  "stale": []
}
'''
exit = 2

[test."$ clice query symbol-search add main.cpp"]
stdout = '''
{
  "error": "at argv[1]:\n  add main.cpp\n      ^~~~~~~~\n  unexpected input argument main.cpp: expected 1 input argument",
  "stale": []
}
'''
exit = 2

[test."$ clice query definition"]
stdout = '''
{
  "error": "expected 1 input argument, got 0",
  "stale": []
}
'''
exit = 2

[test."$ clice query bogus"]
stdout = '''
{
  "error": "at argv[0]:\n  bogus\n  ^~~~~\n  unknown subcommand 'bogus'",
  "stale": []
}
'''
exit = 2

[test."$ clice query definition \"main.cpp:4:5 kind:variable\""]
stdout = '''
{
  "error": "symbol not found",
  "stale": []
}
'''
exit = 1

[test."$ clice query symbol-search \"add kind:Fnction\""]
stdout = '''
{
  "error": "unknown symbol kind 'Fnction'",
  "stale": []
}
'''
exit = 1
