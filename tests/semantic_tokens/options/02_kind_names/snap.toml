[default."main.cpp"]
semantic_tokens = [
    { at = "⟦struct⟧ Widget {", type = "keyword" },
    { at = "struct ⟦Widget⟧ {", type = "struct", modifiers = ["definition", "global"] },
    { at = "⟦int⟧ width;", type = "primitive" },
    { at = "int ⟦width⟧;", type = "field", modifiers = ["definition", "member"] },
    { at = "⟦using⟧ Size = int;", type = "keyword" },
    { at = "using ⟦Size⟧ = int;", type = "typeAlias", modifiers = ["definition", "member"] },
    { at = "using Size ⟦=⟧ int;", type = "operator" },
    { at = "using Size = ⟦int⟧;", type = "primitive" },
    { at = "⟦template⟧ <typename T, int N>", type = "keyword" },
    { at = "template ⟦<⟧typename T, int N>", type = "bracket" },
    { at = "template <⟦typename⟧ T, int N>", type = "keyword" },
    {
        at = "template <typename ⟦T⟧, int N>",
        type = "typeParameter",
        modifiers = ["definition", "local"],
    },
    { at = "template <typename T, ⟦int⟧ N>", type = "primitive" },
    {
        at = "template <typename T, int ⟦N⟧>",
        type = "templateParameter",
        modifiers = ["definition", "readonly", "local", "constexpr"],
    },
    { at = "template <typename T, int N⟦>⟧", type = "bracket" },
    { at = "⟦T⟧ scaled(T value) {", type = "typeParameter", modifiers = ["local"] },
    {
        at = "T ⟦scaled⟧(T value) {",
        type = "function",
        modifiers = ["definition", "global", "template"],
    },
    { at = "T scaled(⟦T⟧ value) {", type = "typeParameter", modifiers = ["local"] },
    { at = "T scaled(T ⟦value⟧) {", type = "parameter", modifiers = ["definition", "local"] },
    { at = "⟦return⟧ value * N;", type = "keyword", modifiers = ["controlFlow"] },
    { at = "return ⟦value⟧ * N;", type = "parameter", modifiers = ["local"] },
    { at = "return value ⟦*⟧ N;", type = "operator" },
    {
        at = "return value * ⟦N⟧;",
        type = "templateParameter",
        modifiers = ["readonly", "local", "constexpr"],
    },
]

[renamed."main.cpp"]
semantic_tokens = [
    { at = "⟦struct⟧ Widget {", type = "keyword" },
    { at = "struct ⟦Widget⟧ {", type = "struct", modifiers = ["definition", "global"] },
    { at = "int ⟦width⟧;", type = "property", modifiers = ["definition", "member"] },
    { at = "⟦using⟧ Size = int;", type = "keyword" },
    { at = "using ⟦Size⟧ = int;", type = "type", modifiers = ["definition", "member"] },
    { at = "using Size ⟦=⟧ int;", type = "operator" },
    { at = "⟦template⟧ <typename T, int N>", type = "keyword" },
    { at = "template ⟦<⟧typename T, int N>", type = "bracket" },
    { at = "template <⟦typename⟧ T, int N>", type = "keyword" },
    { at = "template <typename ⟦T⟧, int N>", type = "type", modifiers = ["definition", "local"] },
    {
        at = "template <typename T, int ⟦N⟧>",
        type = "templateParameter",
        modifiers = ["definition", "readonly", "local", "constexpr"],
    },
    { at = "template <typename T, int N⟦>⟧", type = "bracket" },
    { at = "⟦T⟧ scaled(T value) {", type = "type", modifiers = ["local"] },
    {
        at = "T ⟦scaled⟧(T value) {",
        type = "function",
        modifiers = ["definition", "global", "template"],
    },
    { at = "T scaled(⟦T⟧ value) {", type = "type", modifiers = ["local"] },
    { at = "T scaled(T ⟦value⟧) {", type = "parameter", modifiers = ["definition", "local"] },
    { at = "⟦return⟧ value * N;", type = "keyword", modifiers = ["controlFlow"] },
    { at = "return ⟦value⟧ * N;", type = "parameter", modifiers = ["local"] },
    { at = "return value ⟦*⟧ N;", type = "operator" },
    {
        at = "return value * ⟦N⟧;",
        type = "templateParameter",
        modifiers = ["readonly", "local", "constexpr"],
    },
]
