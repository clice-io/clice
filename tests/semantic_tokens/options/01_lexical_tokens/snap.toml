[default."main.cpp"]
semantic_tokens = [
    { at = "⟦/// Counts the items.⟧", type = "comment", modifiers = ["documentation"] },
    { at = "⟦template⟧ <typename T>", type = "keyword" },
    { at = "template ⟦<⟧typename T>", type = "bracket" },
    { at = "template <⟦typename⟧ T>", type = "keyword" },
    { at = "template <typename ⟦T⟧>", type = "typeParameter", modifiers = ["definition", "local"] },
    { at = "template <typename T⟦>⟧", type = "bracket" },
    { at = "⟦int⟧ count(const T& items) {", type = "primitive" },
    {
        at = "int ⟦count⟧(const T& items) {",
        type = "function",
        modifiers = ["definition", "global", "template"],
    },
    { at = "int count(⟦const⟧ T& items) {", type = "keyword" },
    { at = "int count(const ⟦T⟧& items) {", type = "typeParameter", modifiers = ["local"] },
    { at = "int count(const T⟦&⟧ items) {", type = "operator", modifiers = ["declarator"] },
    {
        at = "int count(const T& ⟦items⟧) {",
        type = "parameter",
        modifiers = ["definition", "readonly", "local"],
    },
    { at = "⟦int⟧ total = 0;", type = "primitive" },
    { at = "int ⟦total⟧ = 0;", type = "variable", modifiers = ["definition", "local"] },
    { at = "int total ⟦=⟧ 0;", type = "operator" },
    { at = "int total = ⟦0⟧;", type = "number" },
    { at = "⟦for⟧(auto& item: items) {", type = "keyword", modifiers = ["controlFlow"] },
    { at = "for(⟦auto⟧& item: items) {", type = "keyword" },
    { at = "for(auto⟦&⟧ item: items) {", type = "operator", modifiers = ["declarator"] },
    { at = "for(auto& ⟦item⟧: items) {", type = "variable", modifiers = ["definition", "local"] },
    { at = "for(auto& item: ⟦items⟧) {", type = "parameter", modifiers = ["readonly", "local"] },
    { at = "⟦total⟧ += 1;", type = "variable", modifiers = ["modification", "local"] },
    { at = "total ⟦+=⟧ 1;", type = "operator" },
    { at = "total += ⟦1⟧;", type = "number" },
    { at = "⟦return⟧ total; // done", type = "keyword", modifiers = ["controlFlow"] },
    { at = "return ⟦total⟧; // done", type = "variable", modifiers = ["local"] },
    { at = "return total; ⟦// done⟧", type = "comment" },
    { at = "⟦#if⟧ 0", type = "directive" },
    { at = "#if ⟦0⟧", type = "number" },
    { at = "⟦int⟧ disabled = 1;", type = "primitive", modifiers = ["inactive"] },
    { at = "int ⟦disabled⟧ = 1;", type = "plain", modifiers = ["inactive"] },
    { at = "int disabled ⟦=⟧ 1;", type = "operator", modifiers = ["inactive"] },
    { at = "int disabled = ⟦1⟧;", type = "number", modifiers = ["inactive"] },
    { at = "int disabled = 1⟦;⟧", type = "plain", modifiers = ["inactive"] },
    { at = "⟦#endif⟧", type = "directive" },
]

["semantic only"."main.cpp"]
semantic_tokens = [
    { at = "template ⟦<⟧typename T>", type = "bracket" },
    { at = "template <typename ⟦T⟧>", type = "typeParameter", modifiers = ["definition", "local"] },
    { at = "template <typename T⟦>⟧", type = "bracket" },
    {
        at = "int ⟦count⟧(const T& items) {",
        type = "function",
        modifiers = ["definition", "global", "template"],
    },
    { at = "int count(const ⟦T⟧& items) {", type = "typeParameter", modifiers = ["local"] },
    { at = "int count(const T⟦&⟧ items) {", type = "operator", modifiers = ["declarator"] },
    {
        at = "int count(const T& ⟦items⟧) {",
        type = "parameter",
        modifiers = ["definition", "readonly", "local"],
    },
    { at = "int ⟦total⟧ = 0;", type = "variable", modifiers = ["definition", "local"] },
    { at = "for(auto⟦&⟧ item: items) {", type = "operator", modifiers = ["declarator"] },
    { at = "for(auto& ⟦item⟧: items) {", type = "variable", modifiers = ["definition", "local"] },
    { at = "for(auto& item: ⟦items⟧) {", type = "parameter", modifiers = ["readonly", "local"] },
    { at = "⟦total⟧ += 1;", type = "variable", modifiers = ["modification", "local"] },
    { at = "return ⟦total⟧; // done", type = "variable", modifiers = ["local"] },
    { at = "⟦int⟧ disabled = 1;", type = "plain", modifiers = ["inactive"] },
    { at = "int ⟦disabled⟧ = 1;", type = "plain", modifiers = ["inactive"] },
    { at = "int disabled ⟦=⟧ 1;", type = "plain", modifiers = ["inactive"] },
    { at = "int disabled = ⟦1;⟧", type = "plain", modifiers = ["inactive"] },
]
