    { at = "int hidden = ⟦0⟧;", type = "number" },
    { at = "⟦FORCE_INLINE⟧ int twice(int value) {", type = "macro" },
    { at = "FORCE_INLINE ⟦int⟧ twice(int value) {", type = "primitive" },
    { at = "FORCE_INLINE int ⟦twice⟧(int value) {", type = "function", modifiers = ["definition", "global"] },
    { at = "FORCE_INLINE int twice(⟦int⟧ value) {", type = "primitive" },
