    { at = "⟦struct⟧ Owner {", type = "keyword" },
    { at = "struct ⟦Owner⟧ {", type = "struct", modifiers = ["definition", "global"] },
    { at = "⟦compl⟧ Owner();", type = "method", modifiers = ["declaration", "member", "destructor"] },
    { at = "compl ⟦Owner⟧();", type = "method", modifiers = ["declaration", "member", "destructor"] },
]
