    { at = "#define FORCE_INLINE ⟦inline⟧", type = "keyword" },
    { at = "⟦struct⟧ Exposed {", type = "keyword" },
    { at = "struct ⟦Exposed⟧ {", type = "struct", modifiers = ["definition", "global"] },
    { at = "⟦private⟧:", type = "keyword" },
