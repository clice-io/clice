[answers."main.cpp"]
semantic_tokens = [
    { at = "⟦#define⟧ TRACE(message)", type = "directive" },
    { at = "#define ⟦TRACE⟧(message)", type = "macro", modifiers = ["definition", "callable", "empty"] },
    { at = "#define TRACE(⟦message⟧)", type = "macroParameter" },
    { at = "⟦#define⟧ UNUSED", type = "directive" },
    { at = "#define ⟦UNUSED⟧", type = "macro", modifiers = ["definition", "empty"] },
    { at = '⟦#define⟧ RETURN_IF(condition) \', type = "directive" },
    {
        at = '#define ⟦RETURN_IF⟧(condition) \',
        type = "macro",
        modifiers = ["definition", "callable", "controlFlow"],
    },
    { at = '#define RETURN_IF(⟦condition⟧) \', type = "macroParameter" },
    { at = '⟦if⟧(condition)            \', type = "keyword", modifiers = ["controlFlow"] },
    { at = 'if(⟦condition⟧)            \', type = "macroParameter" },
    { at = "⟦return⟧", type = "keyword", modifiers = ["controlFlow"] },
    { at = "⟦int⟧ compute();", type = "primitive" },
    { at = "int ⟦compute⟧();", type = "function", modifiers = ["declaration", "global"] },
    { at = "⟦int⟧ checked(int value) {", type = "primitive" },
    { at = "int ⟦checked⟧(int value) {", type = "function", modifiers = ["definition", "global"] },
    { at = "int checked(⟦int⟧ value) {", type = "primitive" },
    { at = "int checked(int ⟦value⟧) {", type = "parameter", modifiers = ["definition", "local"] },
    { at = "⟦TRACE⟧(compute());", type = "macro", modifiers = ["callable", "empty"] },
    { at = "TRACE(⟦compute()⟧);", type = "plain", modifiers = ["inactive"] },
    { at = "⟦UNUSED⟧ int spare = 0;", type = "macro", modifiers = ["empty"] },
    { at = "UNUSED ⟦int⟧ spare = 0;", type = "primitive" },
    { at = "UNUSED int ⟦spare⟧ = 0;", type = "variable", modifiers = ["definition", "local"] },
    { at = "UNUSED int spare ⟦=⟧ 0;", type = "operator" },
    { at = "UNUSED int spare = ⟦0⟧;", type = "number" },
    { at = "⟦RETURN_IF⟧(value < 0) 0;", type = "macro", modifiers = ["callable", "controlFlow"] },
    { at = "RETURN_IF(⟦value⟧ < 0) 0;", type = "parameter", modifiers = ["local"] },
    { at = "RETURN_IF(value ⟦<⟧ 0) 0;", type = "operator" },
    { at = "RETURN_IF(value < ⟦0⟧) 0;", type = "number" },
    { at = "RETURN_IF(value < 0) ⟦0⟧;", type = "number" },
    { at = "⟦return⟧ value;", type = "keyword", modifiers = ["controlFlow"] },
    { at = "return ⟦value⟧;", type = "parameter", modifiers = ["local"] },
]
