[answers."main.cpp"]
semantic_tokens = [
    { at = "⟦// A braced initializer splits a one-parameter macro's argument at its⟧", type = "comment" },
    { at = "⟦// comma. Clang recovers by parenthesizing the argument, and its tokens keep⟧", type = "comment" },
    { at = "⟦// their kinds.⟧", type = "comment" },
    { at = "⟦struct⟧ Pt {", type = "keyword" },
    { at = "struct ⟦Pt⟧ {", type = "struct", modifiers = ["definition"] },
    { at = "⟦int⟧ x;", type = "primitive" },
    { at = "int ⟦x⟧;", type = "field", modifiers = ["definition"] },
    { at = "⟦int⟧ y;", type = "primitive" },
    { at = "int ⟦y⟧;", type = "field", modifiers = ["definition"] },
    { at = "⟦#define⟧ CALL(e) e", type = "directive" },
    { at = "#define ⟦CALL⟧(e) e", type = "macro", modifiers = ["definition"] },
    { at = "⟦int⟧ main() {", type = "primitive" },
    { at = "int ⟦main⟧() {", type = "function", modifiers = ["definition"] },
    { at = "⟦CALL⟧(Pt{1, 2});", type = "macro" },
    { at = "CALL(⟦Pt⟧{1, 2});", type = "struct" },
    { at = "CALL(Pt{⟦1⟧, 2});", type = "number" },
    { at = "CALL(Pt{1, ⟦2⟧});", type = "number" },
]
