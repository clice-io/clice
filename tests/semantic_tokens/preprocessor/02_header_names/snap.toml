[answers."main.cpp"]
semantic_tokens = [
    { at = '⟦#include⟧ "inc/angled.h"', type = "directive" },
    { at = '#include ⟦"inc/angled.h"⟧', type = "header" },
    { at = "⟦#include⟧ <angled.h>", type = "directive" },
    { at = "#include ⟦<angled.h>⟧", type = "header" },
    { at = '⟦#⟧ include "inc/angled.h"', type = "directive" },
    { at = '# ⟦include⟧ "inc/angled.h"', type = "directive" },
    { at = '# include ⟦"inc/angled.h"⟧', type = "header" },
    { at = "⟦int⟧ after_includes = 0;", type = "primitive" },
    {
        at = "int ⟦after_includes⟧ = 0;",
        type = "variable",
        modifiers = ["definition", "globalScope"],
    },
    { at = "int after_includes = ⟦0⟧;", type = "number" },
]
