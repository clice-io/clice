# Two folders, two projects: the header lives in the library's, and the
# application's source, which picks the other branch, is a host on offer
# from the other.
[units]
"lib/src/lib.cpp" = ["-Ilib/include"]
"app/main.cpp" = ["-Ilib/include", "-DAPP_BACKEND"]

[databases]
lib = ["lib/src/lib.cpp"]
app = ["app/main.cpp"]
