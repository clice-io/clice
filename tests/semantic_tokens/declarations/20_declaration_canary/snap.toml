[answers."main.cpp"]
semantic_tokens = [
    { at = "⟦// Marker-free canary over declaration syntax: the snapshot pins every⟧", type = "comment" },
    { at = "⟦// token, so a stray token appearing anywhere in these declarations fails⟧", type = "comment" },
    { at = "⟦// the suite even where nobody thought to place a marker.⟧", type = "comment" },
    { at = "⟦namespace⟧ demo {", type = "keyword" },
    { at = "namespace ⟦demo⟧ {", type = "namespace", modifiers = ["definition"] },
    { at = "⟦enum⟧ class Color { Red, Green };", type = "keyword" },
    { at = "enum ⟦class⟧ Color { Red, Green };", type = "keyword" },
    { at = "enum class ⟦Color⟧ { Red, Green };", type = "enum", modifiers = ["definition"] },
    {
        at = "enum class Color { ⟦Red⟧, Green };",
        type = "enumMember",
        modifiers = ["definition", "readonly"],
    },
    {
        at = "enum class Color { Red, ⟦Green⟧ };",
        type = "enumMember",
        modifiers = ["definition", "readonly"],
    },
    { at = "⟦struct⟧ Shape {", type = "keyword" },
    { at = "struct ⟦Shape⟧ {", type = "struct", modifiers = ["definition"] },
    { at = "⟦int⟧ sides;", type = "primitive" },
    { at = "int ⟦sides⟧;", type = "field", modifiers = ["definition"] },
    { at = "⟦int⟧ area(int width, int height);", type = "primitive" },
    { at = "int ⟦area⟧(int width, int height);", type = "function", modifiers = ["declaration"] },
    { at = "int area(⟦int⟧ width, int height);", type = "primitive" },
    { at = "int area(int ⟦width⟧, int height);", type = "parameter", modifiers = ["definition"] },
    { at = "int area(int width, ⟦int⟧ height);", type = "primitive" },
    { at = "int area(int width, int ⟦height⟧);", type = "parameter", modifiers = ["definition"] },
    { at = "}  ⟦// namespace demo⟧", type = "comment" },
]
