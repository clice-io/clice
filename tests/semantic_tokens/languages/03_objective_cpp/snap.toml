    { at = "return tally.total() ⟦+⟧ step();", type = "operator" },
    { at = "return tally.total() + ⟦step⟧();", type = "variable", modifiers = ["local", "callable"] },
    {
        at = "return tally.total() + step⟦()⟧;",
        type = "operator",
        modifiers = ["readonly", "member", "constexpr", "userDefined"],
    },
