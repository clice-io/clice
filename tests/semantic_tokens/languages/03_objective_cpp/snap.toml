    { at = "+ (instancetype)⟦alloc⟧;", type = "method", modifiers = ["declaration", "static", "member"] },
    { at = "⟦-⟧ (instancetype)init;", type = "keyword" },
    { at = "- (⟦instancetype⟧)init;", type = "typeAlias", modifiers = ["global"] },
    { at = "- (instancetype)⟦init⟧;", type = "method", modifiers = ["declaration", "member"] },
    { at = "⟦@end⟧ @5", type = "keyword" },
    { at = "⟦@interface⟧ Counter : Object", type = "keyword" },
    { at = "@interface ⟦Counter⟧ : Object", type = "class", modifiers = ["declaration", "global"] },
    { at = "@interface Counter : ⟦Object⟧", type = "class", modifiers = ["global"] },
    { at = "⟦-⟧ (int)next;", type = "keyword" },
    { at = "- (⟦int⟧)next;", type = "primitive" },
    { at = "- (int)⟦next⟧;", type = "method", modifiers = ["declaration", "member"] },
    { at = "⟦@end⟧ @9", type = "keyword" },
    { at = "⟦struct⟧ Tally {", type = "keyword" },
    { at = "struct ⟦Tally⟧ {", type = "struct", modifiers = ["definition", "global"] },
    { at = "[[⟦nodiscard⟧]] int total() const {", type = "attribute" },
    { at = "[[nodiscard]] ⟦int⟧ total() const {", type = "primitive" },
    { at = "[[nodiscard]] int ⟦total⟧() const {", type = "method", modifiers = ["definition", "readonly", "member"] },
    { at = "[[nodiscard]] int total() ⟦const⟧ {", type = "keyword" },
    { at = "⟦return⟧ count;", type = "keyword", modifiers = ["controlFlow"] },
    { at = "return ⟦count⟧;", type = "field", modifiers = ["member"] },
    { at = "⟦int⟧ count = 0;", type = "primitive" },
    { at = "int ⟦count⟧ = 0;", type = "field", modifiers = ["definition", "member"] },
    { at = "int count ⟦=⟧ 0;", type = "operator" },
    { at = "int count = ⟦0⟧;", type = "number" },
    { at = "⟦int⟧ tally(Tally& tally) {", type = "primitive" },
    { at = "int ⟦tally⟧(Tally& tally) {", type = "function", modifiers = ["definition", "global"] },
    { at = "int tally(⟦Tally⟧& tally) {", type = "struct", modifiers = ["global"] },
    { at = "int tally(Tally⟦&⟧ tally) {", type = "operator", modifiers = ["declarator"] },
    { at = "int tally(Tally& ⟦tally⟧) {", type = "parameter", modifiers = ["definition", "local"] },
    { at = "⟦Counter⟧* counter = [[Counter alloc] init];", type = "class", modifiers = ["global"] },
    { at = "Counter⟦*⟧ counter = [[Counter alloc] init];", type = "operator", modifiers = ["declarator"] },
    { at = "Counter* ⟦counter⟧ = [[Counter alloc] init];", type = "variable", modifiers = ["definition", "local"] },
    { at = "Counter* counter ⟦=⟧ [[Counter alloc] init];", type = "operator" },
    { at = "Counter* counter = [[⟦Counter⟧ alloc] init];", type = "class", modifiers = ["global"] },
    { at = "Counter* counter = [[Counter ⟦alloc⟧] init];", type = "method", modifiers = ["static", "member"] },
    { at = "Counter* counter = [[Counter alloc] ⟦init⟧];", type = "method", modifiers = ["member"] },
    { at = "⟦auto⟧ step = [&] { return [counter next]; };", type = "keyword" },
    {
        at = "auto ⟦step⟧ = [&] { return [counter next]; };",
        type = "variable",
        modifiers = ["definition", "local", "callable"],
    },
    { at = "auto step ⟦=⟧ [&] { return [counter next]; };", type = "operator" },
    { at = "auto step = [⟦&⟧] { return [counter next]; };", type = "operator" },
    { at = "auto step = [&] { ⟦return⟧ [counter next]; };", type = "keyword", modifiers = ["controlFlow"] },
    { at = "auto step = [&] { return [⟦counter⟧ next]; };", type = "variable", modifiers = ["local"] },
    { at = "auto step = [&] { return [counter ⟦next⟧]; };", type = "method", modifiers = ["member"] },
