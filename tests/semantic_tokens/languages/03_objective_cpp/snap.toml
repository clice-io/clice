[answers."main.mm"]
semantic_tokens = [
    { at = "⟦__attribute__⟧((objc_root_class))", type = "keyword" },
    { at = "__attribute__((⟦objc_root_class⟧))", type = "attribute" },
    { at = "⟦@interface⟧ Object", type = "keyword" },
