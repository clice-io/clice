    { at = "int area(⟦int⟧ width, int height) {", type = "primitive" },
    { at = "int area(int ⟦width⟧, int height) {", type = "parameter", modifiers = ["definition", "local"] },
    { at = "int area(int width, ⟦int⟧ height) {", type = "primitive" },
    { at = "int area(int width, int ⟦height⟧) {", type = "parameter", modifiers = ["definition", "local"] },
    { at = "⟦return⟧ width * height;", type = "keyword", modifiers = ["controlFlow"] },
    { at = "return ⟦width⟧ * height;", type = "parameter", modifiers = ["local"] },
    { at = "return width ⟦*⟧ height;", type = "operator" },
    { at = "return width * ⟦height⟧;", type = "parameter", modifiers = ["local"] },
    { at = "⟦void⟧ test() {", type = "primitive" },
