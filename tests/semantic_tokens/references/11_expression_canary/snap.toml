    { at = "[[maybe_unused]] int a ⟦=⟧ area(2 * 2, square.sides);", type = "operator" },
    { at = "[[maybe_unused]] int a = ⟦area⟧(2 * 2, square.sides);", type = "function", modifiers = ["global"] },
    { at = "[[maybe_unused]] int a = area(⟦2⟧ * 2, square.sides);", type = "number" },
