[test."$ clice index"]
stdout = '''
Indexed 1 translation unit in #s: 2 file shards (# KB), 3 symbols.
Session log: ${WS}/.clice/logs/${SESSION}
'''
exit = 0

[test."$ clice analyze modules"]
stdout = '''
{
  "error": "some files changed since they were indexed; run `clice index` first",
  "stale": [
    "${WS}/core/str.h"
  ]
}
'''
exit = 1
