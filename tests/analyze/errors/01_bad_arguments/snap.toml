[test."$ clice index"]
stdout = '''
Indexed 1 translation unit in #s: 2 file shards (# KB), 3 symbols.
Session log: ${WS}/.clice/logs/${SESSION}
'''
exit = 0

[test."$ clice analyze modules module nowhere"]
stdout = '''
{
  "error": "no module nowhere",
  "stale": []
}
'''
exit = 1

[test."$ clice analyze modules file nowhere.h"]
stdout = '''
{
  "error": "no scoped file nowhere.h",
  "stale": []
}
'''
stderr = "warning: no churn annotation: Process git ended with exit code 128"
exit = 1

[test."$ clice analyze modules nope"]
stdout = '''
{
  "error": "at argv[0]:\n  nope\n  ^~~~\n  unknown subcommand 'nope'",
  "stale": []
}
'''
exit = 2

[test."$ clice analyze modules edge core"]
stdout = '''
{
  "error": "at end of argv:\n  core\n      ^\n  expected 2 input arguments, got 1",
  "stale": []
}
'''
exit = 2

[test."$ clice analyze modules --scope \"[\""]
stdout = '''
{
  "error": "invalid --scope glob '[': unmatched `[`",
  "stale": []
}
'''
exit = 1

