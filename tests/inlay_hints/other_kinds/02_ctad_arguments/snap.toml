    { line = "Pair⟨<int, double>⟩ pair(⟨a:⟩1, ⟨b:⟩2.5);" },
    { line = "auto copy = Pair⟨<int, char>⟩(⟨a:⟩3, ⟨b:⟩'c');" },
    { line = "auto* heap = new Pair⟨<int, int>⟩(⟨a:⟩4, ⟨b:⟩5);" },
    { line = "auto held = Holder⟨<int>⟩(⟨value:⟩6);" },
    { line = "Twin twin(⟨a:⟩7, ⟨b:⟩8);" },
    { line = "Outer<int>::Inner⟨<double>⟩ inner(⟨item:⟩1.5);" },
    { line = 'Text⟨<char>⟩ text(⟨source:⟩"abc");' },
]

