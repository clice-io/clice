[default."main.cpp"]
inlay_hints = [
    { line = "auto aliased⟨: Integer⟩ = make_alias();" },
    { line = "auto shortened⟨: Compact⟩ = make_compact();" },
    { line = "auto elided⟨: extremely_long_template_name<…>⟩ = make_long();" },
    { line = "auto mixed⟨: tuple<int, double, …>⟩ = make_mixed();" },
    { line = "auto nested⟨: tuple<int, Pair<long, …>>⟩ = make_nested();" },
    { line = "auto callback⟨: function<…>⟩ = make_callback();" },
    { line = "auto defaulted⟨: Defaulted<float>⟩ = make_defaulted();" },
]

[configured."main.cpp"]
inlay_hints = [
    { line = "auto aliased⟨: Integer⟩ = make_alias();" },
    { line = "auto shortened⟨: Compact⟩ = make_compact();" },
    { line = "auto elided⟨: extremely_long_template_name<Integer, Integer, Integer>⟩ = make_long();" },
    { line = "auto mixed⟨: tuple<int, double, extremely_long_template_name<int, char, bool>>⟩ = make_mixed();" },
    { line = "auto nested⟨: tuple<int, Pair<long, extremely_long_template_name<int, char, bool>>>⟩ = make_nested();" },
    { line = "auto dropped⟨: an_extraordinarily_long_class_name<int>⟩ = make_far();" },
    { line = "auto callback⟨: function<auto (const char *) -> bool>⟩ = make_callback();" },
    { line = "auto defaulted⟨: Defaulted<float>⟩ = make_defaulted();" },
]
