[test."$ clice modularize --scope \"app/**,third/**\" --partition partition.json --std stdmod --out wrap".files]
"wrap/.modularize" = '''
+std.macros.h
+libc.macros.h
+mirror/std/fakecstdio
+mirror/std/fakevector
+mirror/alpha/alpha/alpha.h
+mirror/alpha/alpha/limits.h
+mirror/alpha/alpha/simd.h
+alpha.cppm
+alpha.macros.h
+mirror/beta/beta/beta.h
+mirror/beta/beta/simd.h
+beta.cppm
+beta.macros.h
+prelude.h
'''
"wrap/alpha.cppm" = '''
+module;
+
+#include <cio.h>
+#include <cva.h>
+import std.compat;
+#include "std.macros.h"
+#include "libc.macros.h"
+#define ALPHA_WIDE 1
+
+#include <alpha/alpha.h>
+#include <alpha/limits.h>
+#include <alpha/simd.h>
+
+export module alpha;
+
+template <class T> using unnamed_enum = T;
+
+export namespace al = ::alpha;
+export using ::alpha_simd;
+
+export namespace alpha {
+using ::alpha::Color;
+using ::alpha::Thing;
+using ::alpha::fake_abs;
+using ::alpha::make;
+using enum ::alpha::Color;
+using enum unnamed_enum<decltype(::alpha::alpha_high)>;
+}
'''
"wrap/alpha.macros.h" = '''
+#pragma once
+#define ALPHA_VERSION 3
+#define ALPHA_TWICE(x) ((x) * 2)
+#define ALPHA_EXTERN extern
'''
"wrap/beta.cppm" = '''
+module;
+
+#include <cio.h>
+#include <cva.h>
+import std.compat;
+#include "std.macros.h"
+#include "libc.macros.h"
+import alpha;
+#include "alpha.macros.h"
+#include <alpha/local.h>
+
+#include <beta/beta.h>
+#include <beta/simd.h>
+
+export module beta;
+
+export using ::beta_local;
+export using ::beta_simd;
+
+export namespace beta {
+using ::beta::opened;
+using ::beta::wrap;
+}
'''
"wrap/beta.macros.h" = "+#pragma once"
"wrap/libc.macros.h" = '''
+#pragma once
+#define FAKE_EOF (-1)
+#define fake_stdout fake_stdout
+#define fassert(x) ((void)(x))
'''
"wrap/mirror/alpha/alpha/alpha.h" = "(created empty)"
"wrap/mirror/alpha/alpha/limits.h" = "(created empty)"
"wrap/mirror/alpha/alpha/simd.h" = "(created empty)"
"wrap/mirror/beta/beta/beta.h" = "(created empty)"
"wrap/mirror/beta/beta/simd.h" = "(created empty)"
"wrap/mirror/std/fakecstdio" = "(created empty)"
"wrap/mirror/std/fakevector" = "(created empty)"
"wrap/prelude.h" = '''
+#pragma once
+
+#include <cio.h>
+#include <cva.h>
+import std.compat;
+#include "std.macros.h"
+#include "libc.macros.h"
+import alpha;
+import beta;
+#include "alpha.macros.h"
+#include "beta.macros.h"
'''
"wrap/std.macros.h" = "+#pragma once"
