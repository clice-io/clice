[test."$ clice index"]
stdout = '''
Indexed 1 translation unit in #s: 2 file shards (# KB), 6 symbols.
Session log: ${WS}/.clice/logs/${SESSION}
'''
exit = 0

[test."$ clice modularize --scope \"app/**\" --scope \"third/**\" --partition partition.json --out wrap"]
stdout = '''
{
  "wrapping": {
    "stdSources": [],
    "modules": [
      {
        "name": "alpha",
        "source": "alpha.cppm",
        "imports": [],
        "includeRoots": [
          "${WS}/third/alpha"
        ],
        "mirrors": []
      }
    ],
    "mirrors": [
      "mirror/alpha"
    ],
    "macros": "macros.h",
    "prelude": "prelude.h",
    "warnings": []
  },
  "rewriting": {
    "modules": [],
    "importers": [],
    "macros": [],
    "removed": [],
    "moved": [],
    "warnings": []
  }
}
'''
exit = 0

[test."$ clice modularize --scope \"app/**\" --scope \"third/**\" --partition partition.json --out wrap".files]
"wrap/.modularize" = '''
+mirror/alpha/alpha/alpha.h
+alpha.cppm
+alpha.macros.h
+macros.h
+prelude.h
'''
"wrap/alpha.cppm" = '''
+module;
+
+
+#include <alpha/alpha.h>
+
+export module alpha;
+
+export namespace alpha {
+using ::alpha::Thing;
+using ::alpha::make;
+}
'''
"wrap/alpha.macros.h" = '''
+#pragma once
+#define ALPHA_VERSION 3
'''
"wrap/macros.h" = '''
+#pragma once
+
+#include "alpha.macros.h"
'''
"wrap/mirror/alpha/alpha/alpha.h" = "(created empty)"
"wrap/prelude.h" = '''
+#pragma once
+
+import alpha;
+#include "macros.h"
'''
