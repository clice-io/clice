[test."$ clice index"]
stdout = '''
Indexed 2 translation units in #s: 4 file shards (# KB), 7 symbols.
Session log: ${WS}/.clice/logs/${SESSION}
'''
exit = 0

[test."$ clice modularize --scope \"app/**\" --partition partition.json --out wrap"]
stdout = '''
{
  "wrapping": {
    "stdSources": [],
    "modules": [],
    "mirrors": [],
    "prelude": "prelude.h",
    "warnings": []
  },
  "rewriting": {
    "modules": [
      {
        "name": "app.core",
        "primary": "app/core/module.cppm",
        "interfaces": [
          "app/core/size.cppm",
          "app/core/text.cppm"
        ],
        "partitions": [],
        "sources": [
          "app/core/text.cpp"
        ],
        "imports": []
      }
    ],
    "importers": [
      "app/main.cpp"
    ],
    "macros": [
      "app/core/size.macros.h"
    ],
    "removed": [
      "app/core/size.h",
      "app/core/text.h"
    ],
    "moved": [],
    "warnings": []
  }
}
'''
exit = 0

[test."$ clice modularize --scope \"app/**\" --partition partition.json --out wrap".files]
"app/core/module.cppm" = '''
+export module app.core;
+
+export import :size;
+export import :text;
'''
"app/core/size.cppm" = '''
+module;
+
+#include "wrap/prelude.h"
+
+export module app.core:size;
+
+export {
+// A guard's definition continued on a second line goes as a whole, and its
+// macro stays defined for the program that reads it.
+
+namespace core {
+
+inline int unit() {
+    return 1;
+}
+
+}  // namespace core
+
+}
'''
"app/core/size.h" = "(removed)"
"app/core/size.macros.h" = '''
+#pragma once
+
+#define CORE_SIZE_H     1
'''
"app/core/text.cpp" = '''
-#include "core/text.h"
+module;

+#include "wrap/prelude.h"
+
+module app.core;
+
 int core::Text::size() const {
     return 1;
'''
"app/core/text.cppm" = '''
+module;
+
+#include "wrap/prelude.h"
+
+export module app.core:text;
+
+export {
+// An include guard defining its macro to a value is one too: the module
+// interface does without it.
+
+namespace core {
+
+struct Text {
+    int size() const;
+};
+
+}  // namespace core
+
+}
'''
"app/core/text.h" = "(removed)"
"app/main.cpp" = '''
-#include "core/text.h"
-#include "core/size.h"
+#include "wrap/prelude.h"
+#include "core/size.macros.h"
+import app.core;

 int main() {
'''
"wrap/.modularize" = "+prelude.h"
"wrap/prelude.h" = '''
+#pragma once
+
'''
