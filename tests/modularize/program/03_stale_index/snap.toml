[test."$ clice refactor rename --symbol core::Text::size --to length".files]
"app/core/text.cpp" = '''
 #include "core/text.h"

-int core::Text::size() const {
+int core::Text::length() const {
     return 1;
 }
'''
"app/core/text.h" = '''

 struct Text {
-    int size() const;
+    int length() const;
 };
'''
"app/main.cpp" = '''

 int main() {
-    return core::Text{}.size();
+    return core::Text{}.length();
 }
'''

