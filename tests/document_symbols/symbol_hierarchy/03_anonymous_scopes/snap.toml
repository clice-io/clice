[answers.outline]
document_symbols = [
    {
        name = "(anonymous namespace)",
        kind = "Namespace",
        at = "namespace ⟦{⟧",
        children = [
            { name = "hidden_counter", kind = "Variable", at = "int ⟦hidden_counter⟧ = 0;", detail = "int" },
        ],
    },
    {
        name = "(anonymous union)",
        kind = "Class",
        at = "static ⟦union⟧ {",
        detail = "union",
        children = [
            { name = "global_int", kind = "Field", at = "int ⟦global_int⟧;", detail = "int" },
            { name = "global_float", kind = "Field", at = "float ⟦global_float⟧;", detail = "float" },
        ],
    },
    {
        name = "misc",
        kind = "Namespace",
        at = "namespace ⟦misc⟧ {",
        children = [
            {
                name = "v1",
                kind = "Namespace",
                at = "inline namespace ⟦v1⟧ {",
                children = [
                    { name = "versioned", kind = "Function", at = "int ⟦versioned⟧();", detail = "int ()" },
                ],
            },
            {
                name = "Outer",
                kind = "Struct",
                at = "struct ⟦Outer⟧ {",
                detail = "struct",
                children = [
                    {
                        name = "(anonymous struct)",
                        kind = "Struct",
                        at = "⟦struct⟧ {",
                        detail = "struct",
                        children = [
                            {
                                name = "anonymous_member",
                                kind = "Field",
                                at = "int ⟦anonymous_member⟧;",
                                detail = "int",
                            },
                        ],
                    },
                    {
                        name = "(anonymous union)",
                        kind = "Class",
                        at = "⟦union⟧ {",
                        detail = "union",
                        children = [
                            { name = "as_int", kind = "Field", at = "int ⟦as_int⟧;", detail = "int" },
                            { name = "as_float", kind = "Field", at = "float ⟦as_float⟧;", detail = "float" },
                        ],
                    },
                ],
            },
        ],
    },
]

[answers.extents]
