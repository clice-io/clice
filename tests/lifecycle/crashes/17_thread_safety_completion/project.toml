# The build warns with clang's thread-safety analysis, as abseil's does.
# Freestanding, -undef, -nostdinc and the pinned target keep host symbols
# and platform macros out of the candidates, as the completion cases do.
flags = ["--target=x86_64-unknown-linux-gnu", "-std=c++20", "-ffreestanding", "-undef", "-nostdinc", "-Wthread-safety"]
