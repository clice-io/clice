[test."symbols during the outage"]
workspace_symbols = []

[test."pending at the revival"]
value = [
    "clice/worker/compileUnit ${WS}/unit_5.cpp: work parked in its worker by gate 14",
    "index ${WS}/unit_5.cpp",
    "index ${WS}/unit_6.cpp",
    "index pass at 5/8, 6 files queued",
]

[test.sync]
failed = []

[test."symbols after the revival"]
workspace_symbols = [
    { name = "unit_0()", kind = "Function", at = "unit_0.cpp │ int ⟦unit_0⟧() { return 0; }" },
    { name = "unit_1()", kind = "Function", at = "unit_1.cpp │ int ⟦unit_1⟧() { return 1; }" },
    { name = "unit_2()", kind = "Function", at = "unit_2.cpp │ int ⟦unit_2⟧() { return 2; }" },
    { name = "unit_3()", kind = "Function", at = "unit_3.cpp │ int ⟦unit_3⟧() { return 3; }" },
    { name = "unit_4()", kind = "Function", at = "unit_4.cpp │ int ⟦unit_4⟧() { return 4; }" },
    { name = "unit_5()", kind = "Function", at = "unit_5.cpp │ int ⟦unit_5⟧() { return 5; }" },
    { name = "unit_6()", kind = "Function", at = "unit_6.cpp │ int ⟦unit_6⟧() { return 6; }" },
    { name = "unit_7()", kind = "Function", at = "unit_7.cpp │ int ⟦unit_7⟧() { return 7; }" },
]

[test.told]
value = [
    "clice's background workers keep crashing and are stopped for 3 seconds: completion, signature help, formatting and indexing wait until then. This is a bug in clice: please report it at https://github.com/clice-io/clice/issues, with the crash reports from the log directory ${WS}/.clice/logs/${SESSION}",
]
