[test."p1.cppm"]
wrong = "the range of a partition import ends at its semicolon, as a named import's does"
errors = [
    {
        at = "import :⟦p2; … ⟧ (2 lines)",
        severity = "error",
        message = "cyclic dependency in module 'M:p2': M:p2 -> M:p1 -> M:p2",
        source = "clang",
        code = "err_module_cycle",
    },
]

