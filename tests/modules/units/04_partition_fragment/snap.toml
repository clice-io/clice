[answers.macro.hover]
markdown = '''
**macro** `MAX_SIZE`

```cpp
#define MAX_SIZE 100
```
Expands to:
```cpp
100
```
'''
range = "export constexpr int max_size = ⟦MAX_SIZE⟧;"

[answers.use.hover]
markdown = '''
**variable** `max_size`

```cpp
export constexpr int max_size = 100
```
Value: `100 (0x64)`
'''
range = "return ⟦max_size⟧;"
