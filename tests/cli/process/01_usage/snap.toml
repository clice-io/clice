["command help"."$ clice query --help"]
stdout = '''
Ask the persisted index about the workspace

Subcommands:
  compile-command   The command the editor compiles a file with, and where it came from
  project-files     The build's files
  file-deps         The files a file includes and the files including it
  impact-analysis   What a change to a file reaches: its includers and the modules among them
  counterparts      The files a file pairs with: a header's sources, a source's headers
  symbol-search     The symbols a locator matches, best first
  read-symbol       A symbol's definition as text, with its documentation
  document-symbols  A file's outline
  definition        Where a symbol is defined, with its documentation
  references        Every place naming a symbol
  call-graph        A function's callers and callees
  implementation    The classes deriving from a class, the overrides of a function
  type-hierarchy    A type's supertypes and subtypes
'''
