["command help"."$ clice query --help"]
stdout = '''
usage: clice query [OPTIONS]

Options:
  -h|--help                       display this help and exit
  --workspace <value>             Workspace root directory (default: current directory)
  --configuration <value>         Build configuration to read, one of the tags declared on rules (default: the selected one, else default_configuration)
  --method <value>                Question to ask: compileCommand, projectFiles, fileDeps, impactAnalysis, counterparts, symbolSearch, readSymbol, documentSymbols, definition, references, callGraph, typeHierarchy
  --path <value>                  File a file question is about (relative to the workspace): compileCommand, fileDeps, impactAnalysis, counterparts, documentSymbols
  --symbol <value>                Symbol a symbol question is about, or the symbols symbolSearch lists, as a locator: a name, an answer's symbol, or file:line[:column]
  --limit <value>                 symbolSearch: at most this many symbols (default 100)
  --filter <value>                projectFiles: all (default), source, header or module
  --direction <value>             fileDeps: includes, includers or both (default); callGraph: callers, callees or both; typeHierarchy: supertypes, subtypes or both
  --depth <value>                 fileDeps: levels to follow (default 1, 0 for all)
  --include-declaration           references: list the declarations and definition too
  --fresh                         Reindex the files whose content changed since they were indexed before answering, through the running server or a batch run of this command
  --log-level <trace|debug|info|warn|error|off>
                                  Log level
'''
exit = 0

["command help"."$ clice refactor --help"]
stdout = '''
usage: clice refactor <ACTION> [OPTIONS]

Options:
  -h|--help                       display this help and exit
  <ACTION>...                     Refactoring to run: rename
  --workspace <value>             Workspace root directory (default: current directory)
  --configuration <value>         Build configuration to read, one of the tags declared on rules (default: the selected one, else default_configuration)
  --symbol <value>                rename: the symbol, as a locator: its whole name, an answer's symbol, or file:line[:column]
  --to <value>                    rename: the new name
  --spec <value>                  rename: a file listing renames to make at once, `<locator> => <new name>` a line; - reads them from stdin
  --dry-run                       Answer with the planned edits without writing them
  --fresh                         Reindex the files whose content changed since they were indexed before planning, through the running server or a batch run of this command
  --log-level <trace|debug|info|warn|error|off>
                                  Log level
'''
exit = 0

["command help"."$ clice index --help"]
stdout = '''
usage: clice index [OPTIONS]

Options:
  -h|--help                       display this help and exit
  --workspace <value>             Workspace root directory (default: current directory)
  --configuration <value>         Build configuration to activate, one of the tags declared on rules (default: the selected one, else default_configuration)
  --workers <value>               Number of indexing workers (default: from config)
  --stats                         Print statistics of the persisted index instead of indexing
  --top <value>                   How many of the largest file shards --stats lists
  --variants                      Print the statistics and then every file shard with its variant count, one tab-separated line each
  --show-symbol <value>           Print what the persisted index records about a symbol, named by its name, qualified name or #hash, instead of indexing
  --show-file <value>             Print a file's persisted rows: variants, contributing units and row counts, instead of indexing
  --show-tu <value>               Print a translation unit's persisted manifest: include tree and contributions, instead of indexing
  --log-level <trace|debug|info|warn|error|off>
                                  Log level
'''
exit = 0

