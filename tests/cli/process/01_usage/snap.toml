["command help"."$ clice serve --help"]
stdout = '''
usage: clice serve [OPTIONS]

Options:
  -h|--help                       display this help and exit
  --mode <pipe|socket>            Server mode: pipe (default) or socket (debug)
  --host <value>                  Socket mode address
  --port <value>                  Socket mode TCP port
  --record <value>                Record LSP input to file for replay testing
  --workspace <value>             Workspace root directory (optional, skips LSP initialize)
  --configuration <value>         Build configuration to activate, one of the tags declared on rules (default: the selected one, else default_configuration)
