["operation help"."$ clice analyze modules --help"]
stdout = '''
usage: clice analyze modules [OPTIONS]

Options:
  -h|--help                       display this help and exit
  --limit <value>                 Most hotspots, move and split candidates to list (default 20)
  --scope <value>                 A glob over workspace-relative paths, absolute ones outside the workspace: analyze only the files it matches (default: every indexed file under the workspace outside a dot directory) (may be repeated)
  --dir-depth <value>             Directory segments naming a file's default module (default 0: its whole directory)
  --partition <value>             JSON file assigning modules by globs, first match wins: {"modules": [{"name": "core", "files": ["src/support/**"]}]}
  --std <value>                   libc++'s module sources (share/libc++/v1), for a partition module provided by std.compat
  --move <value>                  A hypothetical move: <path>=<module> (may be repeated)
  --merge <value>                 A hypothetical merge: <module>+<module>[+...] into the first (may be repeated)
  --move-entity <value>           A hypothetical declaration move: <locator>=<header> (may be repeated)
  --workspace <value>             Workspace root directory (default: the current directory)
  --configuration <value>         Build configuration, one of the tags declared on rules (default: the selected one, else default_configuration)
  --annotation <value>            An annotation file weighing the results: {"name": "compile_time", "unit": "s", "values": {"src/a.cpp": 1.5}} (may be repeated)
  --churn-since <value>           git log --since value of the churn annotation (default 6.months; empty leaves it out)
  --log-level <trace|debug|info|warn|error|off>
                                  Log level of stderr

Subcommands:
  edge       Every entity an edge between two modules carries, and its uses
  module     A module's files by their dependencies, the lines it splits along
  file       What a file names by module, who names its entities, its annotations
  obstacles  What a mechanical rewrite into modules cannot carry over
  macros     The macros crossing modules
  impact     What a change to each module rebuilds
  interface  Per module, what a wrapper module over its headers needs
'''
exit = 0

