["command help"."$ clice modularize --help"]
stdout = '''
usage: clice modularize [OPTIONS]

Options:
  -h|--help                       display this help and exit
  --partition <value>             JSON file assigning modules by globs, first match wins; a module is wrapped, "textual": true stays headers, "external": true is std, "provides": "std.compat" names who exports its names, "rewrite": true rewrites a program module into module units, its primary interface at "primary"
  --scope <value>                 A glob over workspace-relative paths, absolute ones outside the workspace: the files the partition and the program span (may be repeated)
  --std <value>                   libc++'s module sources (share/libc++/v1): the partition's std module is imported as std.compat
  --out <value>                   Directory to write the modules, macro headers, mirrors and prelude into
  --no-mirrors                    Write no mirrors: what still includes a wrapped header parses it beside the import
  --workspace <value>             Workspace root directory (default: the current directory)
  --configuration <value>         Build configuration, one of the tags declared on rules (default: the selected one, else default_configuration)
  --log-level <trace|debug|info|warn|error|off>
                                  Log level of stderr

Subcommands:
  merge  Merge the wrappings of several build configurations
'''
exit = 0

