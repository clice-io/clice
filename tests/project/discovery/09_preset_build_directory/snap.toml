[test."main.cpp"]
diagnostics = [
    {
        at = "#⟦error⟧ missing FROM_BUILD",
        severity = "error",
        message = "missing FROM_BUILD",
        source = "clang",
        code = "err_pp_hash_error",
    },
]

[test.guidance]
value = [
    'No compile_commands.json found in workspace ${WS}. Compile commands will be guessed; see https://docs.clice.io/clice/guide/quick-start#project-setup for setup. clice looks at the workspace root and its direct subdirectories unless clice.toml names a database; to use the deeper ones found, add [[rules]] compile_commands = ["build/debug"] to clice.toml.',
]
