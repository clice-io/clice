[test."$ clice command main.cpp"]
stdout = '''
${WS}/compile_commands.json:
  directory: ${WS}
  command:   ${WS}/missing-cc -std=c++20 -Werror -c main.cpp -o main.o
  resolved:  ${WS}/missing-cc --no-default-config -fno-delayed-template-parsing -resource-dir ${RESOURCE} -std=c++20 -D FROM_RULE ${WS}/main.cpp
  error:     the compiler could not be queried: Driver ${WS}/missing-cc not found or not executable

settings:  the defaults
'''
stderr = "warning: Cannot ask the compiler for its default settings: Driver missing-cc not found or not executable; clang's own driver reads its commands"
exit = 0

