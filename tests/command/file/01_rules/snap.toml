[test."$ clice command main.cpp"]
stdout = '''
${WS}/compile_commands.json:
  directory: ${WS}
  command:   ${WS}/missing-cc -std=c++20 -Werror -c main.cpp -o main.o
  resolved:  ${WS}/missing-cc -fno-delayed-template-parsing -resource-dir ${RESOURCE} -std=c++20 -D FROM_RULE ${WS}/main.cpp
  error:     the compiler could not be queried: the compiler ${WS}/missing-cc does not exist or cannot run; install it, or regenerate compile_commands.json if it was written on another machine
'''
stderr = "warning: Cannot ask the compiler for its default settings: the compiler missing-cc does not exist or cannot run; install it, or regenerate compile_commands.json if it was written on another machine; clang's own driver reads its commands"
exit = 0

[test."$ clice command main.cpp --json"]
stdout = '''
{
  "file": "${WS}/main.cpp",
  "commands": [
    {
      "database": "${WS}/compile_commands.json",
      "entry": {
        "directory": "${WS}",
        "file": "main.cpp",
        "arguments": [
          "${WS}/missing-cc",
          "-std=c++20",
          "-Werror",
          "-c",
          "main.cpp",
          "-o",
          "main.o"
        ]
      },
      "resolved": {
        "directory": "${WS}",
        "arguments": [
          "${WS}/missing-cc",
          "-fno-delayed-template-parsing",
          "-resource-dir",
          "${RESOURCE}",
          "-std=c++20",
          "-D",
          "FROM_RULE",
          "${WS}/main.cpp"
        ]
      },
      "toolchainError": "the compiler ${WS}/missing-cc does not exist or cannot run; install it, or regenerate compile_commands.json if it was written on another machine"
    }
  ]
}
'''
stderr = "warning: Cannot ask the compiler for its default settings: the compiler missing-cc does not exist or cannot run; install it, or regenerate compile_commands.json if it was written on another machine; clang's own driver reads its commands"
exit = 0
