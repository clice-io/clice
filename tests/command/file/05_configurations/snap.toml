[test."$ clice command main.cpp"]
stdout = '''
${WS}/compile_commands.json:
  directory: ${WS}
  command:   ${WS}/missing-cc -c main.cpp
  resolved:  ${WS}/missing-cc -fno-delayed-template-parsing -resource-dir ${RESOURCE} -D DEBUG ${WS}/main.cpp
  error:     the compiler could not be queried: the compiler ${WS}/missing-cc does not exist or cannot run; install it, or regenerate compile_commands.json if it was written on another machine
'''
stderr = "warning: Cannot ask the compiler for its default settings: the compiler missing-cc does not exist or cannot run; install it, or regenerate compile_commands.json if it was written on another machine; clang's own driver reads its commands"
exit = 0

[test."$ clice command main.cpp --configuration release"]
stdout = '''
${WS}/compile_commands.json:
  directory: ${WS}
  command:   ${WS}/missing-cc -c main.cpp
  resolved:  ${WS}/missing-cc -fno-delayed-template-parsing -resource-dir ${RESOURCE} -D NDEBUG ${WS}/main.cpp
  error:     the compiler could not be queried: the compiler ${WS}/missing-cc does not exist or cannot run; install it, or regenerate compile_commands.json if it was written on another machine
'''
stderr = "warning: Cannot ask the compiler for its default settings: the compiler missing-cc does not exist or cannot run; install it, or regenerate compile_commands.json if it was written on another machine; clang's own driver reads its commands"
