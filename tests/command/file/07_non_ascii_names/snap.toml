[test."$ clice command 源码/主程序.cpp"]
stdout = '''
${WS}/构建/compile_commands.json:
  directory: ${WS}/构建
  command:   ${WS}/missing-cc -std=c++20 @参数.rsp -DGREETING=\"你好\" -c ../源码/主程序.cpp -o 主程序.o
  resolved:  ${WS}/missing-cc -resource-dir ${RESOURCE} -std=c++20 -I ${WS}/构建/../头文件 -D GREETING=\"你好\" ${WS}/构建/../源码/主程序.cpp
  error:     the compiler could not be queried: Driver ${WS}/missing-cc not found or not executable
'''
stderr = "error: Toolchain query failed: Driver ${WS}/missing-cc not found or not executable"
exit = 0

[test."$ clice command 源码/主程序.cpp --json"]
stdout = '''
{
  "file": "${WS}/源码/主程序.cpp",
  "commands": [
    {
      "database": "${WS}/构建/compile_commands.json",
      "entry": {
        "directory": "${WS}/构建",
        "file": "../源码/主程序.cpp",
        "arguments": [
          "${WS}/missing-cc",
          "-std=c++20",
          "@参数.rsp",
          "-DGREETING=\"你好\"",
          "-c",
          "../源码/主程序.cpp",
          "-o",
          "主程序.o"
        ]
      },
      "resolved": {
        "directory": "${WS}/构建",
        "arguments": [
          "${WS}/missing-cc",
          "-resource-dir",
          "${RESOURCE}",
          "-std=c++20",
          "-I",
          "${WS}/构建/../头文件",
          "-D",
          "GREETING=\"你好\"",
          "${WS}/构建/../源码/主程序.cpp"
        ]
      },
      "toolchainError": "Driver ${WS}/missing-cc not found or not executable"
    }
  ]
}
'''
stderr = "error: Toolchain query failed: Driver ${WS}/missing-cc not found or not executable"
exit = 0

[test."$ clice command convert 构建/compile_commands.json"]
stdout = '''
[
  {
    "directory": "${WS}/构建",
    "file": "../源码/主程序.cpp",
    "arguments": [
      "${WS}/missing-cc",
      "-resource-dir",
      "${RESOURCE}",
      "-std=c++20",
      "-I",
      "${WS}/构建/../头文件",
      "-D",
      "GREETING=\"你好\"",
      "${WS}/构建/../源码/主程序.cpp"
    ]
  }
]
'''
stderr = '''
error: Toolchain query failed: Driver ${WS}/missing-cc not found or not executable
error: 1 of the converted entries could not be resolved: the compiler could not be queried, so they are clice's own reading of their command
'''
exit = 1

[test."$ clice command convert -- missing-cc -I头文件 -c 源码/主程序.cpp"]
stdout = "missing-cc -resource-dir ${RESOURCE} -I ${WS}/头文件 ${WS}/源码/主程序.cpp"
stderr = '''
error: Toolchain query failed: Cannot find driver: missing-cc
error: The compiler could not be queried, so the command is clice's own reading of it
'''
exit = 1
