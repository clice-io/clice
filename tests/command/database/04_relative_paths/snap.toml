[test."$ clice command project/build/src/main.cpp"]
stdout = '''
${WS}/compile_commands.json:
  directory: ${WS}/project/build
  command:   missing-clang++ -std=c++20 src/main.cpp
  resolved:  missing-clang++ -resource-dir ${RESOURCE} -std=c++20 ${WS}/project/build/src/main.cpp
  error:     the compiler could not be queried: Cannot find driver: missing-clang++
'''
stderr = "error: Toolchain query failed: Cannot find driver: missing-clang++"
exit = 0

