[test."$ clice command convert -- missing-clang++ later.cpp"]
stdout = "missing-clang++ -fno-delayed-template-parsing -resource-dir ${RESOURCE} -D BAR ${WS}/later.cpp"
stderr = '''
warning: Cannot ask the compiler for its default settings: Cannot find driver: missing-clang++; clang's own driver reads its commands
error: The command stays a driver command: Cannot find driver: missing-clang++
'''
exit = 1

[test."$ clice command convert -- missing-clang++ earlier.cpp"]
stdout = "missing-clang++ -fno-delayed-template-parsing -resource-dir ${RESOURCE} -D FOO=1 ${WS}/earlier.cpp"
stderr = '''
warning: Cannot ask the compiler for its default settings: Cannot find driver: missing-clang++; clang's own driver reads its commands
error: The command stays a driver command: Cannot find driver: missing-clang++
'''
exit = 1
