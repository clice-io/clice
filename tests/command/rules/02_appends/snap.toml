[test."$ clice command convert -- missing-clang++ --output=main.o -D A -D B=0 defined.cpp"]
stdout = "missing-clang++ -resource-dir ${RESOURCE} -D A -D B=0 -D C ${WS}/defined.cpp"
stderr = '''
error: Toolchain query failed: Cannot find driver: missing-clang++
error: The command stays a driver command: Cannot find driver: missing-clang++
'''
exit = 1

[test."$ clice command convert -- missing-clang++ unknown.cpp"]
stdout = "missing-clang++ -resource-dir ${RESOURCE} -fnot-a-real-flag value ${WS}/unknown.cpp"
