# tombi.toml

toml-version = "v1.1.0"

[format.rules]
indent-style = "space"
indent-width = 4
line-width = 120
string-quote-style = "preserve"

# Case inputs are test data: like tests/.fdignore, tooling never rewrites them.
# project.toml is formatted and linted; snap.toml, which the case framework
# writes, is linted; the rest, some malformed on purpose, is not. The first
# override a file matches applies.
[[overrides]]
files.include = ["tests/*/*/*/project.toml"]
format.enabled = true

[[overrides]]
files.include = ["tests/*/*/*/snap.toml"]
format.enabled = false

[[overrides]]
files.include = ["tests/*/*/*/**"]
format.enabled = false
lint.enabled = false
