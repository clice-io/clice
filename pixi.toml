# tombi: format.rules.table-keys-order.disabled = true

[workspace]
name = "clice"
version = "0.1.0"
description = "A next-generation C++ language server for modern C++"
authors = [
    "ykiko <ykiko@clice.io>",
    "clice contributors <clice@clice.io>",
]
license = "Apache-2.0"
license-file = "LICENSE"
readme = "README.md"
documentation = "https://docs.clice.io/clice/"
repository = "https://github.com/clice-io/clice"
# conda.clice.io: clice-io's own channel, for xclang (clice-io/xclang).
channels = ["conda-forge", "https://conda.clice.io"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64", "linux-aarch64", "win-arm64"]

[environments]
default = ["build", "test"]
node = ["node"]
format = ["format"]
test-run = ["test", "cuda"]
# The CUDA toolkit alone, for the compat suite's nvcc scenarios. The suite
# runs it without activating the environment, whose activation would point
# nvcc at conda's g++ and every other build at conda's flags.
cuda = ["cuda"]
editor = ["editor", "node"]

# ============================================================================== #
#                                  DEPENDENCIES                                  #
# ============================================================================== #
[feature.build.dependencies]
python = ">=3.13"
# Bazel is npm's bazelisk (package.json), which runs the release of
# .bazelversion; bazel/workspace_status.mjs runs on it too.
nodejs = ">=24"
# The LLVM tools the artifact checks run (scripts/check_artifact_deps.py), of
# the xclang release MODULE.bazel builds with.
xclang = "==23.1.2.8"

# nodejs bundles npm on every platform including win-arm64. Floor 24: the tools
# run as bare .ts (type stripping, default since node 23.6) and the
# cache tests use JSON.rawJSON (21+). python remains only for
# scripts/symbolize.py; the scripts/ tools are not part of the TS
# migration.
[feature.test.dependencies]
python = ">=3.13"
nodejs = ">=24"
# `clice format` runs the clang-format found in PATH; the integration
# tests drive it on real files.
clang-format = "==23.1.1"
# The fixtures with a CMakeLists.txt get their compile_commands.json from a
# CMake configuration (tools/compile_commands.ts).
cmake = ">=3.30"
ninja = "*"

[feature.test.target.linux-64.dependencies]
# The symbolization test reads the release's GSYM with llvm-gsymutil, here
# xclang's.
xclang = "==23.1.2.8"

# The NVCC toolchain tests drive a real nvcc; cudart is the runtime the
# probe compiles against and curand is included unconditionally by clang's
# CUDA wrapper header. Linux-only: there are no osx packages and the
# Windows host compiler (cl) is not supported by the query yet. No GPU is
# needed — compilation and the --dryrun probe are pure CPU.
[feature.cuda.target.linux-64.dependencies]
cuda-nvcc = "13.*"
cuda-cudart-dev = "13.*"
libcurand-dev = "*"

# The integration suite runs on arm64 Linux too, so the symbolization test
# needs the same tools there.
[feature.test.target.linux-aarch64.dependencies]
xclang = "==23.1.2.8"

# On macOS, the system Apple clang emits vendor-specific flags that upstream
# LLVM cannot parse. Providing upstream clang in PATH prevents fallback to
# /usr/bin/clang++, for the tests and for the CMake configurations of the
# fixtures (tools/compile_commands.ts).
[feature.test.target.osx-64.dependencies]
xclang = "==23.1.2.8"

[feature.test.target.osx-arm64.dependencies]
xclang = "==23.1.2.8"

# On Windows LLVM's tools alone, for the symbolization test's llvm-gsymutil:
# the clang the tests find stays the one they find without it.
[feature.test.target.win-64.dependencies]
llvm-tools = "==23.1.2"

[feature.test.target.win-arm64.dependencies]
llvm-tools = "==23.1.2"

# Debug builds are ASAN-instrumented; macOS links the ASAN runtime as a
# dylib resolved against the build env, which artifact-based test jobs
# don't have. The activation script points DYLD_LIBRARY_PATH at this
# env's copy instead.
[feature.test.target.osx-64.activation]
scripts = ["scripts/activate_asan_macos.sh"]

[feature.test.target.osx-arm64.activation]
scripts = ["scripts/activate_asan_macos.sh"]

# ============================================================================== #
#                                   BAZEL                                        #
# ============================================================================== #
# The programs land in build/{{ type }}/bin/bin (bazel/clice.bazelrc).
# Arguments after `--` go to Bazel: more targets, such as //:package, and
# options.
[feature.build.tasks.build]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = "npx bazel build --config={{ type }} //:dist"
depends-on = ["install-tests"]

[feature.build.tasks.check-layers]
cmd = "python3 scripts/check_layers.py"

# Workspace-level (default feature) so every environment can run them —
# the lint job uses the bare `node` env, local runs use `default`.
[tasks.check-feature-docs]
cmd = "node tools/docs/feature.ts check"
depends-on = ["install-tests"]

[tasks.update-feature-docs]
cmd = "node tools/docs/feature.ts update"
depends-on = ["install-tests"]

[tasks.check-config-docs]
cmd = "node tools/docs/config.ts check"
depends-on = ["install-tests"]

[tasks.update-config-docs]
cmd = "node tools/docs/config.ts update"
depends-on = ["install-tests"]

# docs/en and docs/zh are both hand-edited; docs/meta/translations holds
# the per-segment hash pairs tying them together. The checker comes from
# clice-io/docs (tools/translations, its RULES.md states the contract).
[tasks.check-doc-translations]
cmd = "node tools/docs/translations.ts check"

[tasks.report-doc-translations]
cmd = "node tools/docs/translations.ts report"

[tasks.record-doc-translations]
cmd = "node tools/docs/translations.ts record"

[tasks.review-doc-translations]
cmd = "node tools/docs/translations.ts review --glossary=.claude/skills/translate-docs/SKILL.md"

[feature.test.tasks.unit-test]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = 'CLICE_TEST_DATA_DIR=$PIXI_PROJECT_ROOT/tests/data ./build/{{ type }}/bin/bin/unit_tests --verbose'
depends-on = [{ task = "check-feature-docs" }]

# npm workspaces: install runs at the repo root and covers tools/, tests/
# and editors/vscode/.
[tasks.install-tests]
cmd = "npm install"
inputs = [
    "package.json",
    "package-lock.json",
    "tools/package.json",
    "tests/package.json",
    "editors/vscode/package.json",
]
outputs = ["node_modules/.package-lock.json"]

# Files run in parallel worker processes (one per file, like xdist -n
# auto); tests within a file are sequential. `shard` is vitest's --shard,
# <index>/<count> of the files, for CI's runners.
[feature.test.tasks.integration-test]
args = [{ arg = "type", default = "RelWithDebInfo" }, { arg = "shard", default = "1/1" }]
cmd = """
CLICE_EXECUTABLE=$PIXI_PROJECT_ROOT/build/{{ type }}/bin/bin/clice npm test --workspace tests -- --shard={{ shard }}
"""
depends-on = ["install-tests"]

[feature.test.tasks.smoke-test]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = """
node tools/replay.ts tests/smoke/*.jsonl \
    --clice=./build/{{ type }}/bin/bin/clice
"""

# Feature snapshots exercise `clice inspect` and real server paths over
# tests/snap corpora. Driver logic lives under tools/snap/; the vitest glue
# schedules fixture work concurrently within the suite. `shard` is
# <index>/<count> of the fixtures (tests/snap/snap.test.ts).
[feature.test.tasks.snap-test]
args = [{ arg = "type", default = "RelWithDebInfo" }, { arg = "shard", default = "1/1" }]
cmd = """
CLICE_SNAP_SHARD={{ shard }} CLICE_EXECUTABLE=$PIXI_PROJECT_ROOT/build/{{ type }}/bin/bin/clice npm run snap --workspace tests
"""
depends-on = ["install-tests"]

# The Zed extension in a real Zed (tests/zed); ZED_EXECUTABLE names the Zed
# app, and the extension builds with the system's cargo. Workspace-level so CI
# can run it from the bare `node` env.
[tasks.zed-e2e]
cmd = """
cargo build --manifest-path editors/zed/Cargo.toml --target wasm32-wasip2 --release && \
ZED_EXTENSION_WASM=$PIXI_PROJECT_ROOT/editors/zed/target/wasm32-wasip2/release/zed_clice.wasm npm run zed --workspace tests
"""
depends-on = ["install-tests"]

# Real build systems and toolchains over tests/compat/project; the tools each
# scenario names come from the system (CI installs them, see compat-test.yml),
# nvcc from the `cuda` environment. Workspace-level so CI can run it from
# the bare `node` env.
[tasks.compat-test]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = """
CLICE_EXECUTABLE=$PIXI_PROJECT_ROOT/build/{{ type }}/bin/bin/clice npm run compat --workspace tests
"""
depends-on = ["install-tests"]

[feature.test.tasks.test]
args = [{ arg = "type", default = "RelWithDebInfo" }]
depends-on = [
    { task = "unit-test", args = ["{{ type }}"] },
    { task = "integration-test", args = ["{{ type }}"] },
    { task = "smoke-test", args = ["{{ type }}"] },
    { task = "snap-test", args = ["{{ type }}"] },
]

# ============================================================================== #
#                                EDITOR E2E TESTS                                #
# ============================================================================== #
# No win-64: the tasks below reference the binary as bin/clice (no .exe).
[feature.editor]
platforms = ["linux-64", "osx-arm64", "osx-64", "linux-aarch64"]

# Same mitigation as feature.test: editor-prepare configures fixtures with
# CMake and xclang's clang (tools/compile_commands.ts).
[feature.editor.target.osx-arm64.dependencies]
xclang = "==23.1.2.8"

[feature.editor.target.osx-64.dependencies]
xclang = "==23.1.2.8"

# Fixture list kept in sync with editors/vscode/.vscode-test.mjs.
[feature.editor.tasks.editor-prepare]
cmd = "node tools/prepare.ts hello_world modules/hover_on_imported_symbol header_context"

# Requires nvim (stable) on PATH.
[feature.editor.tasks.nvim-e2e]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = """
nvim -l editors/nvim/tests/e2e.lua build/{{ type }}/bin/bin/clice tests/data/hello_world && \
nvim -l editors/nvim/tests/e2e.lua build/{{ type }}/bin/bin/clice tests/data/modules/hover_on_imported_symbol && \
nvim -l editors/nvim/tests/e2e.lua build/{{ type }}/bin/bin/clice tests/data/header_context
"""
depends-on = ["editor-prepare"]

[feature.editor.tasks.vscode-e2e]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cwd = "editors/vscode"
cmd = "CLICE_EXECUTABLE=$PIXI_PROJECT_ROOT/build/{{ type }}/bin/bin/clice npm test"
depends-on = ["install-vscode", "editor-prepare"]

[feature.editor.tasks.editor-test]
args = [{ arg = "type", default = "RelWithDebInfo" }]
depends-on = [
    { task = "nvim-e2e", args = ["{{ type }}"] },
    { task = "vscode-e2e", args = ["{{ type }}"] },
]

[dependencies]

# ============================================================================== #
#                             DOCS & VSCODE EXTENSION                            #
# ============================================================================== #
[feature.node]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64", "linux-aarch64"]

[feature.node.dependencies]
nodejs = ">=22"

# The instant-build packaging strips test binaries before bundling them
# into the vsix (an unstripped ELF carries ~700MB of DWARF).
[feature.node.target.linux-64.dependencies]
llvm-tools = "==23.1.1"

[feature.node.tasks]
# The trailing "--" forwards extra `pixi run` arguments (--target, -p, ...)
# through npm to the underlying script.
build-vscode = { cwd = "editors/vscode", cmd = "npm run package --", depends-on = ["install-vscode"] }
publish-vscode = { cwd = "editors/vscode", cmd = "npm run publish --", depends-on = ["install-vscode"] }
publish-ovsx = { cwd = "editors/vscode", cmd = "npm run publish:ovsx --", depends-on = ["install-vscode"] }

# Same root npm-workspaces install as install-tests, available in the node
# environment (the publish pipeline installs no test feature).
[feature.node.tasks.install-vscode]
cmd = "npm install"
inputs = [
    "package.json",
    "package-lock.json",
    "tools/package.json",
    "tests/package.json",
    "editors/vscode/package.json",
]
outputs = ["node_modules/.package-lock.json"]

# ============================================================================== #
#                                    FORMAT                                      #
# ============================================================================== #
[feature.format]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64", "linux-aarch64"]

[feature.format.dependencies]
ruff = "*"
tombi = "*"
stylua = "*"
fd-find = "*"
prettier = "*"
clang-format = "==23.1.1"

[feature.format.tasks]
format-cpp = "fd -H -e cpp -e h -e cc -e hpp -e cppm -x clang-format -i"
format-python = "ruff format ."
format-lua = "stylua ."
format-web = "fd -H -e js -e mjs -e ts -e css -x prettier --write"
format-markdown = "fd -H -e md -x prettier --write"
format-json = "fd -H -e json -E package-lock.json -E clice-config.schema.json -x prettier --write"
format-toml = "fd -H -e toml -x tombi format"
format-yaml = """
fd -H -e yaml -e yml -E '*.snap.yml' -x prettier --write && \
fd -H "^\\.clang-(format|tidy)$" -x prettier --write --parser yaml
"""
format = { depends-on = [
    "format-cpp",
    "format-python",
    "format-lua",
    "format-web",
    "format-markdown",
    "format-json",
    "format-toml",
    "format-yaml"
] }

# ============================================================================== #
#                                     LINT                                       #
# ============================================================================== #
[feature.format.tasks.lint-python]
cmd = "ruff check ."

[feature.build.tasks.lint]
depends-on = ["lint-python"]
