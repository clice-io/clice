# tombi: format.rules.table-keys-order.disabled = true

[workspace]
name = "clice"
version = "0.1.0"
description = "A next-generation C++ language server for modern C++"
authors = [
    "ykiko <ykiko@clice.io>",
    "clice contributors <clice@clice.io>",
]
license = "Apache-2.0"
license-file = "LICENSE"
readme = "README.md"
documentation = "https://docs.clice.io/clice/"
repository = "https://github.com/clice-io/clice"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64", "linux-aarch64", "win-arm64"]

[environments]
default = ["build", "test"]
package = ["build", "test", "package"]
cross-linux-arm64 = ["build", "package", "cross-linux-arm64"]
cross-windows-arm64 = ["build", "package", "cross-windows-arm64"]
node = ["node"]
format = ["format"]
test-run = ["test", "cuda"]
editor = ["editor", "node"]

# ============================================================================== #
#                                  DEPENDENCIES                                  #
# ============================================================================== #
[feature.build]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64", "linux-aarch64"]

[feature.build.dependencies]
python = ">=3.13"
cmake = ">=3.30"
ninja = "*"
clang = "==22.1.8"
clangxx = "==22.1.8"
lld = "==22.1.8"
llvm-tools = "==22.1.8"
clang-tools = "==22.1.8"
compiler-rt = "==22.1.8"
# cmake/archive.cmake pipes tar through xz for the symbol archives.
xz = ">=5.8.1,<6"

[feature.build.target.win-64.dependencies]
sccache = "*"

[feature.build.target.linux-64.dependencies]
sysroot_linux-64 = "==2.17"
gcc = "==15.2.0"
gxx = "==15.2.0"
ccache = "*"

[feature.build.target.osx-arm64.dependencies]
ccache = "*"

[feature.build.target.linux-64.activation]
scripts = ["scripts/activate_linux.sh"]

[feature.build.target.win-64.activation]
scripts = ["scripts/activate_asan.bat"]

# Linux arm64 (from x64): needs the aarch64 sysroot and cross gcc for libstdc++.
[feature.cross-linux-arm64.target.linux-64.dependencies]
sysroot_linux-aarch64 = "==2.17"
gcc_linux-aarch64 = "==15.2.0"
gxx_linux-aarch64 = "==15.2.0"

[feature.cross-linux-arm64.target.linux-64.activation]
scripts = ["scripts/activate_cross_linux.sh"]

# Windows arm64 (from x64): Windows SDK on CI already includes ARM64 libs.
[feature.cross-windows-arm64.target.win-64.dependencies]

[feature.cross-windows-arm64.target.win-64.activation]
scripts = ["scripts/activate_cross_windows.bat"]

# nodejs bundles npm on every platform including win-arm64, where
# cross-test runs this env. Floor 24: the tools
# run as bare .ts (type stripping, default since node 23.6) and the
# cache tests use JSON.rawJSON (21+). python remains only for
# scripts/symbolize.py; the scripts/ tools are not part of the TS
# migration.
[feature.test.dependencies]
python = ">=3.13"
nodejs = ">=24"

# ToolchainTests.GCC queries the g++ found in PATH and compiles C++23
# (<print>), so the test env must provide the same pinned gcc the build
# env uses — runner system gcc is too old.
[feature.test.target.linux-64.dependencies]
gcc = "==15.2.0"
gxx = "==15.2.0"
# The symbolization round-trip test replays the release strip/GSYM flow
# (linux-only, like the crash tests it builds on).
llvm-tools = "==22.1.8"

# The NVCC toolchain tests drive a real nvcc; cudart is the runtime the
# probe compiles against and curand is included unconditionally by clang's
# CUDA wrapper header. Linux-only: there are no osx packages and the
# Windows host compiler (cl) is not supported by the query yet. No GPU is
# needed — compilation and the --dryrun probe are pure CPU.
[feature.cuda.target.linux-64.dependencies]
cuda-nvcc = "13.*"
cuda-cudart-dev = "13.*"
libcurand-dev = "*"

# The linux-aarch64 cross-test job runs the integration suite on a native
# arm64 runner, so the symbolization test needs the same tools there.
[feature.test.target.linux-aarch64.dependencies]
llvm-tools = "==22.1.8"

# On macOS, the system Apple clang emits vendor-specific flags that upstream
# LLVM cannot parse.  Providing upstream clang + lld in PATH prevents
# fallback to /usr/bin/clang++ and satisfies toolchain.cmake's -fuse-ld=lld.
[feature.test.target.osx-64.dependencies]
clang = "==22.1.8"
clangxx = "==22.1.8"
lld = "==22.1.8"
compiler-rt = "==22.1.8"

[feature.test.target.osx-arm64.dependencies]
clang = "==22.1.8"
clangxx = "==22.1.8"
lld = "==22.1.8"
compiler-rt = "==22.1.8"

# Debug builds are ASAN-instrumented; macOS links the ASAN runtime as a
# dylib resolved against the build env, which artifact-based test jobs
# don't have. The activation script points DYLD_LIBRARY_PATH at this
# env's copy instead.
[feature.test.target.osx-64.activation]
scripts = ["scripts/activate_asan_macos.sh"]

[feature.test.target.osx-arm64.activation]
scripts = ["scripts/activate_asan_macos.sh"]

# Packaging reuses the standard build: the shipped binary is the tested one.
[feature.package.tasks.package]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = "cmake --build build/{{ type }} --target clice-pack clice-pack-symbol"
depends-on = [{ task = "build", args = ["{{ type }}"] }]

# ============================================================================== #
#                                   CMAKE                                        #
# ============================================================================== #
[feature.build.tasks.cmake-config]
args = [
    { arg = "type", default = "RelWithDebInfo" },
    { arg = "ci", default = "OFF" },
]
cmd = """
cmake -B build/{{ type }} -G Ninja \
    -DCMAKE_BUILD_TYPE={{ type }} \
    -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake \
    -DCLICE_ENABLE_TEST=ON \
    -DCLICE_CI_ENVIRONMENT={{ ci }}
"""

[feature.build.tasks.cmake-build]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = "cmake --build build/{{ type }}"

[feature.build.tasks.build]
args = [
    { arg = "type", default = "RelWithDebInfo" },
    { arg = "ci", default = "OFF" },
]
depends-on = [
    { task = "cmake-config", args = ["{{ type }}", "{{ ci }}"] },
    { task = "cmake-build", args = ["{{ type }}"] },
]

[feature.build.tasks.clang-tidy]
args = [{ arg = "type", default = "RelWithDebInfo" }]
depends-on = [{ task = "lint-cpp", args = ["{{ type }}"] }]

[feature.build.tasks.check-layers]
cmd = "python3 scripts/check_layers.py"

[feature.test.tasks.check-feature-docs]
cmd = "node tools/feature_docs.ts check"

[feature.test.tasks.unit-test]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = './build/{{ type }}/bin/unit_tests --test-dir="./tests/data" --verbose'
depends-on = [{ task = "check-feature-docs" }]

# npm workspaces: install runs at the repo root and covers tools/, tests/
# and editors/vscode/.
[feature.test.tasks.install-tests]
cmd = "npm install"
inputs = [
    "package.json",
    "package-lock.json",
    "tools/package.json",
    "tests/package.json",
    "editors/vscode/package.json",
]
outputs = ["node_modules/.package-lock.json"]

# npm run check (tsc strict + ESLint) gates every run, then vitest: files
# run in parallel worker processes (one per file, like xdist -n auto);
# tests within a file are sequential.
[feature.test.tasks.integration-test]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = """
npm run check && \
CLICE_EXECUTABLE=$PIXI_PROJECT_ROOT/build/{{ type }}/bin/clice npm test --workspace tests
"""
depends-on = ["install-tests"]

[feature.test.tasks.smoke-test]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = """
node tools/replay.ts tests/smoke/*.jsonl \
    --clice=./build/{{ type }}/bin/clice
"""

# Standalone feature snapshots: `clice inspect` over tests/snap corpora
# (no server involved). Driver logic lives in tools/snap.ts; the vitest
# glue schedules one inspect process per fixture concurrently.
[feature.test.tasks.snap-test]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = """
CLICE_EXECUTABLE=$PIXI_PROJECT_ROOT/build/{{ type }}/bin/clice npm run snap --workspace tests
"""
depends-on = ["install-tests"]

[feature.test.tasks.test]
args = [{ arg = "type", default = "RelWithDebInfo" }]
depends-on = [
    { task = "unit-test", args = ["{{ type }}"] },
    { task = "integration-test", args = ["{{ type }}"] },
    { task = "smoke-test", args = ["{{ type }}"] },
    { task = "snap-test", args = ["{{ type }}"] },
]

# ============================================================================== #
#                                EDITOR E2E TESTS                                #
# ============================================================================== #
# No win-64: the tasks below reference the binary as bin/clice (no .exe).
[feature.editor]
platforms = ["linux-64", "osx-arm64", "osx-64", "linux-aarch64"]

# Same mitigation as feature.test: editor-prepare configures fixtures with
# toolchain.cmake's -fuse-ld=lld, which Apple system clang rejects.
[feature.editor.target.osx-arm64.dependencies]
clang = "==22.1.8"
clangxx = "==22.1.8"
lld = "==22.1.8"
compiler-rt = "==22.1.8"

[feature.editor.target.osx-64.dependencies]
clang = "==22.1.8"
clangxx = "==22.1.8"
lld = "==22.1.8"
compiler-rt = "==22.1.8"

# Fixture list kept in sync with editors/vscode/.vscode-test.mjs.
[feature.editor.tasks.editor-prepare]
cmd = "node tools/prepare.ts hello_world modules/hover_on_imported_symbol header_context"

# Requires nvim (stable) on PATH.
[feature.editor.tasks.nvim-e2e]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = """
nvim -l editors/nvim/tests/e2e.lua build/{{ type }}/bin/clice tests/data/hello_world && \
nvim -l editors/nvim/tests/e2e.lua build/{{ type }}/bin/clice tests/data/modules/hover_on_imported_symbol && \
nvim -l editors/nvim/tests/e2e.lua build/{{ type }}/bin/clice tests/data/header_context
"""
depends-on = ["editor-prepare"]

[feature.editor.tasks.vscode-e2e]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cwd = "editors/vscode"
cmd = "CLICE_EXECUTABLE=$PIXI_PROJECT_ROOT/build/{{ type }}/bin/clice npm test"
depends-on = ["install-vscode", "editor-prepare"]

[feature.editor.tasks.editor-test]
args = [{ arg = "type", default = "RelWithDebInfo" }]
depends-on = [
    { task = "nvim-e2e", args = ["{{ type }}"] },
    { task = "vscode-e2e", args = ["{{ type }}"] },
]

[dependencies]

# ============================================================================== #
#                             DOCS & VSCODE EXTENSION                            #
# ============================================================================== #
[feature.node]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64", "linux-aarch64"]

[feature.node.dependencies]
nodejs = ">=20"

# The instant-build packaging strips test binaries before bundling them
# into the vsix (an unstripped ELF carries ~700MB of DWARF).
[feature.node.target.linux-64.dependencies]
llvm-tools = "==22.1.8"

[feature.node.tasks]
# The trailing "--" forwards extra `pixi run` arguments (--target, -p, ...)
# through npm to the underlying script.
build-vscode = { cwd = "editors/vscode", cmd = "npm run package --", depends-on = ["install-vscode"] }
publish-vscode = { cwd = "editors/vscode", cmd = "npm run publish --", depends-on = ["install-vscode"] }

# Same root npm-workspaces install as install-tests, available in the node
# environment (the publish pipeline installs no test feature).
[feature.node.tasks.install-vscode]
cmd = "npm install"
inputs = [
    "package.json",
    "package-lock.json",
    "tools/package.json",
    "tests/package.json",
    "editors/vscode/package.json",
]
outputs = ["node_modules/.package-lock.json"]

# ============================================================================== #
#                                    FORMAT                                      #
# ============================================================================== #
[feature.format]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64", "linux-aarch64"]

[feature.format.dependencies]
ruff = "*"
tombi = "*"
stylua = "*"
fd-find = "*"
prettier = "*"
clang-format = "==22.1.8"

[feature.format.tasks]
format-cpp = "fd -H -e cpp -e h -e cc -e hpp -e cppm -x clang-format -i"
format-python = "ruff format ."
format-lua = "stylua ."
format-web = "fd -H -e js -e mjs -e ts -e css -x prettier --write"
format-markdown = "fd -H -e md -x prettier --write"
format-json = "fd -H -e json -E package-lock.json -E clice-config.schema.json -x prettier --write"
format-toml = "fd -H -e toml -x tombi format"
format-yaml = """
fd -H -e yaml -e yml -E '*.snap.yml' -x prettier --write && \
fd -H "^\\.clang-(format|tidy)$" -x prettier --write --parser yaml
"""
format = { depends-on = [
    "format-cpp",
    "format-python",
    "format-lua",
    "format-web",
    "format-markdown",
    "format-json",
    "format-toml",
    "format-yaml"
] }

# ============================================================================== #
#                                     LINT                                       #
# ============================================================================== #
[feature.format.tasks.lint-python]
cmd = "ruff check ."

[feature.build.tasks.lint-cpp]
args = [{ arg = "type", default = "RelWithDebInfo" }]
cmd = "python scripts/run_clang_tidy.py build/{{ type }}"

[feature.build.tasks.lint]
args = [{ arg = "type", default = "RelWithDebInfo" }]
depends-on = [
    "lint-python",
    { task = "lint-cpp", args = ["{{ type }}"] },
]
