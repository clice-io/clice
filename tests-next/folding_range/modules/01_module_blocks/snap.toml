[answers."main.cpp"]
folding_ranges = [
    { kind = "moduleFragment", at = "module;⟦ … ⟧ (6 lines)" },
    { kind = "export", at = "export ⟦{ … }⟧ (6 lines)", collapsed = "{...}" },
    { kind = "functionBody", at = "int first(int value) ⟦{ … }⟧ (3 lines)", collapsed = "{...}" },
    { kind = "namespace", at = "export namespace ns ⟦{ … }⟧ (3 lines)", collapsed = "{...}" },
    { kind = "moduleFragment", at = "module :private;⟦ … ⟧ (6 lines)" },
    { kind = "functionBody", at = "int second(int value) ⟦{ … }⟧ (3 lines)", collapsed = "{...}" },
]
