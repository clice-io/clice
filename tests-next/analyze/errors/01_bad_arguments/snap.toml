[test."$ clice index"]
stdout = '''
Indexed 1 translation unit in #s: 2 file shards (# KB), 3 symbols.
Session log: ${WS}/.clice/logs/${SESSION}
'''
exit = 0

[test."$ clice analyze modules --view module --module nowhere"]
stdout = '''
{
  "error": "no module nowhere",
  "stale": []
}
'''
exit = 1

[test."$ clice analyze modules --view file --file nowhere.h"]
stdout = '''
{
  "error": "no scoped file nowhere.h",
  "stale": []
}
'''
stderr = ["warning: no churn annotation: Process git ended with exit code 128"]
exit = 1

[test."$ clice analyze modules --view nope"]
stdout = '''
{
  "error": "unknown view nope",
  "stale": []
}
'''
exit = 1

[test."$ clice analyze modules --view edge --from core"]
stdout = '''
{
  "error": "--view edge needs --from and --to",
  "stale": []
}
'''
exit = 1

[test."$ clice analyze modules --scope \"[\""]
stdout = '''
{
  "error": "invalid --scope glob '[': unmatched `[`",
  "stale": []
}
'''
exit = 1

[test."$ clice analyze modules --merge core+nowhere"]
stdout = '''
{
  "error": "--merge core+nowhere: no module nowhere",
  "stale": []
}
'''
exit = 1

[test."$ clice analyze modules --move nowhere.h=core"]
stdout = '''
{
  "error": "--move nowhere.h=core: no scoped file nowhere.h",
  "stale": []
}
'''
exit = 1

[test."$ clice analyze modules --move-entity Nowhere=core/nowhere.h"]
stdout = '''
{
  "error": "--move-entity Nowhere=core/nowhere.h: symbol not found",
  "stale": []
}
'''
exit = 1

[test."$ clice analyze modules --partition nowhere.json"]
