{
  "error": "cannot read nowhere.json: No such file or directory",
  "stale": []
}
'''
exit = 1

[test."$ clice analyze modules --annotation nowhere.json"]
stdout = '''
{
  "error": "cannot read nowhere.json: No such file or directory",
  "stale": []
}
'''
stderr = ["warning: no churn annotation: Process git ended with exit code 128"]
exit = 1

[test."$ clice analyze modules --depth deep"]
stdout = '''
{
  "error": "at argv[1]:\n  --depth deep\n          ^~~~\n  invalid integer value: deep",
  "stale": []
}
'''
exit = 2

