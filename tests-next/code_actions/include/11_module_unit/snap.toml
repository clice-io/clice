[answers.string]
wrong = "the directive goes above the comment that opens the file, such as a license header; it belongs below it"

[[answers.string.code_actions]]
kind = "quickfix"
title = "Add #include <string>"
compiles = true

[answers.string.code_actions.edits]
"main.cpp" = '''
+module;
+#include <string>
 // A module unit without a global module fragment opens one for the
 // directive: no include may follow the module declaration.
'''
