[answers.move]
wrong = "std::move needs <utility>, yet no include is offered for it"
code_actions = []

[answers.size_t]
wrong = "seven headers are offered for std::size_t, where the one a user wants is <cstddef>"

[[answers.size_t.code_actions]]
kind = "quickfix"
title = "Add #include <cstddef>"

[answers.size_t.code_actions.edits]
"main.cpp" = '''

 #include "config.h"
+#include <cstddef>

 struct Box {};
'''

