## # clice configuration

# Strings can reference these variables with the syntax `${var}`:
# - `${workspace}`:  the project's root directory.
# - `${env:NAME}`:   the environment variable NAME; one that is not set is
#                    an error.
#
# Relative paths and patterns resolve against the project root.

# The build configuration active at startup, one of the tags declared on
# rules below. When rules carry tags and this names none of them, the first
# declared tag is used.
# default_configuration = "debug"

# Directory for storing on-disk caches (PCH, PCM and index files) and logs.
# Both default to the workspace: ${workspace}/.clice and its logs/
# subdirectory; the default keeps itself out of git and backups via a
# generated .gitignore and CACHEDIR.TAG (an explicitly configured
# directory is never marked). Keep the cache on a local disk.
# cache_dir = "${workspace}/.clice"
# logging_dir = "${workspace}/.clice/logs"

# clice looks at files on disk in the background to notice changes the editor
# never reports: compile_commands.json edits (regenerated by the build system)
# and files changing on disk behind the server's back (e.g. git checkout).
# Longest interval in seconds between two background looks at a workspace
# file; 0 disables background polling, compile_commands.json included.
poll_seconds = 30

[workers]
# Workers keeping the open files compiled and answering requests about them.
foreground = 2
# The most compiles the background index runs at once, never more than
# `max`: "auto" (half the physical cores, at least 2) or a number.
background = "auto"
# The most compile workers at once: "auto" (the physical cores) or a number.
max = "auto"
# How long the background index waits after the last edit or request.
background_delay_ms = 3000

# Rules name files by pattern and say where they take their compile commands
# from, how those commands are edited, and how the files are indexed, served,
# linted and formatted. Every rule matching a file applies, in declaration
# order: an earlier rule's databases rank first, `append` and `remove`
# accumulate with a later `remove` cancelling an earlier `append`, and every
# other field is decided by the first matching rule that sets it. A rule for
# some files goes before a rule for all of them; a rule without patterns,
# last, sets what every other file gets.

# Third-party code: its function bodies are skipped in every compile but its
# own, and it is neither indexed on its own, linted nor formatted.
# [[rules]]
# patterns = ["third_party/**"]
# skip_function_body = true
# background_index = false
# lint = false
# format = false

[[rules]]
# Files matching the specified pattern will have this rule applied. Omitted
# means every file. A relative pattern starts at the project root; a pattern
# starting with `/` or `**` matches the absolute path. Separators are `/`.
#
# Patterns can use the following syntax:
# - `*`: Matches one or more characters in a path segment.
# - `?`: Matches a single character in a path segment.
# - `**`: Matches any number of path segments, including none.
# - `{}`: Groups conditions (e.g., `**/*.{ts,js}` matches all TypeScript
#   and JavaScript files).
# - `[]`: Declares a range of characters to match in a path segment
#   (e.g., `example.[0-9]` matches `example.0`, `example.1`, etc.).
# - `[!...]`: Negates a range of characters to match in a path segment
#   (e.g., `example.[!0-9]` matches `example.a`, `example.b`, but not `example.0`).
# patterns = ["src/**"]
# Build configuration tag: the rule applies only while this configuration is
# active. Untagged rules always apply. The distinct tags form the menu.
# configuration = "debug"
# Compilation databases these files take their commands from, in priority
# order. Every entry applies to its own file; patterns and order only decide
# which entry wins when a file appears in several databases. A rule without
# patterns names the project's databases; when no rule declares a source,
# the project root and its immediate subdirectories are searched for one.
# compile_commands = ["build/debug"]
# The compile command for matching files without a database entry, without
# the source file: a shell-style string or an argv array, run from the
# project root. Matching sources on disk join the background index.
# default_command = "clang++ -std=c++20 -Iinclude"
# Commands to append to the original command list (e.g., ["-std=c++17"]).
append = []
# Commands to remove from the original command list.
remove = []
# Whether the background index compiles matching sources as units of their
# own.
# background_index = true
# Unset: the editor skips the function bodies of the headers at the top of
# an open file. true: every compile but the file's own skips its bodies.
# false: no compile skips them.
# skip_function_body = true
# Whether the index records what the files' function bodies use, and the
# instantiations of their templates; unset, false for system headers only.
# index_function_body = true
# How open files are served: "off" (compiled), "on" (from the index alone)
# or "auto" (from the index until the first edit).
# readonly = "off"
# Whether a header compiles on its own rather than inside a file including
# it; unset, clice finds out.
# self_contained = true
# Whether the code an open file's own context skips shows what the file's
# other contexts compile there.
# other_contexts = true
# Whether `clice lint` checks the files and the editor runs clang-tidy on them.
# lint = true
# Whether `clice format` formats the files.
# format = true
