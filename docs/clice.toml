## # clice configuration

# This section outlines the supported built-in variables for clice.
# These variables can be referenced in strings using the syntax `${var}`.

# Supported variables:
# - `${workspace}`:       The workspace directory provided by the client.
#
# Relative paths and patterns resolve against the directory of this file.

# Compilation databases for the whole workspace, in priority order: a
# compile_commands.json or a directory containing one. When neither this nor
# any rule declares a source, the workspace root and its immediate
# subdirectories are searched for one.
compile_commands = ["build"]

# The build configuration active at startup, one of the tags declared on
# rules below. When rules carry tags and this names none of them, the first
# declared tag is used.
# default_configuration = "debug"

[project]
# Directory for storing on-disk caches (PCH, PCM and index files) and logs.
# Both default to the workspace: ${workspace}/.clice and its logs/
# subdirectory; the default keeps itself out of git and backups via a
# generated .gitignore and CACHEDIR.TAG (an explicitly configured
# directory is never marked).
# cache_dir = "${workspace}/.clice"
# logging_dir = "${workspace}/.clice/logs"

[tracker]
# clice polls the filesystem to notice changes the editor never reports:
# compile_commands.json edits (regenerated by the build system) and files
# changing on disk behind the server's back (e.g. git checkout).
# Poll interval for compile_commands.json in seconds; 0 disables it.
cdb_poll_seconds = 3
# Interval of the workspace file sweep in seconds; 0 disables it.
workspace_poll_seconds = 30

# Rules name files by pattern and say where they take their compile commands
# from and how those commands are edited. Every rule matching a file applies,
# in declaration order: an earlier rule's databases rank first, the first
# `default_command` wins, `append` and `remove` accumulate with a later
# `remove` cancelling an earlier `append`, and `index = false` on any matching
# rule wins.
[[rules]]
# Files matching the specified pattern will have this rule applied. Omitted
# means every file. Patterns are relative to this file's directory; a
# pattern starting with `/` or `**` matches the absolute path.
#
# Patterns can use the following syntax:
# - `*`: Matches one or more characters in a path segment.
# - `?`: Matches a single character in a path segment.
# - `**`: Matches any number of path segments, including none.
# - `{}`: Groups conditions (e.g., `**/*.{ts,js}` matches all TypeScript
#   and JavaScript files).
# - `[]`: Declares a range of characters to match in a path segment
#   (e.g., `example.[0-9]` matches `example.0`, `example.1`, etc.).
# - `[!...]`: Negates a range of characters to match in a path segment
#   (e.g., `example.[!0-9]` matches `example.a`, `example.b`, but not `example.0`).
patterns = ["**/*"]
# Build configuration tag: the rule applies only while this configuration is
# active. Untagged rules always apply. The distinct tags form the menu.
# configuration = "debug"
# Compilation databases these files take their commands from, in priority
# order. Every entry applies to its own file; patterns and order only decide
# which entry wins when a file appears in several databases.
# compile_commands = ["build/debug"]
# The compile command for matching files without a database entry, without
# the source file: a shell-style string or an argv array, run from this
# file's directory. Matching sources on disk join the background index.
# default_command = "clang++ -std=c++20 -Iinclude"
# Commands to append to the original command list (e.g., ["-std=c++17"]).
append = []
# Commands to remove from the original command list.
remove = []
# Whether matching translation units join the background index.
index = true
