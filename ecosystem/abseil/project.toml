about = "20260817.0 with its tests, built as C++20"
repository = "https://github.com/abseil/abseil-cpp"
commit = "2065f4ded0558c6f89fee67c8e5228feb4eb960e"

[configurations.clang]
about = "built by clang"
database = "build/compile_commands.json"

[[configurations.clang.prepare]]
run = [
    "cmake",
    "-S",
    ".",
    "-B",
    "build",
    "-G",
    "Ninja",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "${CMAKE_TOOLCHAIN}",
    "-DCMAKE_C_COMPILER=clang",
    "-DCMAKE_CXX_COMPILER=clang++",
    "-DCMAKE_CXX_STANDARD=20",
    "-DABSL_BUILD_TESTING=ON",
    "-DABSL_GOOGLETEST_DOWNLOAD_URL=https://github.com/google/googletest/archive/52eb8108c5bdec04579160ae17225d66034bd723.zip"
]

[configurations.gcc]
about = "built by Ubuntu's GCC 13: libstdc++, and the search paths, macros and defaults GCC's driver adds"
platforms = ["linux"]
packages = ["g++-13"]
database = "build/compile_commands.json"

[[configurations.gcc.prepare]]
run = [
    "cmake",
    "-S",
    ".",
    "-B",
    "build",
    "-G",
    "Ninja",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "-DCMAKE_C_COMPILER=gcc-13",
    "-DCMAKE_CXX_COMPILER=g++-13",
    "-DCMAKE_CXX_STANDARD=20",
    "-DABSL_BUILD_TESTING=ON",
    "-DABSL_GOOGLETEST_DOWNLOAD_URL=https://github.com/google/googletest/archive/52eb8108c5bdec04579160ae17225d66034bd723.zip"
]

[configurations.msvc]
about = "built by MSVC's cl, its database read by servers started without Visual Studio's environment, as an editor launched normally is"
platforms = ["windows"]
environment = "vcvars"
database = "build/compile_commands.json"

[[configurations.msvc.prepare]]
run = [
    "cmake",
    "-S",
    ".",
    "-B",
    "build",
    "-G",
    "Ninja",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "-DCMAKE_C_COMPILER=cl",
    "-DCMAKE_CXX_COMPILER=cl",
    "-DCMAKE_CXX_STANDARD=20",
    "-DABSL_BUILD_TESTING=ON",
    "-DABSL_GOOGLETEST_DOWNLOAD_URL=https://github.com/google/googletest/archive/52eb8108c5bdec04579160ae17225d66034bd723.zip"
]
