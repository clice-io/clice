about = "llvmorg-23.1.3, generated headers built, optional libraries off (the compiler's sysroot has none)"
repository = "https://github.com/llvm/llvm-project"
commit = "0d261d1ca552c95a8f007e061c787ac7132fbcbc"

[configurations.all]
about = "eight subprojects, split in five parts"
database = "build/compile_commands.json"

[[configurations.all.prepare]]
run = [
    "cmake",
    "-S",
    "llvm",
    "-B",
    "build",
    "-G",
    "Ninja",
    "-DCMAKE_BUILD_TYPE=Release",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "${CMAKE_TOOLCHAIN}",
    "-DCMAKE_C_COMPILER=clang",
    "-DCMAKE_CXX_COMPILER=clang++",
    "-DLLVM_ENABLE_PROJECTS=clang;clang-tools-extra;lld;lldb;mlir;polly;flang;bolt",
    "-DLLVM_ENABLE_ZLIB=OFF",
    "-DLLVM_ENABLE_ZSTD=OFF",
    "-DLLVM_ENABLE_LIBXML2=OFF",
    "-DLLVM_ENABLE_TERMINFO=OFF",
    "-DLLVM_ENABLE_LIBEDIT=OFF",
    "-DLLVM_ENABLE_LIBPFM=OFF",
    "-DLLVM_ENABLE_FFI=OFF",
    "-DLLVM_ENABLE_CURL=OFF",
    "-DLLVM_ENABLE_HTTPLIB=OFF",
    "-DLLDB_ENABLE_LIBEDIT=OFF",
    "-DLLDB_ENABLE_CURSES=OFF",
    "-DLLDB_ENABLE_LZMA=OFF",
    "-DLLDB_ENABLE_PYTHON=OFF",
    "-DLLDB_ENABLE_LUA=OFF",
    "-DLLDB_ENABLE_LIBXML2=OFF"
]

[[configurations.all.prepare]]
generated = "build"

[configurations.all.parts]
llvm = ["llvm/", "third-party/", "build/"]
clang = ["clang/", "clang-tools-extra/", "build/tools/clang/"]
mlir = ["mlir/", "build/tools/mlir/"]
flang = ["flang/", "build/tools/flang/"]
lldb = ["lldb/", "lld/", "bolt/", "polly/", "build/tools/lldb/", "build/tools/lld/"]

[configurations.clang]
about = "clang alone, for X86, its tests on"
database = "build/compile_commands.json"

[[configurations.clang.prepare]]
run = [
    "cmake",
    "-S",
    "llvm",
    "-B",
    "build",
    "-G",
    "Ninja",
    "-DCMAKE_BUILD_TYPE=Release",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "${CMAKE_TOOLCHAIN}",
    "-DCMAKE_C_COMPILER=clang",
    "-DCMAKE_CXX_COMPILER=clang++",
    "-DLLVM_ENABLE_PROJECTS=clang",
    "-DLLVM_TARGETS_TO_BUILD=X86",
    "-DLLVM_ENABLE_ZLIB=OFF",
    "-DLLVM_ENABLE_ZSTD=OFF",
    "-DLLVM_ENABLE_LIBXML2=OFF",
    "-DLLVM_ENABLE_TERMINFO=OFF",
    "-DLLVM_ENABLE_LIBEDIT=OFF",
    "-DLLVM_ENABLE_LIBPFM=OFF",
    "-DLLVM_ENABLE_FFI=OFF",
    "-DLLVM_ENABLE_CURL=OFF",
    "-DLLVM_ENABLE_HTTPLIB=OFF"
]

[[configurations.clang.prepare]]
generated = "build"
