about = "SQLite 3.50.4's amalgamation: its 9 MB sqlite3.c and the shell"

[archive]
url = "https://www.sqlite.org/2025/sqlite-amalgamation-3500400.zip"
sha256 = "1d3049dd0f830a025a53105fc79fd2ab9431aea99e137809d064d8ee8356b032"

[configurations.clang]
about = "compiled as its build does, with full-text search and R-trees, by clang"
platforms = ["linux"]
database = "compile_commands.json"

[[configurations.clang.prepare]]
[[configurations.clang.prepare.database]]
directory = "${CHECKOUT}"
file = "${CHECKOUT}/sqlite3.c"
arguments = [
    "clang",
    "-c",
    "-O2",
    "-DSQLITE_THREADSAFE=1",
    "-DSQLITE_ENABLE_FTS5",
    "-DSQLITE_ENABLE_RTREE",
    "${CHECKOUT}/sqlite3.c"
]

[[configurations.clang.prepare.database]]
directory = "${CHECKOUT}"
file = "${CHECKOUT}/shell.c"
arguments = ["clang", "-c", "-O2", "${CHECKOUT}/shell.c"]
