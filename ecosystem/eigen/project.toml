about = "Eigen at d71c30c4 with its tests"
repository = "https://gitlab.com/libeigen/eigen"
commit = "d71c30c47858effcbd39967097a2d99ee48db464"

[configurations.clang]
about = "built by clang, 120 of its test units kept: each instantiates the library afresh"
platforms = ["linux"]
database = "build/compile_commands.json"
keep = 120

[[configurations.clang.prepare]]
run = [
    "cmake",
    "-S",
    ".",
    "-B",
    "build",
    "-G",
    "Ninja",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "${CMAKE_TOOLCHAIN}",
    "-DCMAKE_C_COMPILER=clang",
    "-DCMAKE_CXX_COMPILER=clang++",
    "-DBUILD_TESTING=ON"
]
